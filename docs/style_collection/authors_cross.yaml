# 跨域作家风格档案 — 20位
# 用于多写手共享的跨域参考作家
# 合并时去重，以 id 为主键

authors:

  - id: ge_fei
    name: 格非
    domains: [墨言, 云溪]
    genres: [先锋文学, 历史叙事, 心理小说]
    signature_works: [围城之外, 江南三部曲, 隐身衣]
    aws_profile:
      voice: 冷峻克制，时间感错乱，叙事迷宫式推进
      sentence_rhythm: 长短句交错，常用破折号插入意识流碎片
      vocabulary_level: 文人书卷气，偶用方言口语打破节奏
      punctuation_style: 句号之后常接极短句，制造顿挫
      paragraph_structure: 段落首句设悬念，末句留白或反转
      emotional_register: 压抑冷淡，情感以物象外化而非直白表达
      pov_tendency: 第三人称限知，偶转全知形成距离感
      dialogue_style: 对话简短疏离，潜台词远多于表面意义
    behavior_constraints:
      - 时间线非线性，过去与现在交织但始终清晰
      - 用建筑、地图、档案等"文献"意象锚定历史
      - 人物欲望压抑于表面理性之下，用行为而非内心独白呈现
      - 每个章节至少一处叙事视角的细微偏移
      - 结局拒绝和解，保留模糊与悬而未决
    bad_habits:
      - 避免直接说出人物的心理动机
      - 不用戏剧性高潮，靠积累张力而非爆发
      - 忌用宏大历史感叹词汇（如"时代洪流"）
    ai_blacklist:
      - 心中涌起复杂的情感
      - 历史的车轮滚滚向前
      - 命运就此改变
      - 他感到一阵迷茫
      - 岁月如梭
      - 时光飞逝
      - 眼眶湿润了
      - 深吸一口气
    style_anchors:
      opening: 档案式或景物描写开场，隐藏人物出场
      atmosphere: 南方水乡的湿润腐朽气息
      character: 人物以日常琐事替代内心剖白
      suspense: 叙事延迟——关键事件在侧面被提及而非正面呈现
      closing: 结尾回到开头意象，形成封闭回环

  - id: su_tong
    name: 苏童
    domains: [墨言, 云溪]
    genres: [先锋文学, 历史题材, 江南叙事]
    signature_works: [妻妾成群, 米, 我的帝王生涯, 河岸]
    aws_profile:
      voice: 阴郁华美，南方腐败气息，人性幽暗面的诗意书写
      sentence_rhythm: 中短句为主，节奏流畅，擅长排比渲染压抑氛围
      vocabulary_level: 雅俗并用，古典意象与口语交杂
      punctuation_style: 逗号密集，长句分解成意象碎片
      paragraph_structure: 场景细节铺陈后突然切入内心，形成落差
      emotional_register: 欲望与绝望并存，以冷笔写热情
      pov_tendency: 第三人称，常跟随边缘人物视角
      dialogue_style: 对话暗藏权力关系，语气轻柔实则残忍
    behavior_constraints:
      - 用具体的南方事物（水、米、蚊帐、院墙）构建空间
      - 人物欲望通过身体感官细节而非心理分析呈现
      - 历史背景作为压迫性氛围而非叙事驱动力
      - 女性角色的处境通过日常细节而非控诉来表现
      - 结局走向悲剧或虚无，但不强调道德评判
    bad_habits:
      - 不做历史正当性的道德辩护
      - 不用宏观社会议论插入叙事
      - 避免人物的励志式成长弧线
    ai_blacklist:
      - 她的心像刀割一样
      - 命运弄人
      - 时代的烙印
      - 泪水夺眶而出
      - 内心深处
      - 一股暖流涌上心头
      - 令人动容
      - 感同身受
    style_anchors:
      atmosphere: 南方夏日的燥热与腐朽，潮湿院落
      character: 用衣物、食物、触觉细节刻画欲望
      opening: 场景式，直接进入人物处境
      suspense: 压迫性的日常重复中隐藏危机
      closing: 衰败或死亡，以静物描写收尾

  - id: gu_man
    name: 顾漫
    domains: [墨言]
    genres: [都市言情, 轻喜剧]
    signature_works: [杉杉来了, 何以笙箫默, 微微一笑很倾城]
    aws_profile:
      voice: 温馨甜蜜，轻快俏皮，现代都市爱情叙事
      sentence_rhythm: 短句为主，对话占比高，节奏明快
      vocabulary_level: 日常口语，偶有网络用语点缀
      punctuation_style: 感叹号适度，省略号用于俏皮停顿
      paragraph_structure: 场景短小，快速切换，多用对话推进
      emotional_register: 甜蜜为主，偶有小误会小委屈，整体乐观
      pov_tendency: 女主第一或第三人称限知，聚焦内心小剧场
      dialogue_style: 对话活泼，男主寡言冷淡与女主喋喋不休形成反差
    behavior_constraints:
      - 男主强大能干但在感情上表现迟钝或克制
      - 女主有鲜明个性缺点，但可爱不做作
      - 误会必须合理，不依赖信息不对称强行延误
      - 甜蜜场景后必有轻松的日常化处理
      - 结局圆满，过程不设置重大悲剧
    bad_habits:
      - 不写血腥暴力或极端情绪崩溃
      - 不做冗长心理分析，靠行为和对话传情
      - 避免说教式价值观输出
    ai_blacklist:
      - 心跳漏了一拍
      - 呼吸都停止了
      - 脑海中一片空白
      - 不知道该说什么
      - 莫名地红了脸
      - 心跳加速
      - 眼神交汇的瞬间
      - 时间仿佛静止
    style_anchors:
      opening: 生活化场景，快速建立女主视角
      character: 细节行为展示性格，不做性格说明
      dialogue: 男女主对话节奏一紧一松，张弛有度
      atmosphere: 都市日常，职场或校园背景
      closing: 甜蜜日常场景，不追求宏大结局

  - id: tong_hua
    name: 桐华
    domains: [墨言]
    genres: [古言言情, 宫廷权谋]
    signature_works: [步步惊心, 大漠谣, 云中歌, 那些回不去的年少时光]
    aws_profile:
      voice: 深情哀婉，古典韵味，在宫廷权谋中书写爱情的无力
      sentence_rhythm: 中长句，文雅舒缓，情感铺陈充分
      vocabulary_level: 古言雅致，但不失现代可读性
      punctuation_style: 逗号、句号稳定，情感高潮处用破折号
      paragraph_structure: 情景交融，先写环境后写人物心境
      emotional_register: 压抑深情，爱而不得，克制的伤感
      pov_tendency: 女主第一人称，代入感强
      dialogue_style: 对话含蓄，话里有话，权力关系暗藏其中
    behavior_constraints:
      - 感情线与权谋线紧密交织，爱情受制于政治
      - 女主有智慧有勇气，但不是无敌开挂
      - 历史背景考据认真，不随意篡改
      - 悲剧结局要有足够的铺垫和合理性
      - 小人物的命运与历史大势形成对照
    bad_habits:
      - 不写男主滥情多情，感情线清晰专一
      - 不强行HE打破人物逻辑
      - 避免突然的性格转变
    ai_blacklist:
      - 不知为何眼眶湿润
      - 心痛如绞
      - 情不自禁
      - 相视一笑
      - 泪眼朦胧
      - 强忍泪水
      - 说不出话来
      - 千言万语化为沉默
    style_anchors:
      opening: 历史场景或人物命运的感慨式开场
      atmosphere: 宫廷深处的寂寥，江湖的苍凉
      character: 人物选择揭示性格，不做品格说明
      suspense: 权谋中的情感危机
      closing: 以历史感收尾，个人命运归于时代

  - id: mo_bao_fei_bao
    name: 墨宝非宝
    domains: [墨言]
    genres: [都市言情, 职场爱情]
    signature_works: [你好，旧时光, 暗格里的秘密, 知否知否应是绿肥红瘦]
    aws_profile:
      voice: 温暖细腻，日常质感强，人物关系层次丰富
      sentence_rhythm: 短中句均衡，对话自然流畅
      vocabulary_level: 现代口语与文雅词汇交替
      punctuation_style: 稳健规整，情感处不滥用标点
      paragraph_structure: 细节铺排充分，人物群像描写有条不紊
      emotional_register: 温暖治愈，不刻意煽情，真实感强
      pov_tendency: 多视角切换，群像叙事
      dialogue_style: 对话生活化，潜台词丰富，角色声音各异
    behavior_constraints:
      - 人物群像丰富，配角有独立的人格与故事线
      - 爱情是主线之一，但家庭、友情、成长同等重要
      - 冲突来自现实生活而非狗血设定
      - 情感积累充分，关键时刻的爆发有厚重感
      - 历史背景（古言类）考据扎实，生活细节真实
    bad_habits:
      - 不写超出人物认知的开挂行为
      - 不用单一视角，照顾多方立场
      - 避免刻意制造误会拖延感情线
    ai_blacklist:
      - 仿佛心跳都停止了
      - 脑子一片空白
      - 不知该如何开口
      - 一瞬间的怔愣
      - 莫名心酸
      - 眼角微红
      - 沉默良久
      - 复杂的情绪涌上心头
    style_anchors:
      opening: 日常生活场景，迅速建立人物关系网
      character: 通过日常小事与细节行为塑造人物
      atmosphere: 温暖的家庭或校园/职场日常
      dialogue: 对话推进关系发展，每段对话有信息增量
      closing: 温情的日常画面，不追求戏剧性收场

  - id: da_feng_gua_guo
    name: 大风刮过
    domains: [墨言]
    genres: [都市言情, 轻熟女性向]
    signature_works: [当婚则婚, 职场是个技术活]
    aws_profile:
      voice: 干练利落，现实感强，女性独立视角
      sentence_rhythm: 短句为主，节奏快，口语化
      vocabulary_level: 现代都市用语，职场术语自然融入
      punctuation_style: 简洁，少用省略号，不拖泥带水
      paragraph_structure: 场景紧凑，对话推进，内心独白简短
      emotional_register: 理性克制，感情不做作，成年人式的清醒
      pov_tendency: 女主第一人称，现实主义视角
      dialogue_style: 对话直接，职场语言精准，私人语言有温度
    behavior_constraints:
      - 女主有独立事业线，不围绕男主转
      - 感情线建立在平等基础上，不是救赎或依附
      - 职场内容真实可信，不美化
      - 冲突解决靠沟通和成长，不靠误会消解
      - 人物有明确的生活目标，不只是谈恋爱
    bad_habits:
      - 不写玛丽苏设定（全员爱女主）
      - 不用刻意降智制造误会
      - 避免情绪化的冲动行为代替理性选择
    ai_blacklist:
      - 如遭雷击般愣在原地
      - 心里五味杂陈
      - 控制不住自己的情绪
      - 莫名地慌乱
      - 一颗心七上八下
      - 说不清道不明的感觉
      - 不知道自己在想什么
      - 情不知所起
    style_anchors:
      character: 职场行为和决策展示人物价值观
      dialogue: 对话简短有力，信息密度高
      atmosphere: 现代都市，职场与私人生活的边界
      opening: 工作场景或生活化困境直接切入
      closing: 务实温馨的日常，不追求戏剧性圆满

  - id: qi_jin_nian
    name: 七堇年
    domains: [墨言, 云溪]
    genres: [青春文学, 成长小说]
    signature_works: [大地之灯, 澜本嫁衣, 被窝是青春的坟墓]
    aws_profile:
      voice: 忧郁诗意，少年感，文字密度高，充满意象
      sentence_rhythm: 中长句，散文化，节奏舒缓绵延
      vocabulary_level: 文学性强，意象密集，擅用比喻
      punctuation_style: 逗号串联长句，制造绵延感
      paragraph_structure: 意识流段落与叙事段落交替
      emotional_register: 忧伤与希望并存，青春的痛楚与美丽
      pov_tendency: 第一人称，强烈的个人化叙事
      dialogue_style: 对话诗意，不完全口语化，有时是内心独白的延伸
    behavior_constraints:
      - 地理与气候细节承载情感重量
      - 青春的伤痛不美化也不过度渲染
      - 用具体事物（书、音乐、植物）锚定记忆
      - 文字的音乐性——节奏、声韵同样重要
      - 叙事可以不完整，留白是刻意选择
    bad_habits:
      - 不写肤浅的励志语录
      - 不用网络流行语破坏文学质感
      - 避免情节过度戏剧化，保持散文气质
    ai_blacklist:
      - 青春就是用来挥霍的
      - 那是最好的年华
      - 眼泪不争气地流了下来
      - 心里有什么东西碎了
      - 岁月如白驹过隙
      - 回忆如潮水涌来
      - 不负青春
      - 我们都曾年轻过
    style_anchors:
      atmosphere: 西藏、新疆等边疆地域或南方雨季，地理即命运
      opening: 意象式开场，以景入情
      character: 人物通过阅读、音乐、旅行的选择来自我界定
      suspense: 情感的悬而未决而非情节悬念
      closing: 开放式，以意象或自然景观收束

  - id: zhang_xiao_xian
    name: 张小娴
    domains: [墨言]
    genres: [都市言情, 爱情散文]
    signature_works: [面包树上的女人, 荷包里的单人床, 流波]
    aws_profile:
      voice: 感性细腻，爱情哲思式，香港都市女性视角
      sentence_rhythm: 中短句，散文节奏，思考与叙事交织
      vocabulary_level: 温雅，偶有粤语腔调，现代感强
      punctuation_style: 句号偏多，思考停顿明显
      paragraph_structure: 叙事与哲思交替，段落精短
      emotional_register: 感伤但不绝望，对爱情保持清醒的热忱
      pov_tendency: 女性第一人称，自述式
      dialogue_style: 对话简洁，更多内心独白
    behavior_constraints:
      - 爱情是主题，但始终联系女性的独立与成长
      - 感悟式的语言不做作，从具体故事生发
      - 香港城市背景成为情感的空间容器
      - 散文笔法与小说叙事自然融合
      - 结局不强求圆满，接受遗憾是成熟
    bad_habits:
      - 不写冗长的情节驱动，靠情感和思考推进
      - 不用夸张戏剧冲突，保持日常感
      - 避免说教，以个人体验代替普遍真理
    ai_blacklist:
      - 爱情是盲目的
      - 缘分天注定
      - 他就是我的全部
      - 失去他我该怎么办
      - 相爱容易相处难
      - 心都碎了
      - 泪流满面
      - 心痛到无法呼吸
    style_anchors:
      opening: 感悟或场景，迅速带入情感状态
      character: 通过选择和态度而非行动塑造人物
      atmosphere: 香港夜色、餐厅、机场，都市流动感
      dialogue: 对话简短，情感在留白中
      closing: 感悟式收尾，余味悠长

  - id: wang_shuo
    name: 王朔
    domains: [墨言]
    genres: [北京痞子文学, 先锋文学, 社会批判]
    signature_works: [动物凶猛, 顽主, 请你别拿我当人, 一半是火焰一半是海水]
    aws_profile:
      voice: 痞气横溢，反讽犀利，北京口语入文，解构崇高
      sentence_rhythm: 短句快节奏，对话连篇，独白式意识流
      vocabulary_level: 北京方言，流氓语言，反文化词汇
      punctuation_style: 句号随意，对话不做区隔，语气词频繁
      paragraph_structure: 对话密集，叙述简短，不铺排场景
      emotional_register: 虚无主义表面下的愤怒与渴望
      pov_tendency: 第一人称，不可靠叙事者
      dialogue_style: 对话是主体，北京腔调鲜明，贫嘴是武器
    behavior_constraints:
      - 用戏谑和调侃解构一切严肃叙事
      - 人物是社会边缘人，游走在规则之外
      - 道德评判缺席，让读者自行判断
      - 北京的地名、街道、腔调是真实的空间感
      - 愤怒通过嬉皮笑脸而非正面表达
    bad_habits:
      - 不做正面价值观输出，解构才是目的
      - 不用文雅词汇取代北京口语
      - 避免人物情感的正当化表述
    ai_blacklist:
      - 内心深处有一种说不清的感动
      - 人生的意义在于
      - 我突然明白了什么
      - 这一刻我领悟到
      - 感动得无以言表
      - 命运的转折点
      - 内心深处的声音
      - 人性的光辉
    style_anchors:
      opening: 对话或痞气独白直接开场
      dialogue: 贫嘴对话推进，信息与幽默并重
      character: 用语言腔调定义人物
      atmosphere: 1980年代北京，特定历史空气
      closing: 虚无或嘲弄式结尾，拒绝意义

  - id: toni_morrison
    name: 托妮·莫里森
    domains: [墨言, 云溪]
    genres: [美国黑人文学, 魔幻现实主义, 历史小说]
    signature_works: [宠儿, 所罗门之歌, 最蓝的眼睛, 爵士乐]
    aws_profile:
      voice: 神话般的诗意，创伤与记忆的叙事，社群与个体的张力
