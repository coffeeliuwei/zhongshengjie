      情感正面直写：爱就写爱，恨就写恨，没有隐晦；
      人性光芒不在奇迹里，在日常坚持里；
      叙述者与人物同频，没有距离感，没有俯视。
    behavior_constraints:
      - 劳动者人物必须有自己的尊严逻辑：他为什么这样选择（不是愚昧）
      - 情感直写：可以说"他爱她"，然后写他如何爱
      - 苦难场景不做异化处理，写实际发生了什么，当事人如何面对
      - 叙述者与农村/劳动阶层人物同等视角，不俯视，不怜悯
      - 人物在困境中的坚持要写出具体的行动，不用"坚强"等抽象词
      - 城乡冲突是重要主题：人物在两个世界之间的撕裂要写真实
      - 爱情写成现实的力量，不是对现实的逃避
    bad_habits:
      - 叙述有时说教性偏强，倾向于给人物和读者上价值观
      - 部分女性人物写得较为单薄
      - 叙述节奏在某些段落过于沉重，缺乏轻盈时刻
    ai_blacklist:
      - 卑微的农民
      - 可怜的穷人
      - 愚昧无知
      - 落后的农村
      - 底层百姓
      - 贫苦大众
      - 可悲的命运
      - 无力改变
      - 认命吧
      - 天生如此
    style_anchors:
      character: >
        【人物锚点】路遥的人物平凡但不平庸。他们在黄土地上挣扎，
        但挣扎本身是尊严的形式。苦难中的人性光芒不是奇迹，
        是每天早上还是起床去田里的那个动作。

  - id: tie_ning
    name: 铁凝
    domains: [墨言]
    genres: [纯文学]
    signature_works: [玫瑰门, 大浴女, 哦，香雪]
    aws_profile: >
      LLM默认写法：女性内心世界写成情感表达和关系处理，历史是背景。
      差异：铁凝将历史压抑具体化为女性身体和欲望的压制——
      女性的欲望、野心、嫉妒、恐惧被写得极其真实，不做美化；
      心理描写细腻到生理层面：情绪有身体症状；
      历史不是装饰，是造就女性心理状态的直接力量；
      女性人物之间的竞争与联结同等真实。
    behavior_constraints:
      - 女性欲望（含野心、嫉妒、性欲）正面呈现，不做道德评判
      - 心理描写下沉到生理：她紧张时身体有什么反应
      - 历史压制通过女性日常生活的具体细节体现
      - 女性人物之间的关系写得复杂：竞争与联结可以同时存在
      - 人物的"坏"（自私/嫉妒）写得可理解，有其历史与心理来源
      - 身体在历史中的遭遇是叙述的重要维度
      - 叙述视角贴近女性内在，但保持叙述者的一定距离（不是意识流）
    bad_habits:
      - 部分作品象征层过重，影响叙述流畅度
      - 历史批判有时显得过于直接
    ai_blacklist:
