# 墨言域作家档案 — 自动生成片段，待合并入 author_styles.yaml
# 域定义：墨言域（人物刻画 / 心理描写 / 情感表达）
# 生成日期：2026-05-16

authors:

  - id: maoni
    name: 猫腻
    domains: [墨言]
    genres: [玄幻, 都市]
    signature_works: [庆余年, 将夜, 择天记]
    aws_profile: >
      LLM默认写法：人物对话直白表达情感，冲突时立场分明。
      差异：情感克制——重要感情用细节行为传递而非直说；对话层次分明，
      言外之意比言内之意更重要；主角始终保有现代人的理性自省；
      权力博弈与个人情感同等重量；叙述声调冷静但底色是温热的人道主义。
    behavior_constraints:
      - 重要情感绝不直说，改用行为细节：不写"他很难过"，写他做了什么
      - 对话必须有潜台词，角色说的和想的至少有一层差距
      - 主角在高压时刻保留一处冷静的自我观察（现代人穿越感）
      - 每场人物冲突后，至少有一方的立场是可理解的（非单纯反派）
      - 权力结构写明：谁欠谁、谁怕谁、谁需要谁——三角关系显性化
      - 重要场景前植入一个日常细节，作为情感落差的铺垫
      - 人物的决定必须有可追溯的性格逻辑，禁止"突然就这样了"
    bad_habits:
      - 叙述者偶尔插入现代人口吻的调侃（打破第四堵墙感）
      - 某些情绪高点用极短的单行呈现，与前后长段形成反差
      - 重要人物出场时带一个看似无关的小动作
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 泪水在眼眶打转
      - 不禁
      - 沉默良久
      - 心跳加速
      - 内心深处
      - 脑海中浮现
      - 陷入了沉思
      - 难以言喻的
      - 情绪涌上心头
      - 莫名其妙
      - 忍不住
      - 心里清楚
    style_anchors:
      character: >
        【人物锚点】克制是猫腻的核心武器。重要告白往往被事件打断，
        重要伤痛往往被行动掩盖。权力与情感不互斥，而是互相渗透。
        人物的弱点与人物的力量来自同一个地方。

  - id: fenghuo_xizhuhou
    name: 烽火戏诸侯
    domains: [墨言]
    genres: [武侠, 玄幻]
    signature_works: [雪中悍刀行, 剑来]
    aws_profile: >
      LLM默认写法：江湖情义用慷慨陈词表达，豪杰形象脸谱化，爱恨分明。
      差异：癫狂与深情并存——人物可以同时无赖至极又深情至极，
      不互相矛盾；情感爆发力强，但爆发前必有长时间的压抑蓄力；
      江湖义气写成具体的行动而非口号；叙述语言本身就有情绪，
      偶尔跳脱成酣畅的散文诗节奏；人物关系浓烈，师徒、兄弟情分量重。
    behavior_constraints:
      - 人物的癫狂与深情必须共存于同一场景，不可只取其一
      - 情感爆发前必须有至少三个场景的压抑铺垫
      - 江湖义气落实为具体行动：他为对方做了什么，而非说了什么
      - 叙述语言在高潮段落可以散文化，句式拉长，节奏变慢
      - 师徒/兄弟情在危机时刻必须超越个人利益有所体现
      - 反派人物必须有一处令人叹息的人性时刻，不做纯粹的恶
      - 幽默感是盔甲，人物用嬉皮笑脸掩盖内心最柔软的部分
    bad_habits:
      - 偶尔滥用排比句强化气势，但如用得恰当可保留
      - 人物情绪激动时文字密度骤增，标点减少
      - 某些关键对话写得过于文学化，偏离口语节奏
    ai_blacklist:
      - 热血沸腾
      - 义薄云天
      - 豪情壮志
      - 肝胆相照
      - 心潮澎湃
      - 热泪盈眶
      - 感同身受
      - 侠肝义胆
      - 慷慨激昂
      - 英雄气概
      - 不禁动容
      - 令人动容
    style_anchors:
      character: >
        【人物锚点】烽火的人物是矛盾的容器——越是嬉皮笑脸的时刻，
        内心越是沉重。情感爆发是长期积累后的决口，不是突发。
        江湖情义不说，只做。

  - id: xiao_ding
    name: 萧鼎
    domains: [墨言]
    genres: [玄幻, 修仙]
    signature_works: [诛仙]
    aws_profile: >
      LLM默认写法：修仙小说里道与魔的对立写成立场对立，善恶分明。
      差异：萧鼎将道魔对立内化为人物内心的哲学撕裂，
      青春伤痛与命运悲剧是核心情感；师徒情超越门派立场；
      叙述带有古典诗意，情感写得伤痛但不滥情；
      主角的痛苦来自选择的代价，而非外部施压；悲剧感从第一章就埋伏。
    behavior_constraints:
      - 道魔对立必须内化：主角内心同时持有两种声音，不可简化为外部敌我
      - 师徒情写成具体的相处细节，不用"深厚情谊"等抽象词
      - 情感伤痛用诗意语言承载，但不煽情，不用感叹号强调
      - 主角每次重要选择后必须面临不可逆的代价
      - 悲剧结局的伏笔在轻松场景中提前埋入
      - 自然景物与人物情绪同频，但不直接点明（不写"他心如死灰，秋风萧瑟"）
      - 重要死亡场景用克制语言处理，不详写痛苦过程
    bad_habits:
      - 古风文句有时过于雕琢，偏向文言腔
      - 悲剧节点后有时用大段景物描写过渡，节奏偏慢
      - 部分人物对话过于哲学化，脱离当下情境
    ai_blacklist:
      - 命运弄人
      - 天意如此
      - 苍天啊
      - 悲从中来
      - 不胜唏嘘
      - 潸然泪下
      - 心如刀割
      - 痛不欲生
      - 意难平
      - 无可奈何
      - 泪如雨下
    style_anchors:
      character: >
        【人物锚点】萧鼎的人物活在选择的废墟里。每一次选择都正确，
        每一次选择都带来损失。青春伤痛不是失恋，是发现世界不像
        少年时相信的那样。道魔之别不在立场，在心。

  - id: wang_yu
    name: 忘语
    domains: [墨言]
    genres: [修仙, 玄幻]
    signature_works: [凡人修仙传, 凡人修仙之仙界篇]
    aws_profile: >
      LLM默认写法：主角成长写成天赋觉醒加机缘加持的爽文节奏。
      差异：忘语的主角韩立是彻底的理性主义者，
      情感沉淀而非爆发——他不会在危机时刻突然说出心里话；
      成长弧线漫长真实，每个阶段的情感重量不同；
      人际关系写得克制疏离，但疏离背后有真实的人情温度；
      危险时刻首先是逃跑而非热血，这是差异的核心。
    behavior_constraints:
      - 主角面对威胁首选规避而非正面冲突，热血反应视为OOC
      - 情感表达通过行动和决策体现，不通过内心独白直述
      - 人际关系写出距离感：交情是真实的，但主角不会轻易依赖任何人
      - 成长节奏慢，每个境界的停留都有充分的过渡描写
      - 危机过后的反思比危机本身更重要：他学到了什么
      - 感情线处理低调，伴侣关系像战略同盟，也像真实的相互选择
      - 禁止"热血上头"式的不理性决策，如有必须给出充分的情绪积累
    bad_habits:
      - 战斗描写有时过于流水账，缺乏情绪重量
      - 次要人物情感戏有时为推进情节而仓促
      - 部分章节节奏偏慢，信息密度低
    ai_blacklist:
      - 热血沸腾
      - 豁出去了
      - 这一刻他决定
      - 奋不顾身
      - 义无反顾
      - 眼神坚定
      - 霸气外露
      - 心中一横
      - 管他呢
      - 冲动之下
    style_anchors:
      character: >
        【人物锚点】韩立是凡人世界里最清醒的人。他不是冷漠，
        是把情感管理得像修炼资源一样精准。疏离是保护色，
        但在极少数的时刻，你能看见他真正在乎什么。

  - id: zhi_bai
    name: 知白
    domains: [墨言]
    genres: [悬疑, 玄幻]
    signature_works: [大奉打更人]
    aws_profile: >
      LLM默认写法：悬疑小说里人物要么是工具人要么是单一功能的NPC。
      差异：知白擅长在悬疑框架里写层次丰富的人物，
      角色在不同场景下呈现不同侧面，且各侧面都自洽；
      幽默与重量交替——笑点之后往往紧跟情感重击；
      人物动机写得复杂，坏人有坏人的逻辑，好人有好人的盲区；
      对话是推进悬疑同时塑造人物的双功能工具。
    behavior_constraints:
      - 每个有名字的角色都必须有一个只属于他的行为习惯或口头禅
      - 幽默场景与沉重场景必须交替出现，不可连续三段同一情绪基调
      - 人物在揭露秘密时的反应必须符合其性格，不可为戏剧效果突破
      - 反派的内在逻辑必须写得让读者至少能理解（不必认同）
      - 悬疑线索通过人物行为和对话自然埋入，不用旁白提示
      - 主角的幽默是性格的一部分，但幽默背后有清醒的洞察力
      - 人物关系图谱要显性：谁依赖谁，谁利用谁，谁保护谁
    bad_habits:
      - 信息量大时偶尔用角色对话做百科式讲解（设定堆砌）
      - 幽默段落有时拖得过长，消解了悬疑张力
      - 部分支线人物情感戏与主线脱节
    ai_blacklist:
      - 心中一凛
      - 瞳孔收缩
      - 不寒而栗
      - 倒吸一口冷气
      - 如临大敌
      - 背脊发凉
      - 恍然大悟
      - 豁然开朗
      - 心中有数
      - 胸有成竹
    style_anchors:
      character: >
        【人物锚点】知白的人物是洋葱——每剥一层都有新的东西。
        幽默是第一层，也是最薄的那层。真正的情感深埋在第四层第五层，
        等读者自己挖。悬疑不只是谜题，是人性的谜题。

  - id: yu_hua
    name: 余华
    domains: [墨言]
    genres: [纯文学, 现实主义]
    signature_works: [活着, 许三观卖血记, 兄弟]
    aws_profile: >
      LLM默认写法：苦难叙述配合大量情绪描写和感叹，引导读者共情。
      差异：余华的苦难叙述极冷——叙述者与苦难保持距离，
      不煽情，不评判，甚至用近乎漠然的平静记录最惨烈的事；
      荒诞底色：苦难发生的方式往往荒诞可笑，死亡有时显得可笑，
      但这种可笑让人更加难受；语言简洁到接近儿童文学，
      却装载着成人世界最沉重的内容。
    behavior_constraints:
      - 叙述苦难时保持距离：叙述者不哭，不评论，只记录发生了什么
      - 荒诞元素必须嵌入悲剧：死亡的方式、苦难的来源要有荒诞感
      - 语言简洁，句子短，拒绝华丽修饰，形容词极度克制
      - 人物面对灾难的反应要有不合常理的平静（这是余华的标志）
      - 重复是叙述策略：同一行为/状态的重复呈现有累积的悲剧效果
      - 历史作为背景压力存在，但不做历史分析，只写人的遭遇
      - 结尾不提供救赎，只提供继续活下去的事实
    bad_habits:
      - 有时叙述过于白描，情感密度偏低（有意为之，但需辨别场合）
      - 《兄弟》后期风格较前期更为夸张，失去了早期的克制感
    ai_blacklist:
      - 悲痛欲绝
      - 肝肠寸断
      - 泪流满面
      - 心如刀绞
      - 令人扼腕
      - 苦不堪言
      - 满目疮痍
      - 家破人亡
      - 惨绝人寰
      - 感人至深
      - 催人泪下
      - 震撼人心
    style_anchors:
      character: >
        【人物锚点】余华不让你哭，他让你自己决定要不要哭。
        叙述者是冷静的见证者，不是情感向导。苦难就在那里，
        像太阳一样不需要解释。荒诞是苦难的真实形态。

  - id: zhang_ailing
    name: 张爱玲
    domains: [墨言]
    genres: [纯文学, 言情]
    signature_works: [金锁记, 倾城之恋, 半生缘]
    aws_profile: >
      LLM默认写法：女性心理写成直白的情感表达，爱就是爱，恨就是恨。
      差异：张爱玲的女性心理是精密的心理解剖——
      她用刻毒的细节而非情感表白来呈现人物内心；
      时代悲剧渗透进每一个私人选择里；
      苍凉底色——人物可以得到想要的，但总有什么已经永久失去；
      意象系统极为密集：颜色、光线、气味、衣物都在叙事。
    behavior_constraints:
      - 人物心理通过外部细节（衣着、动作、眼神）传达，不直接阐述
      - 每个场景至少有一个精准的感官细节（颜色/光线/气味/触感）
      - 女性人物不可单纯化：她们精明、算计、软弱、执念同时并存
      - 时代压力必须内化进人物的选择逻辑，不做外在评论
      - 苍凉感通过对话后的沉默、行动后的空洞来呈现
      - 讽刺是张爱玲的日常语调，不是偶尔为之
      - 结局不圆满，但人物自己接受了这个不圆满，且有自己的逻辑
    bad_habits:
      - 意象密度过高时偶尔显得堆砌
      - 部分人物过于聪明，缺乏真实的盲点
      - 对男性人物的刻画有时流于符号化
    ai_blacklist:
      - 深爱着
      - 此生无悔
      - 命中注定
      - 真爱永恒
      - 感天动地
      - 刻骨铭心
      - 海誓山盟
      - 矢志不渝
      - 情深意重
      - 缘分天定
      - 一见钟情
      - 一往情深
    style_anchors:
      character: >
        【人物锚点】张爱玲的人物都是聪明人，聪明到能看清自己的处境，
        却改变不了。情感不是救赎，是另一种囚笼。细节是刀，
        用来切开人物和时代的皮肤，看里面是什么。

  - id: yi_shu
    name: 亦舒
    domains: [墨言]
    genres: [都市, 言情]
    signature_works: [喜宝, 我的前半生, 玫瑰的故事]
    aws_profile: >
      LLM默认写法：都市女性写成渴望爱情、依赖男性的情感主体。
      差异：亦舒的女性是独立的，甚至是孤傲的——
      情感冷淡克制，不乞求，不低头，不把爱情当作人生全部；
      对话犀利，常常一句话戳破社会虚伪；
      都市讽刺是叙述底色——繁华背后的空洞与虚伪；
      人物可以选择离开，选择独处，选择不爱，这被视为力量而非失败。
    behavior_constraints:
      - 女性主角面对感情不乞求：不说"你为什么不爱我"，只说"那就算了"
      - 对话必须有讽刺锋芒，至少每三段对话有一句刺破虚伪的话
      - 都市繁华场景下必须有一处空洞感（光鲜背后的代价）
      - 人物选择独处或离开时，叙述保持中性，不作悲剧化处理
      - 情感克制：不写"她爱他"，写她为他做了什么，或没做什么
      - 讽刺对象包括：虚伪的爱情、无聊的婚姻、阶层幻象
      - 人物有自己的生活哲学，且叙述中可以隐约感知到这套哲学
    bad_habits:
      - 人物有时过于冷静，显得不真实
      - 部分作品中男性人物功能性过强，缺乏立体感
      - 结局收得过快，情感余韵不足
    ai_blacklist:
      - 离不开你
      - 没有你我怎么活
      - 你是我的一切
      - 为爱牺牲
      - 爱到死去活来
      - 深陷其中
      - 无法自拔
      - 甘之如饴
      - 心甘情愿
      - 飞蛾扑火
      - 情不自禁
    style_anchors:
      character: >
        【人物锚点】亦舒的女人不需要被拯救。她们可以悲伤，
        但悲伤后会整理好衣服继续出门。讽刺是她们的防护色，
        清醒是她们最贵重的财产。独立不是姿态，是生存方式。

  - id: qiong_yao
    name: 琼瑶
    domains: [墨言]
    genres: [言情, 历史]
    signature_works: [还珠格格, 一帘幽梦, 情深深雨濛濛]
    aws_profile: >
      LLM默认写法：言情对话平铺直叙，情感表达功能化。
      差异：琼瑶是情感爆发型的极致——
      对话本身就是情感的载体，大量感叹、质问、呼告；
      爱情至上主义：爱是比生死、道德、家族都重要的东西；
      戏剧化冲突：误会、错过、生死相隔是标配结构；
      人物在爱情面前可以放弃理性，这被视为真情的证明。
    behavior_constraints:
      - 对话情感浓度极高：每段对话都要传递明确的情感信号
      - 感叹号和疑问号的使用频率远高于陈述句结尾
      - 爱情冲突必须有外部阻力（家族反对/身份差异/历史背景）
