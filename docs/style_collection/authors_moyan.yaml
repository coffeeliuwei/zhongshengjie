      - 温柔体贴
      - 相夫教子
      - 甘于奉献
      - 无怨无悔
      - 默默付出
      - 牺牲自我
      - 毫无私心
      - 纯洁无瑕
      - 天真烂漫
    style_anchors:
      character: >
        【人物锚点】铁凝的女性是真实的人，不是符号。她们有欲望，
        有嫉妒，有黑暗，有软弱。历史把她们造成这样，但她们仍然是
