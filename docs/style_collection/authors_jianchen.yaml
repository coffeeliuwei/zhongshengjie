# 剑尘域作家档案 — 自动生成片段，待合并入 author_styles.yaml

authors:

  - id: tiancantudou
    name: 天蚕土豆
    domains: [剑尘]
    genres: [玄幻, 修仙]
    signature_works: [斗破苍穹, 武动乾坤, 大主宰]
    aws_profile: >
      LLM默认写法：战斗描述招式细节+情感爆发时内心独白。
      差异：以"境界差距"为张力轴，用旁观者恐惧传递威压；对话极短，行动替代感叹；
      章节末必留未解悬念；数量词用具体数字；突破靠身体感知而非心理。
      整体节奏呈锯齿状：紧张段落每句不超15字，缓冲段落拉长至30字，交替切换。
      强敌登场公式：旁观者失态→空气凝固→强敌才现身。主角胜负转折不用"激斗后"，
      一句话完成："萧炎右拳轰出，对方直接碎裂。"
    behavior_constraints:
      - 战斗以"实力阶梯"为驱动，每次攻击前先写双方境界差
      - 对话每段不超过3句，第4句改为行动
      - 主角内心独白不超过2行，完成后立即有事件打断
      - 突破场景写"丹田热流/经脉暴涨"等具体身体感知，禁用"心中激动"
      - 场景切换前留一个未解悬念作为阅读引力
      - 配角出场时一句话写清：实力+职责+与主角关系三合一
      - 强敌登场：先写旁观者的腿软/变色，再写强敌本身
      - 章节末最后一句必须是下章开场锚点
    bad_habits:
      - 用"哗""嘶"等拟声词写能量流动
      - 战斗高潮时偶现"一拳轰出"类朴素无修饰描述
      - 同一段落内同一动词重复2-3次（如连续三段都有"冲"）
      - 境界名称反复出现，形成信息冗余
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 令人窒息的压迫感
      - 身体本能地
      - 嘴角微微上扬
      - 感受到了什么
      - 忽然间
      - 竟然
      - 一时间
      - 随即
      - 整个人都
      - 缓缓地
      - 本能地感知到
      - 不知为何
      - 脑海中浮现
    style_anchors:
      battle: >
        【战斗锚点】境界差距是核心张力。强敌出场先写旁观者腿软，主角感知的是"气息压制"而非
        外貌。战斗推进靠"能量消耗比"而非招式名称。胜负转折一句话，不用"激烈搏斗后"。每200
        字改变一次局势。
      breakthrough: >
        【突破锚点】突破是身体事件：丹田裂开→热流蔓延→经脉扩张→境界提升。
        时间感：用"一秒、两秒……"创造节奏。突破前必有阻碍，解决后才能突破。

  - id: wochi_xihongshi
    name: 我吃西红柿
    domains: [剑尘]
    genres: [玄幻, 修仙, 奇幻]
    signature_works: [盘龙, 星辰变, 莽荒纪, 九鼎记]
    aws_profile: >
      LLM默认写法：修炼时大量心理描写+激情内心独白。
      差异：主角极度冷静，情感外露极少，思维高度系统化；修炼体系精密如数学公式，
      每次突破前必有详细资源核算（材料数量、所需时间、成功概率）；对话功能化，
      服务于信息传递而非情感宣泄；世界观宏大但叙述克制，不做过度渲染。
      战斗中主角始终保持理性分析视角，即便濒死也是"还有X%可能性"式思维。
      情感爆发极罕见，一旦出现必须是积蓄多章的临界点，且以行动体现而非言语。
    behavior_constraints:
      - 主角战斗时必须有资源/概率计算，哪怕一行也要有数字
      - 修炼体系描述精确：用等级编号而非模糊"强大许多"
      - 情感描写不超过2句，立即切换到行动或场景
      - 对话结束后跟一个行为动作，不留空白段
      - 敌人实力用可量化标准描述，禁用"感觉很强"类模糊判断
      - 世界观信息通过角色行动自然透出，不做说明式旁白
      - 章节结构：铺垫→事件→主角反应（不超3行）→下一事件
    bad_habits:
      - 战斗节奏均一，缺乏节奏变速
      - 配角性格趋同，缺少差异化语言习惯
      - 情感克制过度时偶显木讷，读者难以共情
    ai_blacklist:
      - 内心深处
      - 热血沸腾
      - 激动得颤抖
      - 感受到力量的涌动
      - 不禁心生敬佩
      - 眼神变得坚定
      - 深吸一口气
      - 难以置信地
      - 久久无法平静
      - 莫名的感动
      - 心跳加速
      - 暗暗发誓
    style_anchors:
      battle: >
        【战斗锚点】主角是战场上的算法机器：攻击前计算、攻击中调整、攻击后复盘。
        不写"感觉"，只写"判断"。能量描述精确到单位，如"神力消耗约三成"。
        战斗胜利后主角先清点损耗，再处理情绪（通常没有情绪描写）。
      breakthrough: >
        【突破锚点】突破是工程项目：准备材料→启动→监控参数→完成。
        每个阶段有明确指标。失败时主角立刻分析原因，下次改进方案已在脑中成型。

  - id: ergen
    name: 耳根
    domains: [剑尘]
    genres: [修仙, 玄幻]
    signature_works: [我欲封天, 仙逆, 求魔, 一念永恒]
    aws_profile: >
      LLM默认写法：修仙小说用励志热血腔调，突破时欢欣鼓舞，师徒情深绵密。
      差异：耳根底色是苍凉与孤独；主角永远以弱小之躯对抗天道，胜利是惨胜，
      代价沉重；叙述节奏极慢，长达数章的铺垫只为一个爆发点；情感深埋在细节
      而非直接宣泄，旧物出现、场景重现是常用情感触发器；天道即反派，
      修炼不是变强而是抗争；文字有古典诗歌的重量感，多用四字结构和排比蓄势。
      高潮段落往往不是最激烈，而是最沉默的一句话，重量在留白里。
    behavior_constraints:
      - 主角胜利必须付出具体代价，不允许无损完胜
      - 铺垫段落至少写3个细节才能推进主要事件
      - 情感触发用旧物/旧地/旧人出现，禁止直接内心独白宣泄
      - 天道/命运作为隐性反派，每章至少有一处"规则压迫"暗示
      - 高潮句子刻意控制在15字以内，以短促句制造重量
      - 古典意象（烛火、白发、故土）至少每两章出现一次
      - 孤独感通过"无人在场"或"无人理解"的场景呈现，不直接说"孤独"
      - 时间跨度描写用"又是一年"类自然流逝，不用精确计年
    bad_habits:
      - 情感蓄力过长时读者会脱离，节奏感弱是风险
      - 偶尔古典词汇堆叠导致现代读者阅读障碍
      - 多线并行时收线节奏偏慢
    ai_blacklist:
      - 热泪盈眶
      - 斗志昂扬
      - 充满希望
      - 心中一暖
      - 感激涕零
      - 欢欣雀跃
      - 激动万分
      - 心情大好
      - 充满力量
      - 迎难而上
      - 奋勇向前
      - 满怀期待
      - 豪情万丈
    style_anchors:
      battle: >
        【战斗锚点】战斗是消耗，不是展示。每个回合主角都在变弱，直到极限才爆发。
        爆发不是热血，是绝望中的一击。战斗结束后重点写代价：受伤部位、寿命损耗、
        内心的某种死亡。最强的战斗描写往往是最少的文字。
      breakthrough: >
        【突破锚点】突破伴随失去：突破了，但某个东西再也回不来。
        境界提升是与过去决裂的仪式。写突破前必须写失去什么，
        读者要先感到心疼，再感到振奋。

  - id: tiaowu
    name: 跳舞
    domains: [剑尘]
    genres: [玄幻, 都市, 平行世界]
    signature_works: [武神空间, 都市超级医圣]
    aws_profile: >
      LLM默认写法：多线并行时各线独立，主角切换时用大量过渡说明。
      差异：跳舞的多线是"同频共振"，不同时空的主角以同一节奏推进，
      切换时用极短过渡（一句话或无过渡直切）；主角决策果断，无废话无犹豫，
      对敌人的心理描写为零；对话密度高但每句有信息量，不写废话对话；
      战斗节奏快，招式名称极简，不堆砌华丽描述；平行世界的差异感靠细节
      区分，不做系统说明；快感来自"主角永远比对手快一步"。
    behavior_constraints:
      - 主角决策不超过1行内心戏，立即执行
      - 对话中每句话必须推进事件或传递信息，禁写情绪性废话
      - 多线切换用三星号分隔，不写"与此同时"类过渡
      - 战斗招式名称不超过4字，不用复杂修饰
      - 每500字完成一个小事件闭环，不拖泥带水
      - 配角的惊讶/崇拜用一句话完成，不展开
      - 章节末主角已在行动中，不以思考/对话结尾
    bad_habits:
      - 快节奏下人物情感厚度不足，读者难以深度代入
      - 平行世界细节偶有矛盾，需要连贯性核查
      - 高密度事件流后偶尔"补情感"段落显得刻意
    ai_blacklist:
      - 与此同时
      - 话说回来
      - 却说
      - 正在这时
      - 忽然之间
      - 话音未落
      - 不得不说
      - 令人惊讶的是
      - 事实上
      - 值得一提的是
      - 与此形成对比
      - 转眼间
    style_anchors:
      battle: >
        【战斗锚点】快。招式描述不超过10字。对手的动作和主角的反制同在一句话里：
        "刀光斩来，他侧身，同时肘击对方颈部。"连贯动词链条，不断句，
        读者跟上节奏就是战斗体验。不写"激战"，只写动作序列。

  - id: xuehong
    name: 血红
    domains: [剑尘]
    genres: [修真, 都市, 末世]
    signature_works: [修真世界, 超级兵王, 末世黎明]
    aws_profile: >
      LLM默认写法：修真小说主角仁义道德，为朋友牺牲，情感丰沛。
      差异：血红主角是功利主义者，资源最大化是核心逻辑；情感是战略工具，
      不是目的；文字风格冷硬极简，不用华丽修辞；世界观残酷，强者制定规则，
      弱者自然淘汰；对话短促直接，主角说话无废话，敌人的废话只是送死前奏；
      战斗描写聚焦"效率"，最少的代价解决目标；血腥场面不回避但不渲染，
      一句话过去，不做道德评判。资源争夺是永恒主线，友情是暂时同盟。
    behavior_constraints:
      - 主角每次行动前必有"收益核算"，哪怕隐含也要体现功利逻辑
      - 战斗描写效率优先：一招解决禁止拖成三招
      - 对话中主角不说废话，说废话的对手很快就死
      - 血腥/死亡场面一句话完成，不做情感渲染
      - 禁止主角为"原则"或"情义"做出降低效率的决策，除非有更大收益
      - 世界观通过角色行为体现，不做说教性旁白
      - 配角的死亡用资源数字衡量，而非情感损失
    bad_habits:
      - 极简风格偶显冷漠，读者难以找到情感锚点
      - 功利主角长篇后可能引发读者道德疲劳
      - 偶尔节奏过快导致场景感薄弱
    ai_blacklist:
      - 义不容辞
      - 肝脑涂地
      - 情深义重
      - 舍生取义
      - 大义凛然
      - 侠肝义胆
      - 感同身受
      - 心疼不已
      - 热心相助
      - 情不自禁地帮
      - 良心发现
      - 回头是岸
    style_anchors:
      battle: >
        【战斗锚点】战斗是商业行为：投入vs产出。进攻时主角计算"这一击能结束战斗吗"，
        能就全力打，不能就保存实力找更好时机。对手的花哨招式是消耗，主角等对手耗尽再出手。
        战斗结束立刻清点战利品，不停留在胜利情绪里。

  - id: tangjia_sanlao
    name: 唐家三少
    domains: [剑尘]
    genres: [玄幻, 修仙]
    signature_works: [斗罗大陆, 绝世唐门, 斗罗大陆二, 神印王座]
    aws_profile: >
      LLM默认写法：少年热血主角单打独斗，靠个人天赋逆袭。
      差异：唐家三少的核心是"团队"，个人实力是团队短板的补充而非一骑当千；
      技能体系精密，每个技能有明确属性和限制，战斗是体系的排列组合；
      成长节奏稳健，不跳级，每个阶段都有充分铺垫；少年热血通过团队的
      互相保护来体现；情感线（爱情/友情）与战斗线同步推进，交织叙述；
      章节结构规整：战前讨论→战中执行→战后总结；读者代入感强靠"规则公平"，
      主角不靠bug赢，靠准备和团队配合。
    behavior_constraints:
      - 战斗前必有团队策略讨论，哪怕两句话
      - 个人技能描述精确：触发条件+效果+限制缺一不可
      - 胜利归功于团队配合，不单独强调主角贡献
      - 情感描写（主角与伙伴）每章至少一处，但不超过3行
      - 敌人也有团队和体系，不能单纯弱智化
      - 成长节奏：每阶段突破前至少有2次失败或阻碍
      - 章节末交代下一个目标/威胁，给读者方向感
      - 伙伴有各自独立的成长线，不是主角的陪衬
    bad_habits:
      - 情感线有时过于甜腻，与战斗氛围割裂
      - 技能体系复杂后记忆成本高，偶尔前后矛盾
      - 团队战斗描写人多时视角混乱
    ai_blacklist:
      - 无敌的存在
      - 谁也无法阻挡
      - 所向披靡
      - 绝世天才
      - 万中无一
      - 注定不凡
      - 天命所归
      - 无人能及
      - 举世无双
      - 独步天下
      - 旷古烁今
    style_anchors:
      battle: >
        【战斗锚点】团队战：每个成员在战斗中有且只有一个职责，写清每人的行动序列。
        技能触发要写触发条件："唐三魂力不足四成时，不能使用蓝银皇第三技。"
        限制创造戏剧张力。胜利的关键动作必须是团队配合的结果，不能是主角单人爆发。

  - id: kulou_jingling
    name: 骷髅精灵
    domains: [剑尘]
    genres: [玄幻, 战斗]
    signature_works: [斗战狂潮, 永恒圣王]
    aws_profile: >
      LLM默认写法：战斗加入大量环境描写和战场情绪渲染，节奏缓慢蓄力。
      差异：骷髅精灵是纯战斗流，环境描写服务于战斗节奏而非氛围营造；
      短句密集，每句一个动作，读者眼睛跟不上就是战斗体验；爆发力极强，
      高潮段落动词密度是普通段落3倍；动作描写写实，讲究物理逻辑（距离、角度、力道）；
      不写主角心理，只写主角动作，通过动作判断心态；配角死亡快且干净，
      不拖沓；每场战斗有一个"招式突破点"——主角在战斗中想通一个新用法，
      立刻执行，这是战斗高潮。
    behavior_constraints:
      - 战斗段落每句话必须包含至少一个动词，禁止纯描述性长句
      - 物理逻辑严格：攻击距离、速度差、力道大小必须合理
      - 主角心理只通过动作体现，禁止内心独白
      - 高潮前必须有一个"主角被压制"的低谷段落
      - 配角死亡用一句话完成，立刻推进主角下一个行动
      - 每场战斗设计一个"招式进化"时刻作为转折点
      - 战斗间歇（喘息）不超过50字，立刻进入下一阶段
    bad_habits:
      - 战斗密集后叙事感弱，读者难以记住具体情节
      - 角色个性在战斗流中容易模糊
      - 偶尔动作描写重复相同动词组合
    ai_blacklist:
      - 气壮山河
      - 战意冲天
      - 热血澎湃
      - 战意高涨
      - 豪情激荡
      - 精神抖擞
      - 信心倍增
      - 斗志昂扬
      - 气势如虹
      - 势不可挡
      - 锐不可当
    style_anchors:
      battle: >
        【战斗锚点】动词链：进攻→对方反应→主角调整→再进攻，每个环节一句话。
        写距离："三步内""半步之差"比"很近"有画面感。
        战斗高潮不是最激烈的一击，而是主角想通"这招可以这样用"的瞬间。

