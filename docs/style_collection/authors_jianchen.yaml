    behavior_constraints:
      - 每段最多3句话，高潮段落每段1句话
      - 对话后不跟解释性旁白，让读者自己理解言外之意
      - 悬念在本章内不解释，至少跨一章
      - 死亡用一句话完成，下一段立刻写活着的人的反应
      - 主角的孤独通过"在人群中无人真正理解他"的场景体现
      - 人性描写避免非黑即白：反派有值得同情之处，主角有自私之刻
