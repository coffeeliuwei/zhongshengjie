      - 悬念过多时读者可能失去追踪感
      - 孤独底色长篇后容易令读者情绪疲劳
    ai_blacklist:
      - 详细描述了整个过程
      - 解释说
      - 因为所以
      - 原来如此
      - 真相大白
      - 水落石出
      - 一切都明白了
      - 终于明白
      - 他知道了答案
      - 谜底揭晓
      - 仔细想了想
      - 经过深思熟虑
    style_anchors:
      battle: >
        【战斗锚点】最快的剑没有过程，只有结果。
        "他出手了。"
        "对方倒下。"
        两句话是一场战斗的全部。悬念在"为什么他会输"，不在"怎么打的"。
        战斗前的对话是真正的战场。
      silence: >
        【留白锚点】最重要的情感不写出来。主角知道了一件悲伤的事，
        下一句写他点了一支烟。读者自己填满那个空白。
        空白比描述更有力量。

  - id: huangyi
    name: 黄易
    domains: [剑尘]
    genres: [历史玄幻, 武侠]
    signature_works: [大唐双龙传, 寻秦记, 破碎虚空, 边荒传说]
    aws_profile: >
      LLM默认写法：历史玄幻背景介绍用教科书式说明，武功描写程式化。
      差异：黄易的战斗有磁性感官描写——不只是视觉，还有触觉、气息、
