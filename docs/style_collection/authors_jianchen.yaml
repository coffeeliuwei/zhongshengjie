      - 武功境界必须有哲学解释："这一掌打的是气机，不是肉身"
      - 反派的权力逻辑完整合理，有自洽的价值观
      - 男性主角的战斗力与魅力同频：战斗越强，吸引力越强，两者不分家
      - 大时代格局：个人胜利要放在历史局势中衡量其意义
