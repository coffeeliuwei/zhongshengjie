      - 历史细节过密时节奏下沉，战斗流感降低
      - 哲学武学描述有时过于抽象，实战画面感弱
    ai_blacklist:
      - 普通打斗
      - 毫无特色的一击
      - 简单的一脚
      - 随手一掌
      - 漫不经心地
      - 没有任何变化
      - 枯燥乏味
      - 照本宣科
      - 千篇一律
      - 一成不变
    style_anchors:
      battle: >
        【战斗锚点】战斗是多感官事件："刀风过颈，寒意如冰线割过皮肤；
        对方的呼吸声加快，这是他即将出招的信号。"不只看，要闻、触、感。
        武功最高境界的描写是哲学：攻击的是对方的"势"，不是对方的"身"。

  - id: cormac_mccarthy
    name: 科马克·麦卡锡
    domains: [剑尘]
    genres: [暴力美学, 西部, 末世]
    signature_works: [血腥子午线, 路, 老无所依, 边境三部曲]
    aws_profile: >
      LLM默认写法：暴力场面加大量情感渲染和道德判断旁白。
      差异：麦卡锡的暴力不带情感，不带标点，像地质事件一样自然发生；
      无引号对话，无逗号分隔，长句滚滚向前，读者在语法中感受混乱；
      恶不解释，美不渲染，两者并排出现产生最大冲击；命运是宿命，
      角色无法选择，只能见证；叙述声音上帝视角但冷漠，像在记录昆虫行为；
      自然风景的壮阔与人类暴行的渺小并置；对话简短、功能化，沉默比语言更多。
      战斗描写的力量来自"不加评论"——作者不说"这很残忍"，读者自己得出结论。
    behavior_constraints:
      - 暴力场面不加情感形容词，不做道德评判，只记录动作序列
      - 对话不用引号，说话者身份靠上下文判断
      - 长句中不用多余逗号，让句子有滚动感
      - 自然景物描写与暴力场面交替出现，形成并置对比
      - 角色不做解释性内心独白，行动就是全部
      - 命运感：角色的选择余地极小，写出"不得不"的必然感
      - 沉默和空白是标准：对话完成后不跟反应描写，留给读者
    bad_habits:
      - 极简风格在长篇中对读者要求极高，可读性门槛高
      - 无标点风格在中文语境下需要调整，完全照搬会造成阅读障碍
      - 叙述距离感可能让部分读者无法产生情感代入
    ai_blacklist:
      - 令人发指
      - 惨绝人寰
      - 触目惊心
      - 不忍直视
      - 残忍至极
      - 这是错的
      - 良知的谴责
      - 道德的底线
      - 人性的光辉
      - 感到内疚
      - 悔恨交加
      - 不寒而栗（用于情感判断）
    style_anchors:
      battle: >
        【战斗锚点】暴力是物理事件。"他拿起石头。他砸了下去。对方不动了。"
        没有感叹，没有渲染。力量来自密度和节制。
        战斗前写风景，战斗后写风景。暴力夹在两段自然描写之间，
        让读者自己感受那个落差。
      nihilism: >
        【宿命锚点】角色做了选择，但选择是必然的。
        写出"他知道他会这么做，他无法不这么做"的感觉。
        恶存在于世界的结构里，不存在于某个人的心里。

  - id: ernest_hemingway
    name: 海明威
    domains: [剑尘]
    genres: [现实主义, 战争, 冒险]
    signature_works: [老人与海, 永别了武器, 太阳照常升起, 丧钟为谁而鸣]
    aws_profile: >
      LLM默认写法：情感用形容词和副词直接说出，解释角色的内心感受。
      差异：冰山理论——说出来的是八分之一，藏在水下的是八分之七；
      主动语态、短句、具体动词；行动替代情感（"他喝了一杯"比"他很悲伤"更有力）；
      对话是人物性格的X光，每句话都折射说话者的处境和恐惧；
      绝不用"感到很……"类句式，情感通过可观察行为呈现；
      男子气概的核心是"在压力下保持优雅"，战斗/死亡面前不崩溃，
      继续做事；重复是技巧，不是失误——刻意重复创造仪式感和节奏。
    behavior_constraints:
      - 禁用情感形容词（悲伤/兴奋/恐惧）描述主角内心，改用行为
      - 每个句子优先使用主动语态和具体及物动词
      - 对话后不跟"他感到"类解释，读者从对话本身读出情感
      - 重复使用"and"连接句子，创造递进的滚动节奏
      - 场景描写具体到可以触摸的物件："桌上有一杯酒，还剩半杯"
      - 战斗描写聚焦可观察动作，不写角色的恐惧，只写他们的手在颤抖
      - 结尾句不做总结，留在行动中：以动词结尾而非判断
    bad_habits:
      - 极简风格模仿时容易写成空洞，缺少冰山下的内容支撑
      - 男性视角局限，女性角色有时处理粗糙
      - 中文语境下短句节奏与中文语感有摩擦，需要调整
    ai_blacklist:
      - 他感到非常
      - 内心充满了
      - 一股情感涌上
      - 他忍不住
      - 泪水模糊了
      - 说不出话来
      - 久久无法平静
      - 百感交集
      - 五味杂陈
      - 心潮起伏
      - 思绪万千
      - 感慨万千
    style_anchors:
      battle: >
        【战斗锚点】战斗写可见行为，不写内心。"他的手在流血，他换了一只手握刀。"
        不加"他感到痛苦"。读者自己知道他痛。
        压力下的优雅：越危险，动作越精确，越少废话。
        死亡不渲染："他倒下了。" 句点。下一句写存活者在做什么。

  - id: joe_abercrombie
    name: 乔·阿伯克龙比
    domains: [剑尘]
    genres: [黑暗奇幻, 反英雄]
    signature_works: ["First Law Trilogy", "Best Served Cold", "The Heroes", "Red Country"]
    aws_profile: >
      LLM默认写法：奇幻英雄战斗用热血主角正义必胜叙述。
      差异：阿伯克龙比的战斗是肮脏、混乱、没有荣耀的——主角可能用最卑鄙的
      手段赢得胜利，而读者理解这是正确选择；道德模糊是核心，善人做恶事，
      恶人有自己的逻辑；黑色幽默渗透战斗——士兵死前说了句蠢话；
      战斗后遗症写实：创伤、恶心、颤抖，不只是洒脱离去；
      角色弧线是黑化弧，英雄变成他们曾经对抗的东西；
      政治与战争不分离，每场战斗都有政治后果；叙述视角多，
      同一场战斗从不同角色看完全不同。
    behavior_constraints:
      - 战斗后必须写角色的生理反应：恶心/颤抖/疼痛，不允许洒脱离开
      - 道德选择不给正确答案，主角的选择可以是错的
      - 黑色幽默：严肃战斗场面中插入一个荒诞细节（不破坏整体氛围）
      - 政治后果：每场重要战斗后写一句它改变了什么权力格局
      - 角色弧线追踪：主角每次使用黑暗手段后写他内心有一样东西消失了
      - 反派视角：重要对手至少有一章内视角，展示其自洽逻辑
      - 战斗写实：盔甲的重量、武器的疲劳、视野的混乱，不夸张
    bad_habits:
      - 黑色幽默偶尔用力过猛，消解了本应有的情感重量
      - 多视角时部分视角发展不充分
      - 道德模糊长篇后读者可能失去情感锚点
    ai_blacklist:
      - 正义必胜
      - 邪不压正
      - 英雄气概
      - 为了保护大家
      - 守护信念
      - 正义的力量
      - 光明驱散黑暗
      - 希望仍在
      - 不惜一切代价保护
      - 英雄的抉择
      - 铁肩担道义
    style_anchors:
      battle: >
        【战斗锚点】战斗是屠宰，不是舞蹈。写气味（血腥/粪便/汗水），写疲劳
        （第三分钟手臂已经抬不起来），写混乱（分不清敌友）。
        胜利者不庆祝，他跪在地上喘气，然后吐了。
        这才是真实的战斗结束。
      moral_ambiguity: >
        【道德模糊锚点】主角做了一件可怕的事。不判断对错。
        只写他回到营地，喝了酒，久久不说话。
        读者知道他在想什么。不需要写出来。

  - id: neil_gaiman
    name: 尼尔·盖曼
    domains: [剑尘]
    genres: [神话奇幻, 黑色幽默, 都市奇幻]
    signature_works: [美国众神, 好兆头, 星尘, 无有乡, 烟与镜]
    aws_profile: >
      LLM默认写法：神话题材用严肃庄重的叙述腔调，神明战斗用壮观特效描写。
      差异：盖曼的神明疲惫、困惑、有时候很蠢；神话现代感来自将古老存在
      放入日常背景（公路旅行/便利店/廉价汽车旅馆）；叙述声音独特——
      有讲故事者的距离感，有时直接对读者说话；奇异氛围来自"正常中的不正常"，
      而不是宏大场面；幽默是黑色的，死亡和笑话同时出现；
      战斗用叙述而非描写：把战斗当成一件已经发生的事来讲述；
      神秘感通过"不解释"来维持——读者在信息不完整时反而更相信。
    behavior_constraints:
      - 神明/超自然存在必须有日常化细节：他们也喝咖啡、也睡觉、也感到无聊
      - 神话背景用现代地名/品牌锚定，不做架空世界说明
      - 叙述声音偶尔直接对读者说话（"你应该知道，这不是个好主意"）
      - 战斗用叙事而非镜头：讲述已经发生的事，而非实时呈现
      - 神秘感保持：解释太多会破坏氛围，关键信息留三分之一不给
      - 黑色幽默：严肃神话时刻插入荒诞人性细节
      - 场景描写一半写看得见的，一半写感觉到的（气氛/预感/古老的重量）
    bad_habits:
      - 叙述腔调过强时影响沉浸感
      - 不解释的神秘感偶尔让读者完全迷失
      - 幽默与严肃切换不当时会产生割裂感
    ai_blacklist:
      - 神威浩荡
      - 神力无边
      - 神圣降临
      - 天地为之颤抖
      - 神明震怒
      - 散发着神圣光芒
      - 令凡人匍匐
      - 至高无上的存在
      - 不可直视的威严
      - 宇宙级别的力量
      - 超越人类理解
    style_anchors:
      battle: >
        【战斗锚点】神明战斗不是景观，是陈年旧账的清算。
        描述结果，暗示过程："当烟雾散去，其中一位神明不见了。另一位坐在地上，
        看起来很老，比刚才老了一千年。"
        读者脑补的战斗比你写出来的更宏大。
      atmosphere: >
        【氛围锚点】"这个地方有某种古老的东西在注视着你。不是恶意，只是古老。
        古老到你这个物种对它来说只是最近的一批访客。"
        氛围靠"感觉被注视"传递，不靠特效。

  - id: yanyu_jiangnan
    name: 烟雨江南
    domains: [剑尘]
    genres: [历史穿越, 政治悬疑, 武侠]
    signature_works: [庆余年, 间客, 将夜]
    aws_profile: >
      LLM默认写法：穿越主角靠现代知识碾压古人，缺乏真正智识挑战。
      差异：烟雨江南的主角用现代人的逻辑理解古代权力结构，但古代规则
      真实存在并真实约束主角；政治博弈是武力对决的底层——每场打架背后
      都有政治动机，消灭一个人前先要切断其政治支撑；讽刺与智识并存：
      主角看穿古代迷信/礼法的荒诞，但不鄙视，而是利用；叙述有知识分子
      的克制自嘲腔调；战斗不是展示武力，是政治手段的延伸；
      配角有完整的政治立场，不是纯粹的反派；
      文字风格兼顾可读性和思想密度，金句密度高。
    behavior_constraints:
      - 每场重要战斗前必须交代政治背景：谁得益、谁受损
      - 主角使用现代逻辑时必须写古代人的反应：困惑/敬畏/反弹
      - 讽刺要轻——点到为止，不做说教，读者自己感受
      - 政治配角有自洽立场：反派做坏事有制度性原因，不是个人邪恶
      - 金句密度：每500字至少有一句可以单独传播的精辟表达
      - 战斗是政治的延伸：打完必须写政治后果，不只写武力胜负
      - 主角的现代视角带来优势，但古代规则在某些时候真实反制他
    bad_habits:
      - 政治博弈密度高时节奏偏慢，战斗流感不足
      - 金句密度高时偶显刻意，部分金句为金句而金句
      - 穿越设定有时依赖"现代知识外挂"过多，古代角色被贬低
    ai_blacklist:
      - 古人真是愚昧
      - 这点小把戏
      - 轻松破解
      - 不费吹灰之力
      - 古代人哪懂得
      - 笑话一般
      - 一眼看穿
      - 毫无难度
      - 手到擒来
      - 不值一提
      - 太简单了
      - 小儿科
    style_anchors:
      battle: >
        【战斗锚点】战斗是政治声明。主角打赢了某人，真正的目的是传递一个信号：
        "我动得了他，就动得了你背后的人。"
        写战斗时先写政治意图，再写身体动作，最后写政治后果。
        武力是语言，不是目的。
      irony: >
        【讽刺锚点】主角看穿了某个古代仪式的荒诞，但他认真执行。
        旁白轻描淡写地记录这个矛盾，不做评论。
        读者笑了，但主角没有笑。这就是烟雨江南的讽刺。
