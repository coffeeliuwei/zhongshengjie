      - 暴打一顿
      - 直接爆头
      - 血量清空
      - 一波带走
      - 技能冷却
      - 被虐爆了
      - 装备碾压
      - 无脑输出
      - 点了技能
    style_anchors:
      battle: >
        【战斗锚点】每招都是故事。"他使出降龙十八掌第七掌"要跟上一句：
        "这一掌是他父亲当年击败西毒的同一招。"招式+渊源=金庸战斗。
