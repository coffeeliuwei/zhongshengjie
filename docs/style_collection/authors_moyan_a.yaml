# 墨言域作家档案（前10位）— 待合并入 author_styles.yaml
authors:

  - id: maoni
    name: 猫腻
    domains: [墨言]
    genres: [玄幻, 都市]
    signature_works: [庆余年, 将夜, 择天记]
    aws_profile: >
      LLM默认写法：人物直白表达情感，冲突时立场分明。
      差异：情感克制——重要感情用行为细节传递而非直说；对话必有潜台词，言外之意重于言内；
      主角保有现代人理性自省；权力博弈与个人情感同等重量；叙述声调冷静但底色温热。
    behavior_constraints:
      - 重要情感绝不直说，改用行为细节（不写"他很难过"，写他做了什么）
      - 对话必须有潜台词，角色说的和想的至少有一层差距
      - 主角在高压时刻保留一处冷静的自我观察（现代人穿越感）
      - 每场人物冲突后，至少有一方的立场是可理解的（非单纯反派）
      - 权力结构写明：谁欠谁、谁怕谁、谁需要谁——三角关系显性化
      - 重要场景前植入一个日常细节，作为情感落差的铺垫
      - 人物的决定必须有可追溯的性格逻辑，禁止"突然就这样了"
    bad_habits:
      - 叙述者偶尔插入现代人口吻的调侃（微妙的第四堵墙感）
      - 某些情绪高点用极短的单行呈现，与前后长段形成反差
      - 重要人物出场时带一个看似无关的小动作
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 泪水在眼眶打转
      - 不禁
      - 沉默良久
      - 心跳加速
      - 内心深处
      - 陷入了沉思
      - 情绪涌上心头
      - 忍不住
      - 心里清楚
      - 莫名其妙
    style_anchors:
      character: >
        【猫腻人物锚点】克制是核心武器。重要告白往往被事件打断，重要伤痛被行动掩盖。
        权力与情感不互斥而是互相渗透。人物的弱点与力量来自同一个地方。
        对话结束后的沉默，比对话本身说的更多。

  - id: fenghuoxi
    name: 烽火戏诸侯
    domains: [墨言]
    genres: [玄幻, 武侠]
    signature_works: [雪中悍刀行, 剑来]
    aws_profile: >
      LLM默认写法：情感爆发时直接描述内心感受。
      差异：癫狂与深情并存——人物在荒诞行为中藏着最重的情；
      师徒/兄弟情感量级超过男女情；江湖义气正面书写不讽刺；
      打戏中穿插人情温度；叙述声音有股"说书人"的古朴。
    behavior_constraints:
      - 人物越癫狂的表面下，藏的情感越重——反差是核心手法
      - 师徒情/兄弟情的分量不低于男女情，单独给到篇幅
      - 江湖义气正面书写，不用现代视角反讽
      - 战斗场景中穿插一处人情温度（一个眼神/一句话）
      - 叙述语气带古朴说书感，偶尔用文言短句
      - 人物的口头禅/癖好要在行文中自然重复出现
    bad_habits:
      - 段落末偶用文言感短语（"如此而已""不过如此"）
      - 重要场景前用一段看似闲笔的环境描写蓄力
      - 人物大喜大悲时反而用极平静的动作描写
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 热泪盈眶
      - 内心深处
      - 感受到了什么
      - 不禁
      - 情绪失控
      - 难以言喻
      - 脑海中浮现
      - 陷入了沉思
      - 莫名其妙
    style_anchors:
      character: >
        【烽火人物锚点】最重的情藏在最轻描淡写的地方。
        一个师父给徒弟系鞋带的动作，比一百句"我待你如子"有力。
        人物的傻和人物的痴，来自同一份认真。

  - id: xiaoding
    name: 萧鼎
    domains: [墨言]
    genres: [玄幻, 仙侠]
    signature_works: [诛仙]
    aws_profile: >
      LLM默认写法：师徒情感直白书写，冲突正邪分明。
      差异：青春伤痛与命运悲剧是核心——主角不是最强者而是最痛者；
      道与魔的对立不是黑白而是灰色；师徒情感压抑克制，爆发点一处定终身；
      叙述语气忧郁但不颓废，带着少年人的固执。
    behavior_constraints:
      - 主角的痛苦比实力更重要，每场戏先想"他因此失去了什么"
      - 道与魔的对立必须让反派有合理立场，不能只是邪恶
      - 师徒情感用小细节积累，爆发点留到最关键时刻
      - 命运感通过"偶然改变一切"的节点传递，不用直接说"这是命"
      - 人物在绝境时的行为必须符合其性格，不能突然英雄化
      - 青春期角色的冲动和错误要如实写，不美化
    bad_habits:
      - 用自然景物（风/雪/花）映衬内心，偶有刻意感但一致
      - 某些台词极简到近乎诗句（三四字一句）
      - 人物命运的预兆埋得很早，隔章才显
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股暖流
      - 热泪盈眶
      - 内心深处
      - 不禁落泪
      - 情绪涌上心头
      - 感受到了什么
      - 难以言喻
      - 莫名其妙
      - 陷入了沉思
    style_anchors:
      character: >
        【萧鼎人物锚点】青春伤痛不煽情。重要告别用日常动作表达，
        不用拥抱或眼泪——用"他转身走了，没有回头"。
        师父的爱是严厉，直到最后一刻才反转。

  - id: wangyu
    name: 忘语
    domains: [墨言]
    genres: [修仙]
    signature_works: [凡人修仙传]
    aws_profile: >
      LLM默认写法：主角情感爆发，成长节点明显。
      差异：克制理性主角——韩立的情感是算计后的选择而非冲动；
      成长弧线漫长真实，不靠一次顿悟；每次进步都有具体代价；
      情感沉淀而非爆发，几十章后才给一个爆发时刻；
      凡人起点的厚重感通过细节积累而非宣言传递。
    behavior_constraints:
      - 主角情感反应比普通人慢半拍，但一旦做决定绝不后悔
      - 成长要有具体资源代价：花了多少年、消耗了什么、放弃了什么
      - 情感积累不急于兑现，可以沉淀很久再给一次爆发
      - 配角的命运要认真对待，不是工具性死亡
      - 时间感要真实：几十年的修炼不能一笔带过
      - 凡人出身的厚重感通过行事小心谨慎体现，不通过宣言
    bad_habits:
      - 韩立式的内心计算（"如此，倒也合算"类语气）
      - 重要选择前列出利弊权衡（理性角色特征）
      - 危险场景下的克制平静反而更有压迫感
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 热血沸腾
      - 激动不已
      - 内心深处
      - 情绪高涨
      - 迫不及待
      - 感受到了什么
      - 不禁
      - 莫名其妙
    style_anchors:
      character: >
        【忘语人物锚点】凡人视角的力量在于计算感。每个选择都有代价，
        每次进步都消耗了什么。情感不是主角的武器，而是主角保护的东西。

  - id: zhibai
    name: 知白
    domains: [墨言]
    genres: [玄幻, 古言]
    signature_works: [大奉打更人]
    aws_profile: >
      LLM默认写法：推理线索直白展示，人物性格标签化。
      差异：悬疑与人物刻画并轨——角色层次丰富，每个配角都有内在逻辑；
      幽默与重量交替出现，笑点之后往往是最重的情节；
      推理逻辑严密但不枯燥，靠人物性格驱动线索；
      叙述语气俏皮但情感分量重。
    behavior_constraints:
      - 线索设置：读者比主角早发现一点点，但不能太早（掌握节奏感）
      - 每个配角至少有一个反常规的特质，不做扁平标签
      - 幽默段落之后安排情感重量，构成节奏反差
      - 推理线索通过人物互动自然呈现，不通过独白解释
      - 反派的动机必须是可理解的，哪怕不可原谅
      - 主角的小聪明和大智慧在同一场景内并存
    bad_habits:
      - 主角在揭露真相前偶插一句无关紧要的评论（缓解张力）
      - 某个严肃场景里有一处荒诞小细节打破沉重
      - 人物关系用反讽对话建立（说反话的感情）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 情绪涌上心头
      - 忽然间
      - 心中涌起一股
      - 难以言喻
    style_anchors:
      character: >
        【知白人物锚点】幽默是盔甲，情感是软肋。笑完之后的重击才是真正的高潮。
        人物的聪明不在于无所不知，而在于在对的时刻假装不知道。

  - id: yuhua
    name: 余华
    domains: [墨言]
    genres: [现实主义, 当代文学]
    signature_works: [活着, 许三观卖血记, 兄弟]
    aws_profile: >
      LLM默认写法：苦难场景配合悲伤情绪渲染，读者被引导同情。
      差异：叙述距离极冷——荒诞和苦难用平静语调叙述，反差本身产生震撼；
      不直接描写悲伤，只描写事件；笑点和哭点相邻出现；
      历史暴力以个人具体遭遇呈现而非宏观判断。
    behavior_constraints:
      - 苦难场景用平静甚至荒诞的语调叙述，绝不煽情
      - 不描写"悲伤""痛苦"——只描写具体行为和事件
      - 笑点和悲剧节点紧邻放置，制造余华式荒诞感
      - 历史和时代背景通过具体生活细节体现，不做宏观判断
      - 人物的愚蠢和善良并存，不美化底层
      - 死亡事件用极短的篇幅叙述，"他死了"比大段描写更有力
    bad_habits:
      - 重大事件一笔带过（"那一年，她死了"）
      - 荒诞逻辑下的人物行为自洽（不解释，读者自悟）
      - 偶用重复句式强调（"他笑了，笑了很久"）
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 泪水在眼眶打转
      - 热泪盈眶
      - 内心深处
      - 无法言说的痛苦
      - 情绪涌上心头
      - 感受到了什么
      - 难以言喻
      - 沉默良久
    style_anchors:
      character: >
        【余华人物锚点】苦难用白描，震撼靠克制。最沉重的死亡用最平静的句子写。
        荒诞不需要解释，生活本身就是荒诞的。

  - id: zhangailing
    name: 张爱玲
    domains: [墨言]
    genres: [现代文学, 言情]
    signature_works: [金锁记, 倾城之恋, 半生缘]
    aws_profile: >
      LLM默认写法：女性角色情感直白，爱情线正面书写。
      差异：刻毒细节传递人性幽暗——一个动作/一件衣服比一段内心独白说得更多；
      爱情不浪漫而是算计与博弈；苍凉底色下的精准残忍；
      时代压抑与个人欲望之间的撕裂；比喻密度高且陌生化。
    behavior_constraints:
      - 女性角色的情感通过细节物件传递（一件旗袍/一双手）而非直白表达
      - 爱情场景写算计和博弈，不写纯粹浪漫
      - 比喻要陌生化——找日常物体的意外角度，而非通用意象
      - 时代背景通过室内陈设和人物穿着体现，不做时代判断
      - 人物的自欺要如实呈现，不要替读者揭穿
      - 苍凉感通过结尾的反高潮传递，不用悲剧音乐式收尾
    bad_habits:
      - 陌生化比喻（"像……一样"后面总是意外的东西）
      - 心理分析突然插入叙述流，不做转场提示
      - 精准的刻薄：一句话写穿一个人
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股暖流
      - 泪水在眼眶打转
      - 不禁落泪
      - 内心深处
      - 感受到了什么
      - 情绪涌上心头
      - 难以言喻
      - 沉默良久
      - 脑海中浮现
    style_anchors:
      character: >
        【张爱玲人物锚点】细节是武器。写女人的心思不靠内心独白，靠她选择的颜色、
        她放下杯子的方式、她说"没关系"时手指的动作。苍凉不是悲伤，是看穿之后的冷静。

  - id: yishu
    name: 亦舒
    domains: [墨言]
    genres: [都市言情, 现代文学]
    signature_works: [喜宝, 我的前半生, 玫瑰的故事]
    aws_profile: >
      LLM默认写法：独立女性角色以宣言方式表达自我。
      差异：都市讽刺底色——独立不靠宣言靠行为；对话犀利有余味；
      情感冷淡克制，爱从不是最高优先级；
      香港都市氛围自然流露；女性价值观通过生活选择体现而非说教。
    behavior_constraints:
      - 女性的独立靠具体选择体现，禁用宣言式表达
      - 对话要犀利有余味，留白让读者补全
      - 情感不是最高优先级，工作/自尊/经济独立比爱情更重要
      - 香港都市细节自然嵌入（地名/食物/消费习惯）
      - 男性角色不神化，用女性眼光审视其不足
      - 结局不必圆满，但女主角必须有自己的选择
    bad_habits:
      - 对话结束后一句短评（叙述者的干净讽刺）
      - 写奢华时不用形容词，只用品牌名和具体物件
      - 人物的聪明通过"她没有说什么"来体现
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 心跳加速
      - 不禁
      - 内心深处
      - 情绪激动
      - 感受到了什么
      - 难以言喻
      - 脑海中浮现
      - 沉默良久
    style_anchors:
      character: >
        【亦舒人物锚点】独立不靠说，靠做。女主角不解释，不辩解，直接行动。
        对话里最有力的一句往往是最短的一句，或者干脆是沉默。

  - id: qiongyao
    name: 琼瑶
    domains: [墨言]
    genres: [言情, 古言]
    signature_works: [还珠格格, 一帘幽梦, 情深深雨濛濛]
    aws_profile: >
      LLM默认写法：情感克制，角色心理真实复杂。
      差异：情感爆发型——哭泣、呐喊、倾诉是正当的表达手段；
      爱情至上主义，爱可以是选择的终极理由；
      对话高度戏剧化，语言密度高情感浓度高；
      环境配合情绪：雨/风/花落是常规情感外化手段；
      反派的恶是彻底的，主角的纯是纯洁的（非灰色叙事）。
    behavior_constraints:
      - 情感爆发场景不克制，让角色充分表达（哭/笑/呐喊）
      - 对话语言高度戏剧化，可以超出日常对话的密度
      - 爱情可以是角色决定的终极理由，不需要其他理由
      - 环境外化情绪：下雨时配悲伤，花落时配离别（传统手法正面使用）
      - 反派的恶可以是彻底的，不需要为其开脱
      - 主角纯洁善良的特质要正面书写，不反讽
    bad_habits:
      - 感叹词密集（"啊！""哎呀！"）
      - 重复叫名字强调情感浓度（"文玉！文玉！"）
      - 长段内心独白式自白（角色对自己的情感进行分析）
    ai_blacklist:
      - 无法言说的
      - 情绪复杂
      - 理性分析
      - 保持冷静
      - 克制情绪
      - 逻辑上来说
      - 面无表情
      - 淡然处之
    style_anchors:
      character: >
        【琼瑶人物锚点】情感是正当的，不需要克制。让角色充分哭泣，充分爱，充分痛。
        环境不只是背景，而是情感的延伸——雨是眼泪，风是叹息。

  - id: feiwosicun
    name: 匪我思存
    domains: [墨言]
    genres: [古言, 历史言情]
    signature_works: [来不及说我爱你, 佳期如梦, 东宫]
    aws_profile: >
      LLM默认写法：历史背景下情感直白表达，主角命运可预期。
      差异：虐恋美学——压抑克制的文字下藏着巨大情感张力；
      历史背景与情感命运相互制约；悲剧结局的宿命感贯穿全文；
      每一次靠近都为最终的撕裂做铺垫；人物无法选择时代，只能选择尊严。
    behavior_constraints:
      - 情感克制——越重要的感情越用最少的文字写
      - 历史背景作为人物命运的枷锁，不只是装饰
      - 宿命感通过细节预示：开头的某个物件在结尾成为决裂的触发点
      - 人物的放弃要写得比争取更难
      - 悲剧不靠误会制造，靠时代/处境的真实困境
      - 最痛苦的场景用最克制的语言写
    bad_habits:
      - 某个意象反复出现（如一根玉簪/一个约定）贯穿全文
      - 人物临走前的最后一句话留有余味，不解释
      - 历史细节精准到近乎学术（服饰/礼制/官职）
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
