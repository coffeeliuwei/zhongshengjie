# 苍澜域作家档案（15位）— 待合并入 author_styles.yaml
authors:

  - id: chendong
    name: 辰东
    domains: [苍澜]
    genres: [玄幻]
    signature_works: [遮天, 完美世界, 神墓]
    aws_profile: >
      LLM默认写法：宏大叙事靠战力数字推进，神话感靠词汇堆砌。
      差异：神话尺度靠孤绝美学实现——主角一人对抗整个时代；
      远古大能的威压靠传说和遗迹而非直接出场；
      文字厚重磅礴，但孤独才是核心底色；
      每次战胜都是以孤独换来的，没有真正的同伴。
    behavior_constraints:
      - 宇宙/远古尺度通过具体遗迹（战场遗骨/古老铭文）传递，不靠数字
      - 大能的存在感靠间接证据（目睹其战斗遗迹/旁观者描述）而非直接出场
      - 主角的孤独是主题：战胜了强者，但失去了同行者
      - 磅礴感靠叠加意象而非形容词堆砌（山/星辰/古战场）
      - 境界体系的逻辑必须自洽，等级跨越需要付出的代价明确
      - 每场胜利后必须有损失——人、时间、记忆中的某人
    bad_habits:
      - 古朴文言式感叹（"此生无悔！"）偶在高潮处出现
      - 远古意象密集叠加（万古、星辰、荒古、不灭）
      - 主角一人面对整个世代强者时的孤绝姿态描写
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【辰东世界观锚点】宏大靠孤绝体现。一个人站在远古战场上，
        遍地是消逝的神话，而他还在继续走。
        宇宙的大不用说，靠主角的渺小映出来。

  - id: liucixin
    name: 刘慈欣
    domains: [苍澜]
    genres: [科幻]
    signature_works: [三体, 流浪地球, 球状闪电]
    aws_profile: >
      LLM默认写法：科技细节服务情节，人类视角是中心。
      差异：硬核科学逻辑是叙事驱动力——物理规律比人性更可靠；
      宇宙文明博弈中人类不必然获胜；
      数学和物理的美感作为叙述的美学；
      个人命运在文明生死面前被相对化；
      技术解决方案的细节要精确到让人信服。
    behavior_constraints:
      - 科学概念作为情节工具，逻辑链必须自洽
      - 宇宙尺度：人类文明是沧海一粟，但沧海一粟也有尊严
      - 技术细节要能接受推敲（允许外推，但内部逻辑一致）
      - 个人故事在文明冲突中作为"人性样本"而非中心
      - 敌对文明的逻辑从其文明处境出发，不做简单恶化
      - 物理规律的冷酷是叙事的道德底色：宇宙不仁
    bad_habits:
      - 工程细节和物理推导过程的精确叙述（技术流风格）
      - 人类文明的历史视角突然拉到宇宙视角
      - 某个物理概念被用比喻解释后，再用技术语言严格化
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【刘慈欣世界观锚点】宇宙不仁，技术是唯一可信的语言。
        一艘飞船用核武器推进，穿越太阳系——细节精确，
        然后把这个精确的机器放在黑暗的宇宙里，渺小感自然产生。

  - id: jinyong
    name: 金庸
    domains: [苍澜, 剑尘]
    genres: [武侠]
    signature_works: [神雕侠侣, 笑傲江湖, 天龙八部, 鹿鼎记]
    aws_profile: >
      LLM默认写法：江湖势力靠正邪划分，武功靠数字体系。
      差异：人情世故是江湖的核心——谁是真英雄靠行为判断，不靠门派；
      武功的诗意在于文化内涵而非力量数字；
      历史与虚构无缝融合；爱情与侠义同等重量；
      势力地图靠具体的人际关系而非抽象的组织结构维持。
    behavior_constraints:
      - 江湖势力靠门派传统和人物关系而非组织架构图体现
      - 武功写文化内涵（剑法出处/心法哲学），不只写威力
      - 历史人物和虚构人物在同一场景出现，语境自然
      - 爱情不是附属品，是人物选择侠义的动机之一
      - 反派的可怜处境必须有一场戏让读者理解
      - 人物的成长靠师徒传承，传承本身就是世界观的一部分
    bad_habits:
      - 武学内功心法用文言感的名词描述（"九阳神功第七层"）
      - 历史典故自然嵌入对话（让人物变得有深度）
      - 某场战斗靠智谋而非力量解决（金庸最喜欢的反转）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【金庸世界观锚点】侠义是一种选择，不是一种身份。
        门派是工具，人心才是江湖。某人是魔教的，但他是好人——
        这个矛盾是金庸世界的全部。武功的最高境界是无招。

  - id: eryuehenan
    name: 二月河
    domains: [苍澜]
    genres: [历史小说]
    signature_works: [康熙大帝, 雍正王朝, 乾隆皇帝]
    aws_profile: >
      LLM默认写法：皇帝角色权威化，臣子角色单一化。
      差异：权力核心的孤独——皇帝是最孤独的权力者，没有真朋友只有利益；
      官场博弈靠具体的政务细节推进；
      历史人物的人性弱点正面书写（皇帝也有私欲）；
      群像结构：每个臣子有完整的逻辑和动机。
    behavior_constraints:
      - 权力人物靠孤独体现其地位（越高处越孤独）
      - 官场博弈靠具体奏折/政策/人事任命推进，不靠抽象阴谋
      - 历史人物的私欲和公义要并存，不单一化
      - 群像结构：臣子之间的博弈与皇帝视角并轨
      - 历史细节精准（官职/礼制/税收/军事制度）
      - 政治决定靠内部逻辑自洽，而非读者的现代道德判断
    bad_habits:
      - 皇帝独处时的内心独白（与公开场合的巨大反差）
      - 臣子的奏折被逐字分析（权力话语的解码场景）
      - 某个历史政策靠人物亲身遭遇来具体化
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【二月河世界观锚点】皇权是孤独的。朕说的话是圣旨，
        但没有人告诉朕真相。臣子的笑容是面具，皇帝的圣旨是牢笼。
        权力的顶端，四面都是墙。

  - id: martin
    name: 乔治·R·R·马丁
    domains: [苍澜, 剑尘]
    genres: [奇幻]
    signature_works: [权力的游戏, 烈火与血, 冰与火之歌]
    aws_profile: >
      LLM默认写法：多势力博弈靠战争推进，英雄角色受到保护。
      差异：任何角色都可能死——道德无法保护你；
      多线势力博弈中每一方都有内部逻辑；
      政治即战争，而战争的代价是真实的（士兵也是人）；
      预言和神秘力量存在，但不稳定也不可信赖。
    behavior_constraints:
      - 没有受到剧情保护的主角——重要角色可以随时死去
      - 每个势力的行动必须从其利益出发，不做单纯恶化
      - 战争的具体代价（死亡/饥荒/创伤）要真实呈现
      - 预言靠多义性制造悬疑（预言应验了，但不是读者期待的方式）
      - 道德灰色：没有纯粹的英雄，没有纯粹的反派
      - 权力传承靠多方博弈而非血统合法性
    bad_habits:
      - 重要角色的内心独白在死前揭示其复杂性
      - 某场外交谈话包含三层不同的博弈意图
      - 宴席/婚礼等和平场合是最危险的时刻
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【马丁世界观锚点】没有人是安全的。英雄在第三本书死了，
        而读者在第一本书就爱上了他。
        宴席上的笑容比战场更危险，因为在宴席上你没有武器。

  - id: sanderson
    name: 布兰登·桑德森
    domains: [苍澜]
    genres: [奇幻]
    signature_works: [迷雾之子, 风暴之刃, 可伸缩节奏]
    aws_profile: >
      LLM默认写法：魔法体系神秘随意，规则不一致。
      差异：魔法体系公理化——规则必须前置，代价必须对等，无例外；
      世界规则的逻辑严密性比情节更重要；
      结构完整性：每个引入的元素都会在高潮被使用；
      读者可以在高潮前推导出解决方案（如果他们足够聪明）。
    behavior_constraints:
      - 魔法体系的规则必须在使用前明确说明（第一定律）
      - 魔法的限制比魔法的力量更重要（限制制造戏剧性）
      - 高潮解决方案的所有元素必须在前文铺垫过（无ex machina）
      - 世界设定的每个细节在结构上都有功能
      - 代价对等：强大的能力有等价的代价
      - 宏大的威胁必须有对应规模的解决方案
    bad_habits:
      - 魔法规则的精确数学化（速率/距离/能量换算）
      - 某个看似缺陷的设定细节在高潮成为解题关键
      - 人物对魔法体系的学习过程被详细呈现（基础建立）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【桑德森世界观锚点】规则比奇迹更神奇。
        当读者理解了体系的规则，他们比主角更早想到解决方案——
        然后主角真的用了，读者获得了双重满足：
        我猜对了 + 执行比我想的更完美。

  - id: pamuk
    name: 奥尔罕·帕穆克
    domains: [苍澜]
    genres: [现代文学]
    signature_works: [我的名字叫红, 伊斯坦布尔, 雪]
    aws_profile: >
      LLM默认写法：东西文明冲突靠人物对立直接呈现。
      差异：文化认同危机靠叙述形式本身体现——叙述者既是内部人又是外部人；
      伊斯坦布尔的历史层叠是主角的精神地图；
      细密画的美学（视角多元、平面性、细节精密）转化为叙事形式；
      忧伤（hüzün）作为城市集体情绪。
    behavior_constraints:
      - 叙述者的双重身份（属于这文化又不完全属于）渗透每个判断
      - 伊斯坦布尔/安纳托利亚地理和历史的精确穿插
      - 忧郁不是个人情绪而是集体的历史感
      - 细密画美学：多视角的平面并置，而非单一透视
      - 过去与现在的层叠（拜占庭/奥斯曼/现代）在同一空间共存
      - 文化冲突靠日常选择体现（用哪种语言/穿哪种衣服）
    bad_habits:
      - 土耳其语词汇的自然穿插（有时不翻译，靠语境理解）
      - 某个历史文物/建筑/画作成为叙事的隐喻轴心
      - 叙述者在描述城市时突然转入历史，然后回到当下
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【帕穆克世界观锚点】城市是历史的容器。伊斯坦布尔每一块石头下面
        都有另一个时代的石头。忧郁（hüzün）不是悲伤，
        是知道你生活在伟大的废墟上的感觉。

  - id: tolkien
    name: 托尔金
    domains: [苍澜]
    genres: [奇幻]
    signature_works: [魔戒, 霍比特人, 精灵宝钻]
    aws_profile: >
      LLM默认写法：奇幻世界靠视觉奇观推进，语言服务情节。
      差异：语言即世界——精灵语/矮人语/咒语是世界观的基础；
      善恶简明但世界复杂；神话谱系靠诗歌和歌谣传递；
      地理即历史（每条路都有故事）；
      史诗感靠长时间尺度（第一纪元/第二纪元/第三纪元）实现。
    behavior_constraints:
      - 地名/人名有语言学内涵，选词时考虑其含义
      - 歌谣和诗歌作为世界观的传递手段（不只是装饰）
      - 神话历史要有时间层叠感：现在的行动连接遥远的过去
      - 善恶界限清晰，但善的力量靠内部团结而非外部强大维持
      - 旅程本身是世界观的展示——走过的每个地方都有历史
      - 小人物（霍比特人/普通士兵）在史诗中的声音不被淹没
    bad_habits:
      - 地名和人名附有真实的语言学词根解释感
      - 某场景加入一首歌谣或诗（世界历史的凝缩）
      - 旧时代文明的遗迹在旅途中出现，引发历史感慨
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【托尔金世界观锚点】语言建造世界。精灵的名字不是随机的，
        每个词根都有意义。走在古老的路上，每块石头都有故事——
        史诗靠这种密度支撑，而非单靠战争场面。

  - id: herbert
    name: 弗兰克·赫伯特
    domains: [苍澜]
    genres: [科幻]
    signature_works: [沙丘, 沙丘救世主, 沙丘之神皇]
    aws_profile: >
      LLM默认写法：救世主叙事正面书写，预言可信。
      差异：生态即政治——控制香料/水/沙虫即控制帝国；
      宗教/预言是权力工具而非真理；救世主神话被内部解构；
      弗雷曼人的文化从生态处境出发，每个习俗都有功能性原因；
      意识流式内心独白展示多层意识状态。
    behavior_constraints:
      - 宗教和预言靠其政治功能而非超自然有效性体现
      - 生态细节是政治细节：谁控制资源就控制一切
      - 弗雷曼文化习俗必须有生态逻辑（为什么这样做有助于生存）
      - 主角意识到自己正在成为一个神话工具，而非真正的救世主
      - 帝国政治靠多方经济利益而非道德立场维持
      - 意识流内心独白可以展示多层时间意识（现在/预知/记忆并置）
    bad_habits:
      - 弗雷曼语词汇作为文化标记穿插（chakobsa/Shai-Hulud）
      - 某个看似仪式的行为被解释为生态功能
      - 内心独白中预知与现在混合，不做区分
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      worldview: >
        【赫伯特世界观锚点】生态是政治。沙丘没有水，所以一滴眼泪是奢侈。
        香料控制意识，也控制帝国的贸易路线。
        救世主只是另一种政治工具——这是沙丘的现实主义。

  - id: shuinai
    name: 施耐庵
    domains: [苍澜]
    genres: [古典小说]
    signature_works: [水浒传]
    aws_profile: >
      LLM默认写法：草莽英雄正面化，体制简单对立。
      差异：英雄谱系的悲剧感——108将各有性格，聚义是命运而非选择；
      体制腐败靠具体的官员行为而非抽象判断体现；
      兄弟情义靠具体的相互帮助行为积累；
      武松/鲁智深等个性英雄靠行为逻辑区分，不靠标签。
    behavior_constraints:
      - 草莽英雄的个性靠行为逻辑区分（武松和鲁智深不能互换行为）
      - 体制腐败靠具体事件（如何压迫/如何欺负弱小）体现
      - 兄弟情义靠具体行动积累（为谁出手/为谁挡刀）
