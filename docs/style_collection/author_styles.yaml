authors:
- id: tiancantudou
  name: 天蚕土豆
  domains:
  - 剑尘
  genres:
  - 玄幻
  - 修仙
  signature_works:
  - 斗破苍穹
  - 武动乾坤
  - 大主宰
  aws_profile: 'LLM默认写法：战斗描述招式细节+情感爆发时内心独白。 差异：以"境界差距"为张力轴，用旁观者恐惧传递威压；对话极短，行动替代感叹； 章节末必留未解悬念；数量词用具体数字；突破靠身体感知而非心理。 整体节奏呈锯齿状：紧张段落每句不超15字，缓冲段落拉长至30字，交替切换。
    强敌登场公式：旁观者失态→空气凝固→强敌才现身。主角胜负转折不用"激斗后"， 一句话完成："萧炎右拳轰出，对方直接碎裂。"

    '
  behavior_constraints:
  - 战斗以"实力阶梯"为驱动，每次攻击前先写双方境界差
  - 对话每段不超过3句，第4句改为行动
  - 主角内心独白不超过2行，完成后立即有事件打断
  - 突破场景写"丹田热流/经脉暴涨"等具体身体感知，禁用"心中激动"
  - 场景切换前留一个未解悬念作为阅读引力
  - 配角出场时一句话写清：实力+职责+与主角关系三合一
  - 强敌登场：先写旁观者的腿软/变色，再写强敌本身
  - 章节末最后一句必须是下章开场锚点
  bad_habits:
  - 用"哗""嘶"等拟声词写能量流动
  - 战斗高潮时偶现"一拳轰出"类朴素无修饰描述
  - 同一段落内同一动词重复2-3次（如连续三段都有"冲"）
  - 境界名称反复出现，形成信息冗余
  ai_blacklist:
  - 眼中闪过一丝
  - 心中涌起一股
  - 令人窒息的压迫感
  - 身体本能地
  - 嘴角微微上扬
  - 感受到了什么
  - 忽然间
  - 竟然
  - 一时间
  - 随即
  - 整个人都
  - 缓缓地
  - 本能地感知到
  - 不知为何
  - 脑海中浮现
  style_anchors:
    battle: '【战斗锚点】境界差距是核心张力。强敌出场先写旁观者腿软，主角感知的是"气息压制"而非 外貌。战斗推进靠"能量消耗比"而非招式名称。胜负转折一句话，不用"激烈搏斗后"。每200 字改变一次局势。

      '
    breakthrough: '【突破锚点】突破是身体事件：丹田裂开→热流蔓延→经脉扩张→境界提升。 时间感：用"一秒、两秒……"创造节奏。突破前必有阻碍，解决后才能突破。

      '
- id: wochi_xihongshi
  name: 我吃西红柿
  domains:
  - 剑尘
  genres:
  - 玄幻
  - 修仙
  - 奇幻
  signature_works:
  - 盘龙
  - 星辰变
  - 莽荒纪
  - 九鼎记
  aws_profile: 'LLM默认写法：修炼时大量心理描写+激情内心独白。 差异：主角极度冷静，情感外露极少，思维高度系统化；修炼体系精密如数学公式， 每次突破前必有详细资源核算（材料数量、所需时间、成功概率）；对话功能化， 服务于信息传递而非情感宣泄；世界观宏大但叙述克制，不做过度渲染。
    战斗中主角始终保持理性分析视角，即便濒死也是"还有X%可能性"式思维。 情感爆发极罕见，一旦出现必须是积蓄多章的临界点，且以行动体现而非言语。

    '
  behavior_constraints:
  - 主角战斗时必须有资源/概率计算，哪怕一行也要有数字
  - 修炼体系描述精确：用等级编号而非模糊"强大许多"
  - 情感描写不超过2句，立即切换到行动或场景
  - 对话结束后跟一个行为动作，不留空白段
  - 敌人实力用可量化标准描述，禁用"感觉很强"类模糊判断
  - 世界观信息通过角色行动自然透出，不做说明式旁白
  - 章节结构：铺垫→事件→主角反应（不超3行）→下一事件
  bad_habits:
  - 战斗节奏均一，缺乏节奏变速
  - 配角性格趋同，缺少差异化语言习惯
  - 情感克制过度时偶显木讷，读者难以共情
  ai_blacklist:
  - 内心深处
  - 热血沸腾
  - 激动得颤抖
  - 感受到力量的涌动
  - 不禁心生敬佩
  - 眼神变得坚定
  - 深吸一口气
  - 难以置信地
  - 久久无法平静
  - 莫名的感动
  - 心跳加速
  - 暗暗发誓
  style_anchors:
    battle: '【战斗锚点】主角是战场上的算法机器：攻击前计算、攻击中调整、攻击后复盘。 不写"感觉"，只写"判断"。能量描述精确到单位，如"神力消耗约三成"。 战斗胜利后主角先清点损耗，再处理情绪（通常没有情绪描写）。

      '
    breakthrough: '【突破锚点】突破是工程项目：准备材料→启动→监控参数→完成。 每个阶段有明确指标。失败时主角立刻分析原因，下次改进方案已在脑中成型。

      '
- id: ergen
  name: 耳根
  domains:
  - 剑尘
  genres:
  - 修仙
  - 玄幻
  signature_works:
  - 我欲封天
  - 仙逆
  - 求魔
  - 一念永恒
  aws_profile: 'LLM默认写法：修仙小说用励志热血腔调，突破时欢欣鼓舞，师徒情深绵密。 差异：耳根底色是苍凉与孤独；主角永远以弱小之躯对抗天道，胜利是惨胜， 代价沉重；叙述节奏极慢，长达数章的铺垫只为一个爆发点；情感深埋在细节
    而非直接宣泄，旧物出现、场景重现是常用情感触发器；天道即反派， 修炼不是变强而是抗争；文字有古典诗歌的重量感，多用四字结构和排比蓄势。 高潮段落往往不是最激烈，而是最沉默的一句话，重量在留白里。

    '
  behavior_constraints:
  - 主角胜利必须付出具体代价，不允许无损完胜
  - 铺垫段落至少写3个细节才能推进主要事件
  - 情感触发用旧物/旧地/旧人出现，禁止直接内心独白宣泄
  - 天道/命运作为隐性反派，每章至少有一处"规则压迫"暗示
  - 高潮句子刻意控制在15字以内，以短促句制造重量
  - 古典意象（烛火、白发、故土）至少每两章出现一次
  - 孤独感通过"无人在场"或"无人理解"的场景呈现，不直接说"孤独"
  - 时间跨度描写用"又是一年"类自然流逝，不用精确计年
  bad_habits:
  - 情感蓄力过长时读者会脱离，节奏感弱是风险
  - 偶尔古典词汇堆叠导致现代读者阅读障碍
  - 多线并行时收线节奏偏慢
  ai_blacklist:
  - 热泪盈眶
  - 斗志昂扬
  - 充满希望
  - 心中一暖
  - 感激涕零
  - 欢欣雀跃
  - 激动万分
  - 心情大好
  - 充满力量
  - 迎难而上
  - 奋勇向前
  - 满怀期待
  - 豪情万丈
  style_anchors:
    battle: '【战斗锚点】战斗是消耗，不是展示。每个回合主角都在变弱，直到极限才爆发。 爆发不是热血，是绝望中的一击。战斗结束后重点写代价：受伤部位、寿命损耗、 内心的某种死亡。最强的战斗描写往往是最少的文字。

      '
    breakthrough: '【突破锚点】突破伴随失去：突破了，但某个东西再也回不来。 境界提升是与过去决裂的仪式。写突破前必须写失去什么， 读者要先感到心疼，再感到振奋。

      '
