  - 肝脑涂地
  - 情深义重
  - 舍生取义
  - 大义凛然
  - 侠肝义胆
  - 感同身受
  - 心疼不已
  - 热心相助
  - 情不自禁地帮
  - 良心发现
  - 回头是岸
  style_anchors:
    battle: '【战斗锚点】战斗是商业行为：投入vs产出。进攻时主角计算"这一击能结束战斗吗"， 能就全力打，不能就保存实力找更好时机。对手的花哨招式是消耗，主角等对手耗尽再出手。 战斗结束立刻清点战利品，不停留在胜利情绪里。

      '
