    战斗节奏快，招式名称极简，不堆砌华丽描述；平行世界的差异感靠细节 区分，不做系统说明；快感来自"主角永远比对手快一步"。

    '
  behavior_constraints:
  - 主角决策不超过1行内心戏，立即执行
  - 对话中每句话必须推进事件或传递信息，禁写情绪性废话
