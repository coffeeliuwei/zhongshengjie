- id: xuehong
  name: 血红
  domains:
  - 剑尘
  genres:
  - 修真
  - 都市
  - 末世
  signature_works:
  - 修真世界
  - 超级兵王
  - 末世黎明
  aws_profile: 'LLM默认写法：修真小说主角仁义道德，为朋友牺牲，情感丰沛。 差异：血红主角是功利主义者，资源最大化是核心逻辑；情感是战略工具， 不是目的；文字风格冷硬极简，不用华丽修辞；世界观残酷，强者制定规则， 弱者自然淘汰；对话短促直接，主角说话无废话，敌人的废话只是送死前奏；
    战斗描写聚焦"效率"，最少的代价解决目标；血腥场面不回避但不渲染， 一句话过去，不做道德评判。资源争夺是永恒主线，友情是暂时同盟。

    '
  behavior_constraints:
  - 主角每次行动前必有"收益核算"，哪怕隐含也要体现功利逻辑
  - 战斗描写效率优先：一招解决禁止拖成三招
  - 对话中主角不说废话，说废话的对手很快就死
  - 血腥/死亡场面一句话完成，不做情感渲染
  - 禁止主角为"原则"或"情义"做出降低效率的决策，除非有更大收益
  - 世界观通过角色行为体现，不做说教性旁白
  - 配角的死亡用资源数字衡量，而非情感损失
  bad_habits:
  - 极简风格偶显冷漠，读者难以找到情感锚点
  - 功利主角长篇后可能引发读者道德疲劳
  - 偶尔节奏过快导致场景感薄弱
  ai_blacklist:
