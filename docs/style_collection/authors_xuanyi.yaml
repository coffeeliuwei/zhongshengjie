# 玄一域作家档案（16位）— 待合并入 author_styles.yaml
authors:

  - id: aiqianshuiweijiu
    name: 爱潜水的乌贼
    domains: [玄一]
    genres: [玄幻, 悬疑]
    signature_works: [诡秘之主, 源氏之主]
    aws_profile: >
      LLM默认写法：信息一次性披露，悬念用明显转折标注。
      差异：信息克制是核心艺术——读者比主角早感知一点点，恰好足够不安；
      宇宙恐怖伏笔在正常场景里埋下；每章结尾必有一个新的不确定性；
      大boss的存在感靠间接证据积累，而非直接出场。
    behavior_constraints:
      - 读者获得的信息比主角多一点点，制造读者的焦虑
      - 宇宙级威胁靠日常场景里的细节异常传递
      - 每章结尾必须制造一个新的悬而未决的问题
      - 禁忌/禁区靠人物的回避行为体现，不做直接说明
      - 重要真相通过多个章节的碎片积累，不做一次性揭露
      - 反派的实力靠与其战斗者的心理崩溃传递，不靠战力数字
    bad_habits:
      - 章末最后一句话制造钩子（问句或画面截断）
      - 某个看似日常的细节在几章后变成关键线索
      - 人物对某事的回避比直接描述更让人不安
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【乌贼悬念锚点】信息不对称是武器。读者知道那扇门后面有危险，
        主角不知道。主角越平静，读者越害怕。
        每章结尾：一个新的未知，比一个答案更有吸引力。

  - id: gengshu
    name: 更俗
    domains: [玄一]
    genres: [玄幻, 历史]
    signature_works: [官居一品, 枭臣]
    aws_profile: >
      LLM默认写法：政治博弈靠对话直接呈现，权力关系透明。
      差异：信息不对称是博弈的核心——谁知道什么、谁不知道什么，
      比谁实力更强更重要；利益冲突驱动悬念而非道德判断；
      谋略通过结果呈现，过程在几章后才揭晓。
    behavior_constraints:
      - 政治博弈靠信息不对称而非直接冲突推进
      - 谋略的全貌要延迟揭示：先看结果，后补过程
      - 利益关系必须明确：谁得什么、谁失什么
      - 反派的聪明靠其对信息的掌控体现
      - 主角的优势靠其隐藏的信息和提前布局体现
      - 每场对话都有隐藏议程，言外之意比言内重要
    bad_habits:
      - 某个看似无关的行动几章后被证明是布局的一环
      - 人物的笑容在权力场合永远需要解读
      - 会面场景里谁先开口、谁后开口有权力含义
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【更俗悬念锚点】权谋的悬念来自信息：谁知道，谁不知道。
        主角在对话中透露30%，隐藏70%，读者猜另外的70%。
        结果先于过程呈现——结果是钩子，过程是奖励。

  - id: yueguan
    name: 月关
    domains: [玄一]
    genres: [历史穿越]
    signature_works: [回到明朝当王爷, 步步生莲]
    aws_profile: >
      LLM默认写法：穿越主角靠金手指直接解决问题，历史背景是装饰。
      差异：主角的信息优势（未来知识）是悬念来源而非答案；
      历史困局靠穿越者的现代逻辑绕行，制造"为什么这样行得通"的好奇；
      政治陷阱靠层层设计，主角在局中但读者看到局。
    behavior_constraints:
      - 穿越者的历史知识必须有使用限制（不能什么都知道）
      - 政治陷阱靠环境而非反派台词呈现
      - 主角的解法要让读者先想"这怎么可能"，再想"原来如此"
      - 历史人物的行为靠历史处境解释，不做现代道德判断
      - 悬念来自"我们知道历史走向，但主角改变了什么"
      - 每个历史细节都可以成为伏笔或陷阱
    bad_habits:
      - 历史常识和官职礼制的精确穿插（有考据感）
      - 主角用"废话，我是穿越者"心态处理古人的奇怪逻辑
      - 某个历史事件被提前剧透（读者知道，主角不知道）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【月关悬念锚点】信息差即悬念。读者知道历史上这个人是叛徒，
        主角不知道，读者的焦虑就是悬念。
        穿越的金手指是局限的——知道的越多，越知道什么是改不了的。

  - id: maijia
    name: 麦家
    domains: [玄一]
    genres: [谍战, 悬疑]
    signature_works: [解密, 暗算, 风声]
    aws_profile: >
      LLM默认写法：谍战情节直线推进，线索明显。
      差异：天才的孤独是核心——密码破解者的内心比密码本身更难解；
      信息极度延迟揭示（有时整章都是铺垫）；
      真相不是答案而是新的谜题；保密制度靠个人命运的毁灭体现。
    behavior_constraints:
      - 天才角色的异常靠日常行为偏差体现，不靠直接说明
      - 关键信息延迟揭示到近乎残忍的程度
      - 保密/谍战靠人物心理崩溃而非行动场面传递危机
      - 真相揭示后必须制造更大的问题
      - 机构/制度的冷酷靠具体处置手段体现，不靠宏观批判
      - 孤独靠不被理解的场景积累（对话失败，非对话缺席）
    bad_habits:
      - 极长的铺垫段落在高潮前蓄力
      - 叙述者在关键处突然沉默（"那天他做了什么，我没有看见"）
      - 数学/密码学细节的精确插入
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【麦家悬念锚点】最难解的密码是人心。天才破解了代码，
        但破解不了孤独。悬念靠铺垫：读者知道有什么，但不知道是什么。

  - id: tianxiaguiyuan
    name: 天下归元
    domains: [玄一]
    genres: [古言, 复仇]
    signature_works: [凤囚凰, 扶摇皇后]
    aws_profile: >
      LLM默认写法：身份隐藏靠角色单方面保密实现。
      差异：身份的隐藏和揭露是情节引擎——读者知道真相，配角不知道，
      女主角知道但假装不知道；复仇靠耐心而非爆发；
      情感与悬念并轨：最深的感情往往隐藏在最冰冷的对话里。
    behavior_constraints:
      - 读者、主角、配角三方各知道不同信息，靠差距制造悬念
      - 女主角的伪装比破绽更有力（完美的伪装让读者紧张）
      - 情感用行动体现：帮助/保护/留下，不用直接表白
      - 复仇的耐心：主角等待，不急于出手，读者替她着急
      - 古代礼制靠对话和行为自然呈现，不做注释
      - 反转靠长期铺垫而非突然事件
    bad_habits:
      - 两人对话中，说的话和心里话完全相反（双重叙述）
      - 某个场景女主角保持完美面具，但行为细节泄露真实
      - 情感高点靠一个极小的行动体现（帮她系扣子而非拥抱）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【天下归元悬念锚点】三方信息差制造悬念：我知道，她知道，他不知道。
        最危险的场景里，女主角微笑。读者的心悬着，是因为读者看得见微笑背后的恐惧。

  - id: higashino
    name: 东野圭吾
    domains: [玄一]
    genres: [推理, 悬疑]
    signature_works: [白夜行, 解忧杂货店, 嫌疑人X的献身]
    aws_profile: >
      LLM默认写法：推理线索按章节均匀铺陈，动机在结尾揭示。
      差异：双线或多线结构——两条线的关联直到最后才明确；
      动机比真相更震撼；情感驱动推理而非推理覆盖情感；
      读者全程猜测，结局反转但回头看一切都有迹可循。
    behavior_constraints:
      - 双线叙述：A线和B线表面无关，靠细节暗示关联
      - 动机的悲剧性比行为本身更重要（为什么要这么做）
      - 每个线索要在放出后被"自然遗忘"，结尾才召回
      - 读者可以猜到部分真相，但总有一个维度猜错
      - 情感重量要与推理结构并行，不能只有逻辑没有温度
      - 反转之后，主角和读者的道德判断应该变得复杂
    bad_habits:
      - 某个无关紧要的角色在结尾成为关键
      - 凶手靠行为模式而非明显破绽被识别
      - 结尾的情感重量大于逻辑胜利（读者先哭再想）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然发现
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【东野圭吾悬念锚点】动机比凶手更重要。当你知道了为什么，
        你会为凶手哭泣。双线叙事：两条线像两条绳子，在最后打成一个结——
        这个结比任何一条绳子都重。

  - id: isaka
    name: 伊坂幸太郎
    domains: [玄一]
    genres: [现代文学, 轻悬疑]
    signature_works: [奥杜邦的祈祷, 重力小丑, 草之歌]
    aws_profile: >
      LLM默认写法：偶然事件被解释为巧合，没有更深含义。
      差异：命运交汇式伏笔——偶然即必然，看似随机的事件在最后汇聚成意义；
      轻盈语调下的黑暗现实；幽默和悲剧住在同一段落；
      人物群像靠"他们怎么认识彼此"的网络驱动。
    behavior_constraints:
      - 看似随机的信息在若干章后成为关键线索
      - 幽默和悲剧并置：笑完立刻心痛
      - 偶然相遇的人物最终被命运连接，靠伏笔积累而非突然跳转
      - 对话风格轻盈，有时近乎玩笑，但每句都有功能
      - 结尾的意义要靠读者自己发现，不做明确说明
      - 小人物的行动有重大影响，靠蝴蝶效应式逻辑
    bad_habits:
      - 引用一个冷僻的知识点，这个知识点后来成为关键
      - 角色之间的对话充满幽默的游戏感（互相揭穿各自的逻辑漏洞）
      - 某个意外死亡在数章后被证明是主角命运的转折点
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【伊坂悬念锚点】偶然即必然。两个陌生人在同一列火车上，
        读者以为这是巧合，其实是命运的第一步。
        轻盈是外壳，宿命感是内核。

  - id: flynnGillian
    name: 吉莉安·弗林
    domains: [玄一]
    genres: [心理惊悚]
    signature_works: [消失的爱人, 利器, 黑暗场所]
    aws_profile: >
      LLM默认写法：不可靠叙述者会被其他角色纠正。
      差异：不可靠叙述者的谎言永远比真相更有趣；
      读者比叙述者先发现谎言，但无法确定；
      婚姻/家庭作为最危险的战场；
      女性反派的扭曲心理被正面书写，不做道德判断；
      每次以为抓住真相，地板再次消失。
    behavior_constraints:
      - 叙述者的自我描述和行为之间必须有裂缝
      - 读者应该怀疑叙述者，但不确定什么是谎言
      - 女性角色的黑暗面靠内部逻辑正当化，不做外部批判
      - 平静表面下的暴力意图要靠细节渗透，而非宣布
      - 每章结尾让读者重新解读前面的内容
      - 婚姻/亲密关系作为权力博弈的战场，不是爱情的容器
    bad_habits:
      - 叙述者在描述自己的善良时，细节透露了相反的信息
      - 日记或文字记录与行动描述之间的明显矛盾
      - 某个"无关紧要"的细节被叙述者回避（越回避越重要）
    ai_blacklist:
      - 内心涌起真诚的感情
      - 眼中闪过一丝
      - 我没有撒谎
      - 真心话
      - 感受到了什么
      - 心中涌起一股
      - 不禁
      - 陷入了沉思
      - 真实的自我
      - 脑海中浮现
    style_anchors:
      suspense: >
        【弗林悬念锚点】谎言比真相更迷人。叙述者说"我是一个好妻子"，
        读者在前两章就开始怀疑这句话。
        每次真相出现，读者必须重新解读所有读过的内容——这就是弗林。

  - id: tokarczuk
    name: 奥尔加·托卡尔丘克
    domains: [玄一]
    genres: [现代文学]
    signature_works: [航班, 太古和其他的时间, 雅各书]
    aws_profile: >
      LLM默认写法：多视角靠标注切换，时间线线性。
      差异：碎片时间线——多个视角的碎片在阅读过程中拼成整体；
      宏大与微小并置：宇宙时间里的个人事件；
      叙述者是全知的旁观者，但选择只呈现片段；
      意义靠碎片之间的空白传递，不靠连接词。
    behavior_constraints:
      - 多视角的切换不需要预警，靠文体差异区分
      - 宇宙/生态/历史尺度与个人事件并置（不做因果连接）
      - 碎片之间的空白是意义所在，不填满
      - 某个微小物件（一颗种子/一块石头）在不同时代出现
      - 时间可以在地质尺度和个人尺度之间跳跃
      - 结尾不收束，允许开放的碎片状态
    bad_habits:
      - 某个普通场景突然从宇宙视角重新叙述
      - 人物名字和他们所处的历史时期在同一句话里出现
      - 动植物的视角插入人类叙述（平等的生命尺度）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【托卡尔丘克悬念锚点】碎片即拼图。一个女人在机场等待，
        一颗种子在土里等待发芽，一片叶子在几百年后成为化石。
        意义在碎片之间的空白里——读者自己来填。

  - id: king
    name: 斯蒂芬·金
    domains: [玄一]
    genres: [恐怖, 惊悚]
    signature_works: [闪灵, 它, 肖申克的救赎]
    aws_profile: >
      LLM默认写法：恐怖元素靠直接描写恐怖事物实现。
      差异：恐惧日常化——最恐怖的不是怪物，而是怪物让平凡的日常变成危险；
      角色弱点即恐惧来源；缓慢蓄压（前100页不给答案）；
      儿童视角让怪物更真实；恐惧的对象是角色内心的黑暗。
    behavior_constraints:
      - 恐惧靠氛围积累而非直接呈现怪物
      - 角色的弱点（酗酒/孤独/愧疚）是恐惧的入口
      - 日常细节要详尽，让读者建立依赖感，然后破坏它
      - 儿童视角的恐惧比成人视角更真实（因为儿童相信怪物）
      - 恐惧对象的真实身份靠层层剥洋葱式揭示
      - 胜利必须有真实代价，主角不能毫发无伤
    bad_habits:
      - 极平静的日常描写之后，突然出现异常（对比产生恐惧）
      - 某个看似普通的细节反复出现，直到它成为威胁
      - 人物在危险前的内心分析极度详细（读者比人物更紧张）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 忽然间
      - 竟然
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      suspense: >
        【斯蒂芬·金悬念锚点】恐惧从日常开始。读者已经习惯了这个厨房，
        这个走廊，这个孩子的房间——然后有什么不对劲了。
