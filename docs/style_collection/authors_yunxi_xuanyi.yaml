      - 轻松破解了
      - 智慧超越常人
      - 他的大脑异于常人
      - 密码不在话下
      - 一切都在掌握之中
      - 天才的洞察力
      - 无人能及的才华
      - 破译只是时间问题
    style_anchors:
      encrypted_narrative: >
        天才在做某件事，旁观者描述他的行为而无法解释动机（"他把那张纸折了三次，
        然后放进抽屉，没有说话"）。读者和旁观者一起困惑。然后跳到结果：事件发生了，
        结果证明他是对的。但动机和过程仍未解释。这种叙述制造的悬念是认知性的：
