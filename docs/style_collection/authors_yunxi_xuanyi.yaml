    aws_profile: >
      LLM默认写法是古言情节线性，情感高潮在固定节点出现，人物身份相对透明。天下归元
      的差异在于反转密集且有情感厚度——反转不只改变情节，同时改变读者对人物情感的
      评价。人物身份的隐藏是叙事核心，但不是纯粹的推理谜题，而是情感游戏。悬念和
      情感同步运作，情绪高点往往也是信息揭示点，两者相互强化。
    behavior_constraints:
      - 人物身份须有至少一层隐藏，且这层隐藏须与情感发展同步
      - 反转须同时改变情节意义和情感意义
      - 情感悬念（他是否爱她）和情节悬念（她是否活着）须并行运作
      - 反转节奏须控制：不能反转太密集（每章一转会疲劳）
      - 古代背景须真实：礼制、服饰、政治须有细节支撑
      - 女性主角须有主体性：她的悬念和男性角色同等重要
      - 伏笔须在反转处被激活，读者回看能发现早有暗示
      - 情感高潮须和信息揭示共同设计，不能分离
    bad_habits:
      - 反转密集时偶有逻辑自洽问题
      - 男女主CP的虐恋有时处理得偏向男性视角
