    signature_works: [诡秘之主]
    aws_profile: >
      LLM默认写法是将悬念直接表达（"某种可怕的事即将发生"），信息披露相对平均。
      爱潜水的乌贼的差异在于信息克制到精确——读者永远比角色知道多一点点，这"一点点"
      制造不安而非恐惧。宇宙恐怖元素以规则体系形式出现（序列、职业、邪神），
      可知的规则下是更深的不可知。每章结尾悬念必须落在角色行动点上，而非情绪点上。
    behavior_constraints:
