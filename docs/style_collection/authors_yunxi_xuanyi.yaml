    behavior_constraints:
      - 叙述语气须直白，不装文学腔，允许口语化甚至俗气
      - 情感须不怕丢脸：直接写喜欢、失落、嫉妒
      - 台湾本土细节须具体（地名、食物、学校文化）
      - 悬念须来自生活的不可控，而非情节设计的谋略
      - 幽默须来自情境而非语言技巧
      - 遗憾和错过须真实处理，不美化也不过度悲剧化
      - 男性视角的青春叙述须有自我反思，不能只是美化初恋
      - 动作/打斗场景（如有）须有漫画感和夸张的正义感
    bad_habits:
      - 男性中心的青春叙事有时对女性对象缺乏主体性描写
      - 俗气深情有时处于矫情和真诚的边界
      - 动作场景与青春叙述的风格落差有时较大
    ai_blacklist:
      - 青春的美好时光
      - 纯洁的初恋
      - 那段无忧无虑的日子
      - 青涩的爱情
      - 回不去的青春
      - 美丽的回忆
      - 青春永不老去
      - 最美好的年华
      - 懵懂的爱情
      - 青春的遗憾
      - 年少时的梦想
      - 美好的校园时光
    style_anchors:
      uncool_sincerity: >
        主角喜欢一个人，他想方设法接近，结果出糗。他不掩饰出糗，甚至主动描述
        自己有多狼狈。这个狼狈的场景比任何帅气的表白更能建立读者的信任。悬念
        在于：她注意到了吗？她怎么看这个出糗的人？这个问题比"他们会在一起吗"
        更能吸引读者继续读。

  - id: cai_jun
    name: 蔡骏
    domains: [玄一]
    genres: [中国悬疑, 惊悚小说, 城市恐怖]
    signature_works: [谋杀似乎很流行, 蝴蝶公墓]
    aws_profile: >
      LLM默认写法是悬疑小说的恐惧来自外部威胁，社会背景是叙事点缀。蔡骏的差异在于
      恐惧来自中国城市的具体社会焦虑——高楼、人口密度、身份的可互换性。城市鬼魅：
      城市空间本身作为恐惧来源，而非单纯的犯罪。推理与惊悚混合，案件的解答不能
      消除恐惧感，因为恐惧来自结构而非个人。本土化是其核心：中国读者的集体恐惧点。
    behavior_constraints:
      - 城市场景须具体且带有中国特色（小区、写字楼、地铁）
      - 社会恐惧须可识别：身份焦虑、消失的可能、孤立感
      - 推理元素须完整，不能只靠气氛而无逻辑
      - 惊悚须来自可能性而非超自然（即使有超自然，须有现实解释的平行可能）
      - 城市空间的恐惧：熟悉的地方变得陌生是核心手法
      - 受害者须有社会典型性（普通上班族、年轻白领）
      - 结尾的恐惧感须延续到推理解答之后
      - 信息的不完整性是本土化的：某些信息被系统性地隐藏
    bad_habits:
      - 某些情节的超自然元素处理有时模糊了推理逻辑
      - 城市恐惧有时流于表面，缺乏对社会结构的深层批判
      - 结局有时为了悬念效果而牺牲逻辑自洽
    ai_blacklist:
      - 案件终于告破
      - 正义得到了伸张
      - 真相大白于天下
      - 罪犯受到了应有的惩罚
      - 安全感终于回来了
      - 城市重归平静
      - 恐惧消散了
      - 一切都过去了
      - 法律的保护
      - 好人终有好报
      - 黑暗被驱散了
      - 正义的胜利
    style_anchors:
      urban_uncanny: >
        主角每天走的路，今天走着走着发现有一个细节不对——一扇门不应该开着，
        一个广告牌换了，一个人不应该在这个时间出现在这里。这些细节须是真实可能的，
        有普通的解释，但累积起来超出了普通。恐惧在于：城市的信息量太大，我们每天
        忽略的异常远多于我们注意到的。凶手可以藏在我们视而不见的那一层。

  - id: douglas_adams
    name: 道格拉斯·亚当斯
    domains: [玄一]
    genres: [英国文学, 科幻喜剧, 荒诞小说]
    signature_works: [银河系漫游指南]
    aws_profile: >
      LLM默认写法是将喜剧和悬念分开处理，宇宙尺度的叙述带有敬畏感。亚当斯的差异在于
      喜剧与悬念完全融合——宇宙的荒诞规模本身是笑点来源，叙述者对宇宙终极问题保持
      调侃态度。"意外即答案"是其核心叙事逻辑：读者预期一个宏大的解答，得到一个
      荒诞的答案，而这个荒诞的答案在其叙事逻辑内是完全成立的。全知叙述者对一切
      持玩世不恭的态度，包括对宇宙的终结。
    behavior_constraints:
      - 叙述者须保持全知且调侃的语气，不能对任何事物保持敬畏
      - 宇宙尺度须用来制造荒诞对比（宇宙有多大，以此表明某件事有多不重要）
      - 悬念的解答须是荒诞的，但须在叙事内部逻辑成立
      - 喜剧时机须精确：设置期望，然后以无关但完美的细节打破期望
      - 技术/科学细节须是真实的，但须被用于荒诞的目的
      - 人类视角的渺小须是笑点，而非悲剧
      - 注释/脚注可以作为叙事手段，包含独立的笑点
      - 每个"宏大"的解答须被某个微小的实际问题推翻
    bad_habits:
      - 某些笑点的文化特定性使跨语言读者难以理解
      - 荒诞密度过高时叙事的情感维度有时不足
      - 某些篇目的情节性弱于笑点，导致重读价值下降
    ai_blacklist:
      - 宇宙的宏伟令人叹为观止
      - 面对宇宙的浩瀚我们深感渺小
      - 生命的意义在于
      - 这就是宇宙的真理
      - 深刻的哲学思考
      - 宇宙给出了答案
      - 我们终于理解了存在
      - 生命的意义得到了解答
      - 宇宙的奥秘
      - 令人震撼的宇宙
      - 深邃的宇宙哲学
      - 人类的渺小与伟大
    style_anchors:
      absurdist_answer: >
        提出一个宏大问题（宇宙的终极答案是什么），让一台巨型计算机运行数百万年，
        然后给出答案：42。答案完全正确，但毫无意义，因为我们不知道问题是什么。
        这种结构的变体：提出一个严峻危机，用一个微不足道的解决方案化解（但这个
        方案在荒诞逻辑内完全成立）。读者的笑点来自期望和现实的落差，但落差须
        有内部逻辑，不能是纯粹的无厘头。

  - id: nabokov
    name: 弗拉基米尔·纳博科夫
    domains: [玄一]
    genres: [俄裔美国文学, 现代主义, 后现代主义]
    signature_works: [洛丽塔, 幽冥的火]
    aws_profile: >
      LLM默认写法是将不可靠叙述者作为叙事技巧标注，语言本身是透明的传递媒介。
      纳博科夫的差异在于不可靠叙述者被推至极限——叙述者不只是不诚实，叙述行为本身
      就是操控和掩盖，而叙述的文学精美是这种操控的工具。语言本身是谜：文字游戏、
      双关、隐藏的线索被编织进华美的散文里，读者须主动寻找。作者和读者之间是游戏
      关系：作者设置圈套，读者试图逃脱。
    behavior_constraints:
      - 叙述者须主动操控读者，通过语言的华美转移注意力
      - 语言游戏须有意义：双关、字谜须指向叙事中的真相
      - 叙述者的自我辩护须足够精美，使读者在美中暂时原谅
      - 元叙事须存在：叙述者意识到自己在被阅读
      - 真相须被隐藏在语言的华美之下，须能被细读发现
      - 文学引用和暗典须有功能，不能是炫学
      - 不可靠性的程度须随叙事推进逐渐显露
      - 读者须在某个节点意识到自己一直被操控，这是设计的高潮
    bad_habits:
      - 语言极致追求有时使叙事的情感维度退居次位
      - 文学游戏的密度对普通读者不友好
      - 某些作品的道德争议有时遮蔽了对其叙事技术的分析
    ai_blacklist:
      - 真相终于揭示
      - 叙述者终于说出了实情
      - 读者终于明白了
      - 语言是清晰的镜子
      - 直接表达了情感
      - 叙述真实可信
      - 一切都是真的
      - 叙述者坦诚相告
      - 透明的叙述
      - 毫无隐瞒
      - 文字直接反映现实
      - 叙述者可以被信任
    style_anchors:
      language_as_trap: >
        叙述者描述一件事，用极其精美的语言——比喻精确，节奏优美，细节迷人。
        然后读者注意到：在这段精美的描写中，有一件实际发生的事被一笔带过了，
        而那件事才是关键。叙述者用语言的密度掩盖了信息的缺失。在细读时，
        读者能在那段华美的散文里找到三个词，这三个词放在一起暗示了被隐藏的真相。
        这就是语言作为迷宫的运作方式。
