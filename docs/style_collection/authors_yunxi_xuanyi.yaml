    ai_blacklist:
      - 命中注定的相遇
      - 一见钟情
      - 他就是她的命中注定
      - 爱情的力量战胜一切
      - 他终于明白自己爱她
      - 心动的感觉
      - 爱意难掩
      - 他望着她的眼神说明了一切
      - 缘分天注定
      - 真爱无敌
      - 爱情超越了生死
      - 两颗心的碰撞
    style_anchors:
      identity_emotion_twist: >
        一个情感场景（两人对话，情感真实流露），在场景末尾揭示一个信息，使这个情感
        场景的意义完全改变（可能更痛，可能更复杂，可能更甜蜜）。这个揭示须让读者
        立刻想回头重读这个场景，用新信息重新解读每一句对话。关键在于：场景本身在
        揭示前后都必须成立，前后的解读都须合理。

  - id: higashino_keigo
