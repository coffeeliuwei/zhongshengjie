      - 侦探的直觉告诉他
      - 证据确凿无误
    style_anchors:
      dual_line_convergence: >
        两条叙事线分别推进，各有自己的悬念（A线：某人为何失踪；B线：某公司内部
        的秘密）。两线在各自推进时，要偶尔放入一个细节，该细节在当前线条内意义
        普通，但当两线汇合时，该细节成为关键连接点。汇合的时机须让读者既意外
        又感觉"早该想到"。

