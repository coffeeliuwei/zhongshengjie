    bad_habits:
      - 主角信息优势有时处理得过于便利
      - 历史政治严肃性与网文爽感之间平衡时偶有失衡
      - 女性人物的历史处境有时被浪漫化处理
    ai_blacklist:
      - 凭借超前知识
