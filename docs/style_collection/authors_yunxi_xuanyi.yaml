      LLM默认写法是权谋叙述依赖主角的英雄主义或运气，信息大多对称地分配给读者和角色。
      更俗的差异在于悬念来自利益冲突的结构性设计——每个人物都有明确的利益立场，
      博弈产生的悬念是逻辑的而非偶然的。信息不对称是主动设计的：哪些人知道什么、
      哪些人不知道什么，构成权力地图。节奏是政治性的——慢铺垫、关键决策点爆发。
    behavior_constraints:
