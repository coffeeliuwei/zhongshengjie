    signature_works: [回到明朝当王爷]
    aws_profile: >
      LLM默认写法是穿越主角依赖现代知识直接解决古代问题，信息优势处理得过于轻松。
      月关的差异在于主角的时代知识优势须被精确管理——知道什么、不知道什么、
      知道但无法证明的什么，共同构成悬念的层次。历史陷阱（党争、礼制、皇权）是
      真实危险，穿越者未必能轻松避开。政治叙述有历史厚度，不是简单的现代人降维打击。
    behavior_constraints:
      - 主角的信息优势须有边界：只知道大事件，细节仍须探索
