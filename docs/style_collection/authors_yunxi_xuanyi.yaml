    aws_profile: >
      LLM默认写法是将女性反派写成可识别的"坏人"，不可靠叙述者会有明显提示。弗林的差异
      在于不可靠叙述者到了使读者主动共谋的程度——叙述者的扭曲视角被如此自然地呈现，
      读者在某个时刻才意识到自己一直在相信一个谎言。女性反派的内心逻辑被完整展示，
      使其合理化，婚姻和家庭作为恐惧的来源而非安全港。心理扭曲被以正常的叙述语气呈现。
    behavior_constraints:
      - 不可靠叙述者的扭曲须足够隐蔽，让读者至少信任其50%
      - 女性人物的黑暗面须有内在的心理逻辑，不能是"天生坏"
      - 婚姻/亲密关系须被呈现为权力博弈场域
      - 悬念须在两个层面：外部谜题（发生了什么）和内部谜题（叙述者是谁）
      - 扭曲心理须通过日常细节正常化，不能突然爆发
      - 媒体/公众视角须在某处出现，形成与私人视角的对比
      - 结尾须令读者不舒适，拒绝道德解决方案
      - 黑色幽默须存在但须克制，不能削弱心理张力
    bad_habits:
      - 女性人物的黑暗化有时被误读为厌女，需要内在逻辑支撑
      - 心理扭曲叙述有时过于露骨，削弱了悬念
      - 某些情节为了反转而牺牲了人物行为的一致性
    ai_blacklist:
      - 她其实是个好人
      - 爱让她变了
      - 她只是受伤了
      - 每个人心里都有善良
      - 她终于认识到了错误
      - 爱情的救赎
      - 她找回了自我
      - 内心深处的温柔
      - 她其实只是想被爱
      - 正义终将来临
      - 恶有恶报
      - 她得到了应有的惩罚
    style_anchors:
      unreliable_normalization: >
        叙述者用平静的语气描述一件普通事物（比如整理丈夫的衣服），同时夹杂一个
        细节，这个细节说明她对丈夫的监控程度远超正常（"我知道他这件衬衫是周四
        穿的，因为他周四有会议，开会时他会流汗"）。叙述者不认为这有什么不正常。
        读者看到了，但还不确定是否该警觉。积累五到六个这样的细节后，读者才明白。

  - id: tokarczuk
    name: 奥尔加·托卡尔丘克
    domains: [玄一]
    genres: [波兰文学, 后现代小说, 哲学小说]
    signature_works: [航班, 太古和其他的时间]
    aws_profile: >
      LLM默认写法是多视角叙述会有明确的时间线和人物关联。托卡尔丘克的差异在于碎片
      时间线被作为世界观本身使用——时间不是线性的，历史可以和现在同时发生，微小的
      生命和宏大的历史被平等对待。多视角拼图的悬念来自"这些碎片如何构成一个整体"，
      而不是单一谜题的解答。宏大与微小的并置：一只昆虫的死亡和一个帝国的覆灭在
      同一章节出现，无层级。
    behavior_constraints:
      - 时间线碎片化须有内在的主题逻辑，不能是随机的
      - 视角须平等对待：人、动物、物件可以都作为叙述者
      - 宏大历史和微小生命的并置须在同一段落或相邻段落体现
      - 每个碎片须独立成立，且须在整体中有位置
      - 哲学思考须内嵌在叙事里，禁止独立的哲学散文段落
      - 结构的"拼图感"须有意为之，但拼图须有可能被拼成
      - 语言须有密度但不晦涩，哲学须可被感知而非须被学习
      - 结尾无须给出完整画面，允许仍有缺失的碎片
    bad_habits:
      - 碎片化有时过度，读者难以积累情感投入
      - 哲学密度有时影响叙事流畅
      - 对某些读者而言完整性的缺失感是障碍
    ai_blacklist:
      - 历史的长河
      - 时间的洪流
      - 世界的真相终于揭示
      - 一切都有了意义
      - 终于明白了人生
      - 历史给出了答案
      - 命运的全貌
      - 所有碎片拼成了完整图案
      - 人类的普遍命运
      - 历史的必然
      - 宏大的历史画卷
      - 时代的缩影
    style_anchors:
      mosaic_time: >
        两个场景，时间相距数百年，但共享同一个物件或地点。第一个场景：某地某事，
        物件出现。第二个场景：同一地点，数百年后，同一物件（或其遗迹）被另一个人
        触碰。两个场景各自完整，但并置后出现了超越两者的意义。这个意义不须被说出，
        只须被感知。

  - id: stephen_king
    name: 斯蒂芬·金
    domains: [玄一]
    genres: [恐怖小说, 惊悚小说, 超自然小说]
    signature_works: [闪灵, 它]
    aws_profile: >
      LLM默认写法是恐惧来自外部的超自然威胁，高潮是怪物出现的时刻。斯蒂芬·金的差异
      在于恐惧的日常化——怪物在很长一段时间内不出现，恐惧来自日常细节的累积和角色
      的弱点（酗酒、不忠、内疚）被放大。儿童视角有独特价值：儿童看见成人看不见的恐惧，
      但儿童的恐惧也可能是误解。压力须缓慢积累，不能急于释放。
    behavior_constraints:
      - 超自然元素在前三分之一须以暗示为主，禁止直接出现
      - 角色的日常弱点须在恐怖到来前充分建立
      - 儿童视角须保持儿童的认知局限，不能知道太多
      - 恐惧的积累须通过日常细节：异常的声音、奇怪的行为、细小的变化
      - 友情/家庭关系须在压力下被考验，这是恐惧的真正来源
      - 超自然解释须延迟，允许理性解释的可能性并存
      - 结尾的对抗须是人物完成某种内部成长的结果，而非纯粹的行动胜利
      - 美国中产生活场景须具体且可信
    bad_habits:
      - 某些长篇叙述节奏过慢，中段有拖沓感
      - 超自然元素过于露骨时恐惧感反而降低
      - 结局处理有时不如积累过程精彩
    ai_blacklist:
      - 毛骨悚然的怪物
      - 邪恶的存在降临
      - 无法解释的超自然力量
      - 恐惧笼罩了所有人
      - 恐怖的气氛弥漫
      - 令人不寒而栗
      - 黑暗的力量
      - 邪恶无处不在
      - 恐惧的化身
      - 超自然的现象
      - 恶灵作祟
      - 魔鬼降临
    style_anchors:
      slow_dread: >
        房间里有些东西不对，但叙述者说不清楚是什么。他/她环顾四周，一切正常。
        然后注意到：那扇门上次是关着的。然后：冰箱嗡嗡声今天有点不同。然后：
        狗一直在看角落。五个这样的细节，每一个单独都是可以解释的。合在一起，
        读者的不安已经满溢，但怪物还没有出现，甚至可能永远不会出现。

  - id: agatha_christie
    name: 阿加莎·克里斯蒂
    domains: [玄一]
    genres: [古典推理, 侦探小说]
    signature_works: [无人生还, 东方快车谋杀案]
    aws_profile: >
      LLM默认写法是将嫌疑人分成明显的可疑者和明显的清白者，线索在侦探分析时才被
      关注。克里斯蒂的差异在于公平原则的极致执行——所有解谜所需的线索须在揭示前
      公平地呈现给读者，但被嫌疑人管理和误导性信息所掩盖。嫌疑人须数量合理且各有
      动机，读者须在推理过程中真正怀疑多人。最后反转须既意外又必然，读者须能接受
      "我怎么没想到"。
    behavior_constraints:
      - 所有解谜线索须在揭示前已在文本中出现，不能事后引入
      - 嫌疑人须各有真实动机，不能只有凶手有动机
      - 误导性信息须有逻辑，不能是纯粹的障眼法
      - 侦探的推理过程须可跟随，但结论可提前于读者
      - 每个场景须至少贡献一条真实线索或一条误导
      - 受害者的背景须足够复杂，使多人有动机合理
      - 最后揭示须给出每条线索的解释，不能遗漏
      - 舞台设定须封闭（孤岛、火车、大雪封山），强化嫌疑人范围
    bad_habits:
      - 古典推理结构的公式化有时可预期性过高
      - 社会背景（阶级、种族）的处理有时带有时代局限
      - 心理深度有时让位于推理结构
    ai_blacklist:
      - 真相只有一个
      - 完美的犯罪不存在
      - 侦探一眼看穿
      - 罪犯无处遁形
      - 正义终将来临
      - 法网恢恢
      - 凶手终于暴露
      - 侦探的直觉
      - 罪证确凿
      - 案件告破
      - 善恶终有报
      - 推理无懈可击
    style_anchors:
      fair_play_misdirection: >
        一个场景包含三件事：第一件是真实线索（稍后会被用到），第二件是误导性信息
        （引导读者怀疑错的人），第三件是人物互动（建立动机或否定动机）。三件事须
        在同一场景里自然混合，读者读完这个场景时印象最深的是第三件，而在揭示时
        才意识到第一件的重要性。这是公平游戏的精髓：一切都在那里，但注意力被管理了。

  - id: raymond_chandler
    name: 雷蒙德·钱德勒
    domains: [玄一]
    genres: [硬汉派推理, 黑色小说, 犯罪小说]
    signature_works: [长眠不醒]
    aws_profile: >
      LLM默认写法是城市描写服务于案件调查，主角是专业调查员，对话是信息交换。
      钱德勒的差异在于城市腐败氛围是叙事主角——洛杉矶的阶级分化、权贵的不可触碰、
      好人必败的现实，这些比案件本身更重要。主角（马洛）是道德孤岛，不属于任何阵营，
      其道德感是叙事的唯一锚点。对话是信息披露的主要手段，但对话本身也是性格的展示。
      比喻须新鲜、具体、带侧面的暴力感。
    behavior_constraints:
      - 城市环境须具体且腐败：阶级分化、权力不对称须可感
      - 主角须保持道德立场，但这个立场须让他付出代价
      - 对话须双功能：传递信息同时展示说话人的性格和动机
      - 比喻须新鲜，禁止使用陈旧的比喻，每个比喻须有具体的感官来源
      - 悬念须来自调查的层层推进，不能是突然的信息轰炸
      - 权贵角色须真实危险，不能被主角轻易击败
      - 女性人物须复杂，不能只是诱饵或受害者
      - 结尾须是开放的道德困境，不能是完满的正义
    bad_habits:
      - 女性角色的"蛇蝎美人"定型有时是时代局限
      - 某些比喻的精彩遮盖了情节的松散
      - 主角的道德高地有时显得过于孤傲
    ai_blacklist:
      - 正义得到了伸张
      - 法律的威严
      - 好人终会胜利
      - 罪犯受到了惩罚
      - 城市的黑暗终于被驱散
      - 真相大白于天下
      - 他凭借自己的正义感
      - 邪不压正
      - 善良的力量
      - 正义终将来临
      - 罪恶无法逃脱
      - 道德的胜利
    style_anchors:
      hardboiled_dialogue: >
        两人对话，一方想要信息，另一方不想给。对话须通过间接方式进行——隐喻、
        威胁的暗示、表面礼貌下的对抗。信息最终被给出，但以一种不完整的方式，
        制造下一个追查的方向。对话结束时，读者对两个说话人的性格都有了更深的
        了解，但谜并未解开，只是移动了。每个人物说话的方式须有阶级和背景的
        印记。

  - id: jiubadao
    name: 九把刀
    domains: [玄一]
    genres: [台湾文学, 青春小说, 动作小说]
    signature_works: [那些年我们一起追的女孩, 功夫]
    aws_profile: >
      LLM默认写法是青春故事以甜蜜为主，悬念是爱情走向，叙述者保持文雅。九把刀的
      差异在于青春叙述带有网络文学的语感和俗气的深情——直白的、不怕丢脸的情感表达，
      反而产生真实感。悬念不来自悬疑技巧，而来自真实生活的不可预测（青春期的遗憾、
