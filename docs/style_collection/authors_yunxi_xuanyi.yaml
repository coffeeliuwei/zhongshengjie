    aws_profile: >
      LLM默认写法是谍战叙述节奏快，悬念来自行动，真相在高潮处揭示。麦家的差异在于
      悬念来自天才人物内部——破译密码、预知未来、感知规律的能力本身是谜，而这个谜与
      人物的孤独和精神脆弱共生。信息的加密叙述：叙述者有时隐藏关键信息，但这种隐藏
