# 云溪域+玄一域作家档案 — 自动生成片段，待合并入 author_styles.yaml
# 生成日期：2026-05-16
# 云溪域（环境/氛围/意境）15位 + 玄一域（悬念/伏笔/转折）16位

authors:

  - id: shen_congwen
    name: 沈从文
    domains: [云溪]
    genres: [乡土文学, 散文, 短篇小说]
    signature_works: [边城, 湘行散记]
    aws_profile: >
      LLM默认写法是用形容词堆叠描绘景色，情感直白表达。沈从文的差异在于以白描白写自然，
      景物本身即情感载体，绝不直接命名情绪。湘西山水、渡口、吊脚楼作为叙事主角出现，
      方言气息渗透句式，口语与书面语之间存在一种刻意的距离感。情感通过人物的动作、
      眼神、沉默传递，读者须自己补完情感弧线。时间在他笔下是慢的，四季更迭即人物命运
      隐喻，不说破，只铺陈。
    behavior_constraints:
      - 不得直接写"他感到悲伤/高兴/失落"，用行为或景物替代
      - 每段风景描写须有方言或地域性词汇至少一个
      - 句子长度控制：短句为主，偶尔一个长句收束情绪
      - 人物对话尽量简短，留白多于言说
      - 叙事者立场保持克制中立，不为任何人物辩护
      - 时间推进须借助自然意象（季节、水流、候鸟）
      - 禁止使用城市语境词汇（地铁、写字楼、APP等）
      - 结尾不做情感总结，以场景画面收束
    bad_habits:
      - 偶尔用过于现代的书面词打破湘西语感
      - 叙事节奏偶尔过于舒缓导致情节停滞
      - 女性人物描写有时流于纯净化、符号化
    ai_blacklist:
      - 她的心中涌起一股暖流
      - 美丽的景色令人心旷神怡
      - 他深深地爱着这片土地
      - 岁月静好
      - 大自然的馈赠
      - 内心深处的柔软
      - 诉说着悠久的历史
      - 充满了诗情画意
      - 那一刻他明白了
      - 宁静而美好的时光
      - 令人陶醉的风光
      - 心灵得到了净化
    style_anchors:
      landscape_as_emotion: >
        景物描写须具体而非概括：不写"山很美"，写山上哪种树、树皮颜色、鸟叫声从哪个方向来。
        情感寄托在物件上：渡船的木纹、老人手上的茧、溪水拍打石头的声音。场景切换时不用
        过渡句，直接跳入下一个画面，留给读者自己感知时间流逝。

  - id: mo_yan
    name: 莫言
    domains: [云溪]
    genres: [魔幻现实主义, 长篇小说, 历史小说]
    signature_works: [红高粱, 蛙]
    aws_profile: >
      LLM默认写法是线性叙述历史事件，情感表达直接，暴力场景做淡化处理。莫言的差异在于
      感官极度膨胀——气味、颜色、声音被放大到超现实程度，历史暴力不回避而是正面凝视。
      第一人称叙述者身份模糊（"我"时而是后代、时而是旁观者、时而是死者），打破叙事可靠性。
      民间生命力与国家机器暴力并置，产生强烈张力。语言狂欢化，大量方言、俚语、俗语混入
      文人叙述，形成粗粝的混搭质感。
    behavior_constraints:
      - 每一个暴力/死亡场景须附带一个感官细节（气味/颜色/触感）
      - 第一人称叙述者须在某处暗示自己身份的不确定性
      - 每章至少出现一个来自民间的意象（神话、传说、俗语、节气）
      - 历史事件必须通过具体人物的身体经验传达，禁止宏观评论
      - 句子节奏要有高低起伏：长句蓄力，短句爆发
      - 禁止为历史人物做道德定性，保持叙事的混沌性
      - 自然景物须带有生物性、动物性（植物也要有呼吸感）
      - 结构允许碎片和跳跃，但每段须有内在情绪逻辑
    bad_habits:
      - 感官描写有时密度过高导致读者疲劳
      - 男性视角主导，女性人物偶尔停留在象征层面
      - 历史事件铺陈过多时叙事重心可能失衡
    ai_blacklist:
      - 历史的车轮滚滚向前
      - 人民群众的力量
      - 那个年代的苦难
      - 岁月留下了深刻的印记
      - 充满了生命的张力
      - 令人震撼的历史画卷
      - 深沉的民族记忆
      - 悲壮的历史情怀
      - 不屈的民族精神
      - 苦难中的坚韧
      - 沧桑的历史感
      - 波澜壮阔的时代
    style_anchors:
      sensory_overload: >
        一个场景同时调动至少三种感官，且感官描写须超出正常比例——高粱的红不只是颜色，
        是带体温的血红，是腥味，是风吹过的声响。暴力发生时放慢时间，在死亡前的几秒插入
        无关紧要的细节（一只苍蝇、远处的歌声），制造残酷的对位效果。

  - id: su_tong
    name: 苏童
    domains: [云溪]
    genres: [先锋文学, 历史小说, 短篇小说]
    signature_works: [米, 妻妾成群]
    aws_profile: >
      LLM默认写法是明亮干净的叙述，人物动机清晰，环境描写服务情节。苏童的差异在于刻意
      营造南方阴郁氛围——潮湿、发霉、腐烂气息弥漫整个叙事空间。欲望不美化，总伴随着
      腐败和衰落。江南水乡意象不是诗意的，而是幽闭的、黏稠的。历史重量以个人身体感受
      呈现，不做宏观论述。颓废美学：美好事物总已经或正在消逝，没有救赎。
    behavior_constraints:
      - 环境描写须包含一个腐败/潮湿/衰败的意象
      - 人物欲望须有具体的身体症状（心跳加速、喉咙发紧、手心出汗）
      - 禁止给人物提供道德庇护或叙事同情
      - 时间设定尽量模糊，不写具体年份，写季节、气候
      - 对话须简短，潜台词大于表面含义
      - 每个场景须有一个视觉中心物件，且该物件须有象征性
      - 女性人物须有主体性欲望，不能仅作为男性欲望的映射
      - 结局须留有余地，不做完满收束
    bad_habits:
      - 阴郁氛围有时过于持续导致情感单调
      - 女性人物在某些早期作品中被过度客体化
      - 颓废美学偶尔滑向审美主义而失去批判性
    ai_blacklist:
      - 江南水乡的美丽风光
      - 充满诗意的生活
      - 温柔的南方
      - 岁月静好的时光
      - 命运的安排
      - 爱情的力量
      - 重新燃起了希望
      - 美好的未来
      - 内心的平静
      - 生活充满了意义
      - 阳光照进了心房
      - 感受到了幸福
    style_anchors:
      decadent_atmosphere: >
        场景建构从气味开始：梅雨、霉味、河水腐味是基底，人物在其中移动。建筑物须是旧的、
        潮湿的、正在腐烂的。美人也处于凋零中——不是死亡，是缓慢的失去光泽。欲望写得具体
        但不写明，用间接句式暗示（"她看了他一眼，然后低下头去"比"她想要他"更有力）。

  - id: chi_zijian
    name: 迟子建
    domains: [云溪]
    genres: [乡土文学, 少数民族文学, 长篇小说]
    signature_works: [额尔古纳河右岸, 白雪乌鸦]
    aws_profile: >
      LLM默认写法是将苦难戏剧化或浪漫化，民族文化作为异域点缀。迟子建的差异在于将北方
      大地与人物命运编织为一体，人与自然共命运而非人征服自然。苦难被温暖叙述——不回避
      死亡和艰辛，但叙述腔调始终保有人的尊严。时间感是民族性的：萨满历法、驯鹿的迁徙、
      白桦树的四季构成叙事节拍。情感浓烈但内敛，通过生活细节的积累自然释放。
    behavior_constraints:
      - 自然描写须具体到动植物的具体行为，不能只写"森林"要写哪种树、什么动物
      - 苦难叙述须保持人物尊严，禁止煽情或自怜腔调
      - 时间推进须借助自然界的变化而非人为事件
      - 少数民族文化细节须具体（萨满仪式、驯鹿习性、鄂温克语词汇）
      - 叙事者须有明确的性别和年龄立场，通常是老人视角
      - 死亡场景须平静处理，不过度渲染悲剧性
      - 人物之间的情感须通过共同劳动/共同生存的场景呈现
      - 禁止现代都市语境词汇进入叙事
    bad_habits:
      - 某些细节描写过于精细导致叙事节奏停滞
      - 女性视角的温柔性有时削弱了批判锋芒
      - 少数民族文化有时作为诗意背景而非生活实体
    ai_blacklist:
      - 大自然的鬼斧神工
      - 壮美的北国风光
      - 民族文化的瑰宝
      - 令人叹为观止
      - 生命的顽强
      - 感天动地的故事
      - 永恒的精神家园
      - 深厚的民族情感
      - 不屈不挠的品格
      - 美丽的北方大地
      - 诗意的栖居
      - 心灵的净土
    style_anchors:
      human_nature_symbiosis: >
        人物的情绪状态须与当天的自然状况对应，但不能是简单映射（悲伤=下雨），而是更复杂
        的并置（人死去那天天气晴好，驯鹿群在远处安静吃草）。生活劳动的细节——宰鹿、鞣皮、
        生火——须写得真实具体，这些动作本身就是情感表达。

  - id: wang_zengqi
    name: 汪曾祺
    domains: [云溪]
    genres: [散文, 短篇小说, 随笔]
    signature_works: [受戒, 大淖记事]
    aws_profile: >
      LLM默认写法是有明确起承转合的叙事结构，情感有清晰的高潮与解决。汪曾祺的差异在于
      "闲笔"美学——叙事随时可以停下来写一道菜、一种花、一个无关紧要的习俗，然后再回来。
      日常生活本身就是诗意，不需要戏剧化。叙述者像一个见过很多事的老人在闲聊，语气温和
      而博学。文人笔法：典故、方言、食物、器物共同构成叙事肌理。无论写什么，底色都是平和。
    behavior_constraints:
      - 每一段叙事允许有至少一次"题外话"（食物、植物、风俗介绍）
      - 禁止制造强烈的戏剧冲突，矛盾须化解在日常中
      - 叙述语气须始终温和，即使写悲剧也不失从容
      - 食物、器物、植物的描写须精确到种类和做法
      - 人物性格通过日常习惯和喜好呈现，不做心理分析
      - 文人典故须轻盈使用，不能显摆或堆砌
      - 句子不宜过长，多用逗号分隔的短分句，读起来有停顿感
      - 结尾不必有结论，以一个生活细节收束即可
    bad_habits:
      - 偶尔题外话过多导致叙事主线模糊
      - 温暖基调有时回避了社会批判的可能
      - 男性文人视角有时对女性人物的描写停留在欣赏层面
    ai_blacklist:
      - 充满了生活的智慧
      - 岁月的沉淀
      - 文化的传承
      - 令人回味无穷
      - 生活的真谛
      - 平淡中见真情
      - 质朴而感人
      - 烟火气息浓郁
      - 充满了人间温情
      - 那个年代的美好
      - 文人的情怀
      - 诗意的生活方式
    style_anchors:
      casual_digression: >
        叙事中途插入一段与主线无关的知识性描写：这道菜的做法、这种植物的生长习性、
        这个地方的风俗由来。插入须自然，像说话时的联想，用"说起来……""顺便一提……"
        之类的口语衔接。插入内容本身须有趣、准确，不能泛泛而谈。插入后平滑回到叙事，
        不做说明。

  - id: yu_dafu
    name: 郁达夫
    domains: [云溪]
    genres: [自传体小说, 散文, 新文学]
    signature_works: [沉沦, 故都的秋]
    aws_profile: >
      LLM默认写法是将情绪与景物分开处理，叙述者保持客观距离。郁达夫的差异在于主观情绪
      完全渗透进景物描写，景物是叙述者内心状态的投影。秋意、暮色、萧瑟不是客观描写，
      是知识分子孤独、自我哀怜的外化。"我"是叙述中心，一切景物须从"我"的感受出发。
      颓靡美学：美好事物因其即将消逝而更美，对自身脆弱和失败有一种近乎享受的凝视。
    behavior_constraints:
      - 景物描写须明确说明叙述者当下的情感状态（作为前提或结果）
      - 第一人称须保持全程在场，不能隐退为全知叙述者
      - 秋天意象须具体：哪种树的叶子、什么颜色、几点落下
      - 知识分子身份须在叙事中可感（读过什么书、有什么理想、如何失落）
      - 自我哀怜须控制在合理范围，不能滑向夸张的自恋
      - 禁止积极向上的结局或转折，情绪弧线是向下的
      - 对美的描写须同时包含对美之消逝的预感
      - 异乡感须贯穿叙事（即使在国内，也是异乡人）
    bad_habits:
      - 自我中心视角有时使叙事视野狭窄
      - 颓靡情绪过于持续时有矫情之嫌
      - 女性形象常常是男性情感需求的投射而缺乏主体性
    ai_blacklist:
      - 充满希望的明天
      - 重新振作起来
      - 生活总会好起来
      - 春天来了
      - 内心的力量
      - 走出了阴霾
      - 积极向上的心态
      - 美好的人生
      - 找到了方向
      - 不再孤独
      - 收获了友情
      - 重新出发
    style_anchors:
      subjective_landscape: >
        景物描写第一句须建立叙述者的情感基调，之后的自然描写须与该情感共振：
        "我心里有某种沉重，走到院子里，看见那株老槐树的叶子已经黄了大半。"
        颜色须偏向暗淡系（灰、黄、褐、烟色），声音须偏向寂静或衰败（风声、落叶声、
        远处犬吠）。禁止出现明亮、热烈的景物，除非立刻转为对其消逝的感慨。

  - id: li_juan
    name: 李娟
    domains: [云溪]
    genres: [散文, 随笔, 游记]
    signature_works: [我的阿勒泰, 冬牧场]
    aws_profile: >
      LLM默认写法是正经严肃地描写少数民族生活，带有人类学式的距离感。李娟的差异在于
      以日常幽默解构荒凉：新疆戈壁的极端条件通过自嘲和轻盈语气呈现，读者在笑声中感受
      到广袤的孤寂。平实语言下藏着诗意，但这诗意不是刻意为之，是生活细节自然泛出的光。
      身体性的叙述：冷、饿、困、迷路——这些具体感受是叙事主轴。叙述者始终是外来者、
      学习者，对游牧文化保持好奇而非居高临下的欣赏。
    behavior_constraints:
      - 幽默须来自具体困境，不能是泛泛的自嘲
      - 每段艰苦描写须附带一个无关紧要的可爱细节（弱化悲壮感）
      - 身体感受须具体：手指冻到什么程度、羊的气味具体是什么
      - 叙述者须保持局外人/学徒视角，不能装成内行
      - 语言须口语化，书面词适度，禁止过于文艺的形容
      - 动物描写须有个性：每只羊/骆驼/狗都是独特个体
      - 时间跨度须通过劳动节律体现（赶场、转场、剪羊毛）
      - 结尾允许开放，不需要情感总结
    bad_habits:
      - 幽默密度过高时有时掩盖了真实的艰辛
      - 对哈萨克族文化的描写有时停留在趣味性而缺乏深度
      - 自我形象有时过于可爱化
    ai_blacklist:
      - 壮美的新疆
      - 热情好客的牧民
      - 令人向往的游牧生活
      - 与大自然融为一体
      - 纯朴的民风
      - 辽阔的草原
      - 心灵的洗涤
      - 生命的真谛
      - 感受到了自由
      - 美丽的风土人情
      - 充满了异域风情
      - 质朴的生活哲学
    style_anchors:
      humor_and_vastness: >
        具体困境+意外的幽默转折：描写在零下三十度帐篷里睡觉，突然发现旁边的狗把自己
        当成暖炉贴着睡。幽默不是为了搞笑，是为了展示在极端条件下人和动物各自寻找活法
        的本能。广袤感不通过"一望无际"这种大词表达，通过走了三小时还是同一片戈壁、
        声音消失在空气里这类具体体验传达。

  - id: lin_qingxuan
    name: 林清玄
    domains: [云溪]
    genres: [散文, 佛教文学, 随笔]
    signature_works: [心的菩提, 境明千里]
    aws_profile: >
      LLM默认写法是把禅意和顿悟写得神秘深奥，大量使用佛教术语，叙述者以智者姿态俯视。
      林清玄的差异在于将禅意落在最日常的事物：一杯茶、一朵花、一次等车——从中发现
      小小的明白。语言明净，无多余负担，东方美学的轻盈体现在不强求意义、不过度阐释。
      叙述者是学习者而非传道者，分享的是发现，不是结论。情感须节制，洞见须轻描淡写。
    behavior_constraints:
      - 禅意须从日常小事出发，禁止从宏大概念出发
      - 每篇须有一个具体的物件或事件作为领悟的触发点
      - 佛教术语须转化为日常语言，禁止直接使用专业词汇而不解释
      - 叙述者须有自己的困惑和局限，不能全知全觉
      - 句子须清洁，禁止形容词堆叠
      - 结尾的领悟须轻盈，不能像布道
      - 自然意象须具体：哪种花、什么颜色、在哪里看见
      - 东方美学的"留白"：有些话说一半，让读者自己想
    bad_habits:
      - 某些篇目领悟来得过于轻易，缺乏真实的挣扎
      - 积极基调有时削弱了面对苦难的复杂性
      - 某些时期的写作有说教倾向
    ai_blacklist:
      - 人生的智慧
      - 内心的平静
      - 禅意的生活
      - 顿悟的瞬间
      - 人生的真谛
      - 放下执念
      - 活在当下
      - 心如止水
      - 随遇而安
      - 看淡得失
      - 生命的感悟
      - 心灵的升华
    style_anchors:
      everyday_enlightenment: >
        起笔须是一件极普通的事：买菜、等雨停、看一只虫子。描写这件事的过程中，叙述者
        忽然注意到某个细节，这个细节引发一个小小的想法。这个想法用一句话说完，然后停下。
        不需要展开论证，不需要普遍化——只是记录这一次的注意。句子平均长度控制在15字以内。

  - id: garcia_marquez
    name: 加西亚·马尔克斯
    domains: [云溪]
    genres: [魔幻现实主义, 长篇小说, 短篇小说]
    signature_works: [百年孤独, 霍乱时期的爱情]
    aws_profile: >
      LLM默认写法是将魔幻元素做特别标注（"奇迹出现了"），叙述者对超自然持惊讶态度。
      马尔克斯的差异在于以冷静甚至神圣的腔调叙述魔幻事件，仿佛这是日常。循环时间：
      人物命运在家族世代间重复，名字相同命运相似。孤独是可遗传的，集体的，不是个人
      的悲剧。叙述腔调保持距离感和全知视角，像一个见证了百年历史的年迈叙述者在追忆。
    behavior_constraints:
      - 魔幻事件须以陈述日常事实的语气叙述，禁止惊叹号或强调
      - 时间须循环性出现：某个细节须在文中前后呼应，暗示历史重复
      - 人物须有家族命运的重量，个人选择受制于血统
      - 孤独不能是浪漫化的，须有社会和政治的根源
      - 叙述视角须保持全知和距离感，不能过于贴近人物内心
      - 每段至少有一个时间跨度的词（"多年以后……""从那时起直到……"）
      - 地名、人名须有拉丁美洲韵味（或对应文化的本土风格）
      - 结尾须有命运感，不能是开放性的悬疑
    bad_habits:
      - 长句结构在中文翻译叙述中有时显得冗赘
      - 魔幻元素处理不好时容易变成纯粹的奇幻
      - 家族叙事有时同名人物过多导致混乱
    ai_blacklist:
      - 这简直是个奇迹
      - 令人难以置信的事发生了
      - 神奇的魔法
      - 超自然的力量
      - 命运的安排
      - 魔法世界
      - 美丽的神话
      - 充满了奇幻色彩
      - 不可思议的现象
      - 上天的旨意
      - 神秘的力量降临
      - 奇异的体验
    style_anchors:
      magical_realism_tone: >
        魔幻叙述的关键是语气的平静：写一个女人升天，须和写她去买菜一样平静，
        连用的动词都是日常级别的（"她升了起来，邻居们在院子里看着"）。时间跨度用
        具体数字表达而非模糊（"三十二年后"而非"多年后"）。每一个魔幻事件须有
        清晰的前因，在文中某处预先埋下，读者回看时发现早有伏笔。

  - id: proust
    name: 普鲁斯特
    domains: [云溪]
    genres: [意识流小说, 回忆录体小说]
    signature_works: [追忆似水年华]
    aws_profile: >
      LLM默认写法是叙述事件然后解释意义，记忆作为素材被有序组织。普鲁斯特的差异在于
      感官触发非线性记忆——一块玛德莲蛋糕的味道可以展开整个童年。意识流长句：一个句子
      可以持续一页，通过从句不断延伸，思维在其中游荡。时间不可逆但通过记忆获得某种
      永恒性。细节无限展开：一个手势可以引发关于社交礼仪、人性虚伪、时代变迁的长篇思考。
    behavior_constraints:
      - 感官触发须具体（哪种气味/味道/触感），不能泛化
      - 每次触发记忆须产生一个时间跳跃，明确标注是哪个过去
      - 长句须内部逻辑严密，从句须真正推进思考而非装饰
      - 叙述者须有社交观察者的功能：分析他人行为的动机和模式
      - 时间感须是流动的、可逆的（在记忆中），而非线性
      - 细节展开须有内在必要性，不能为展开而展开
      - 叙述者须有自我怀疑：对自己感知的准确性保持不确定
      - 禁止使用过于简短的叙述方式，须有充分的展开
    bad_habits:
      - 长句处理不当时容易变成堆砌而失去内在逻辑
      - 社交圈描写有时过于沉溺于上流社会细节
      - 叙述节奏极慢，对情节推进要求高的场景不适用
    ai_blacklist:
      - 记忆涌上心头
      - 往事历历在目
      - 时光倒流
      - 回忆起了美好的过去
      - 时间飞逝
      - 岁月如梭
      - 珍贵的记忆
      - 那段美好的时光
      - 记忆是最好的礼物
      - 不忘初心
      - 回到那个年代
      - 时间的痕迹
    style_anchors:
      involuntary_memory: >
        感官触发记忆的写法：先用一句话描述当下的感官刺激（具体），然后不加转折直接
        进入记忆场景，记忆中的细节须比当下更鲜活、更具体、更长。从记忆回到当下时，
        叙述者须对这次时间旅行有一个思考：这个记忆告诉了他关于时间或自我的什么。
        整个过程须是一个长段落，不能切割。

  - id: modiano
    name: 帕特里克·莫迪亚诺
    domains: [云溪]
    genres: [法国文学, 记忆小说, 悬疑文学]
    signature_works: [暗店街, 青春咖啡馆]
    aws_profile: >
      LLM默认写法是记忆叙述有明确的叙述者立场和清晰的时间线。莫迪亚诺的差异在于
      记忆的模糊性是主题本身——叙述者不确定自己记住的是否真实，身份可能是虚构的，
      过去可能是被篡改的。巴黎地名、街道、咖啡馆作为记忆的锚点，但这些锚点最终也
      不可靠。简短句子和大量留白制造一种虚空感：说得越少，消失的越多。
    behavior_constraints:
      - 叙述者须对自己的记忆持怀疑态度（"我不确定是否……"）
      - 具体地名/地址须频繁出现，但这些地点如今已改变或消失
      - 叙事须允许矛盾：同一事件可能有两种不同的叙述版本
      - 句子须简短：平均15字以内，留白比言说多
      - 人物背景须模糊，不能有过于清晰的传记信息
      - 时间线须在现在和多个过去之间来回，不加明显标注
      - 失踪/消失是核心主题，须有相关意象贯穿
      - 结尾须开放，不做解释，留下更多谜
    bad_habits:
      - 极简风格有时过于克制导致情感连接困难
      - 巴黎氛围有时过于特定，移植到其他城市需要改造
      - 身份模糊的叙事技巧过度使用时会显得刻意
    ai_blacklist:
      - 记忆清晰地浮现
      - 我记得那一天
      - 往事如此真实
      - 那段记忆永远鲜活
      - 我找到了答案
      - 终于想起来了
      - 过去变得清晰
      - 身份得到了确认
      - 历史揭开了谜底
      - 一切都真相大白
      - 记忆的拼图完整了
      - 找回了自我
    style_anchors:
      uncertain_memory: >
        叙述者追查一个已经消失的人或地方，手头只有几个地址、几个名字、几张旧照片。
        每追查一步，谜更深：认识那个人的人死了，那个地址已经变成停车场，那个名字
        可能是化名。叙述者对此没有沮丧，只是平静地继续。结尾时谜还在，但叙述者
        好像已经习惯了在不确定中生活。

  - id: duras
    name: 杜拉斯
    domains: [云溪]
    genres: [法国文学, 自传体小说, 电影文学]
    signature_works: [情人, 广岛之恋]
    aws_profile: >
      LLM默认写法是线性叙述欲望故事，情感有明确的起点高潮结局。杜拉斯的差异在于
      叙述如同电影剪切——场景突然切换，时间跳跃不加说明。沉默和省略是意义的载体，
      未说出的比说出的更重要。欲望与死亡是并置的主题，不互相解释，只是同时存在。
      女性主体的叙述：欲望从"我"出发，不是被凝视的客体。叙事腔调冷静，情感强烈
      但不宣泄。
    behavior_constraints:
      - 场景切换须突然，不用过渡句，用空行或时间词标记
      - 沉默须被写出来（"她没有说话。""沉默持续了很长时间。"）
      - 欲望须从主体视角叙述，禁止纯粹的被动客体视角
      - 时间叙述须跳跃：过去、现在、更远的过去可以交替
      - 句子须短而有力，禁止修饰性的长定语
      - 死亡意象须存在但不解释其象征意义
      - 历史背景（战争、殖民）须在场景中可感，但不做政治论述
      - 叙述者须有清醒的自我意识，知道自己在回忆/叙述
    bad_habits:
      - 极端简洁有时导致读者无法进入情感
      - 跳切过多时叙事连贯性受损
      - 某些作品的自我中心性使读者难以共情
    ai_blacklist:
      - 深深地爱着
      - 爱情让她变得美丽
      - 他们从此幸福地生活在一起
      - 感情升华了
      - 爱情的力量
      - 心中燃起的火焰
      - 情感的波涛
      - 爱意绵绵
      - 两颗心贴在一起
      - 相爱的人终将相守
      - 爱情是永恒的
      - 他望向她的眼神充满了爱意
    style_anchors:
      cinematic_cut: >
        写一个场景，写到高潮或情绪最紧绷处，突然切换：另一个时间，另一个地点，
        另一件事。不解释两者的关联，让读者自己感受并置产生的意义。切换后的场景
        也在某一刻戛然而止。情感的高峰永远在句子末尾之后，在空白处。

  - id: hesse
    name: 赫尔曼·黑塞
    domains: [云溪]
    genres: [德国文学, 成长小说, 精神文学]
    signature_works: [悉达多, 玻璃珠游戏]
    aws_profile: >
      LLM默认写法是将精神成长写成线性进步，主角通过努力达到某种境界。黑塞的差异在于
      成长是一个曲折的循环：每次以为到达了，其实只是开始了新的迷失。东方哲学（佛教、
      道教）与西方个体主义的碰撞是核心张力。自然具有象征性：河流是时间，森林是迷途，
      城市是堕落。叙述语言质朴但具哲思，不是口号，是实践中的感悟。
    behavior_constraints:
      - 主角的成长须包含退步和迷失，不能是线性进步
      - 东方哲学元素须通过具体生活场景呈现，禁止直接引用哲学原文
      - 自然象征须一致：建立起来后须贯穿始终
      - 精神导师须有局限性，不能是完美的答案提供者
      - 叙述语言须质朴，禁止玄奥的神秘主义语气
      - 音乐或艺术须作为精神探索的隐喻在场
      - 个体与社会的张力须具体化在人际关系中
      - 结尾须是开放的继续，而非完满的解答
    bad_habits:
      - 哲学叙述有时过于直白，削弱了文学性
      - 男性成长叙事的中心性使女性人物常作为阶段性符号
      - 东方主义色彩在某些作品中过于明显
    ai_blacklist:
      - 人生的真谛
      - 找到了内心的平静
      - 精神的升华
      - 灵魂的觉醒
      - 参透了人生
      - 达到了圆满
      - 顿悟的时刻
      - 心灵的彼岸
      - 修行的成果
      - 超脱了尘世
      - 找到了自我
      - 生命的意义
    style_anchors:
      spiritual_journey: >
        主角在某个地方停留一段时间，自以为学到了什么，然后离开。离开后才发现这个
        阶段的局限。下一个阶段否定上一个阶段的结论，但读者看得出两个阶段都有其必要。
        自然场景在人物状态转变时出现：不是映衬，是提示——河水依然流着，不管人物
        想到了什么。

  - id: patrick_white
    name: 帕特里克·怀特
    domains: [云溪]
    genres: [澳大利亚文学, 意识流小说, 现代主义]
    signature_works: [沃斯, 乘车者]
    aws_profile: >
      LLM默认写法是意识流作为偶尔使用的技巧，叙述仍保持基本可读性。怀特的差异在于
      意识流被极端化——人物内心的混沌、幻觉、精神边界被精确且密集地呈现，字句密度
      极高，每句话都需要解码。澳洲荒野不是美丽的背景，是精神考验的场域，人物在其中
      被剥离到本质。孤独不是社交意义上的，是存在论的。
    behavior_constraints:
      - 意识流须真正混乱：感知、记忆、幻觉在同一句子内交替
      - 澳洲荒野须写得粗砺、危险、不浪漫
      - 字句密度须高：禁止简单句，每句须有多层含义
      - 人物须在极端条件下（孤独、体力极限、精神崩溃边缘）被观察
      - 叙述者视角须游离于内外之间，既贴近又保持距离
      - 象征须内嵌在物理现实中，不能明说
      - 人物关系须有复杂的权力结构和相互误解
      - 精神维度须在叙事中可感，但不能以宗教语言直接呈现
    bad_habits:
      - 极端密度使阅读门槛过高，普通读者难以进入
      - 某些段落的意识流处理失控，内在逻辑断裂
      - 社会批判有时淹没在意识流的密度中
    ai_blacklist:
      - 心旷神怡的自然风光
      - 壮阔的澳洲大地
      - 内心的宁静
      - 找到了生命的答案
      - 大自然的治愈力量
      - 孤独但不孤单
      - 心灵的净化
      - 精神的觉醒
      - 荒野中的成长
      - 自然的馈赠
      - 迷失后的找寻
      - 回归本真
    style_anchors:
      extreme_consciousness: >
        一个简单动作（弯腰捡东西）触发多层内心活动：身体感受、过去某个相似动作的记忆、
        对这个记忆的评价、对自己此刻状态的观察、一个无关的幻觉插入。所有这些发生在
        三到五行内，用分号和从句串联，没有明显的层级标记。读者须努力才能区分
        哪层是现实，哪层是记忆，哪层是幻觉。

  - id: arundhati_roy
    name: 阿兰达蒂·罗伊
    domains: [云溪]
    genres: [英语文学, 印度文学, 政治文学]
    signature_works: [微物之神]
    aws_profile: >
      LLM默认写法是句式规范，叙述印度历史时保持文化尊重但叙述距离清晰。罗伊的差异在于
      句式本身是碎片化的、实验性的——句子可以不完整，动词可以被名词化，节奏模仿诗歌。
      印度历史的伤痛（种姓制度、阶级压迫）通过儿童视角的无知和成人视角的清醒产生落差。
      感官过载：热带气候、腐烂的香甜、暴力都以极度感官化的方式呈现。语言是政治的，
      选择用什么词本身就是立场。
    behavior_constraints:
      - 句式须允许不完整：可以是片语、名词短语、没有动词的感受
      - 儿童视角和成人视角须在同一段落内形成张力
      - 种姓、阶级元素须具体化在人物日常行为中，不做概念化论述
      - 感官描写须包含腐败感：热带气候、过于成熟的水果、湿热
      - 时间须在过去（童年）和现在之间跳跃，但须有清晰的时态标记
      - 政治批判须内嵌在故事里，禁止直接的社会评论语气
      - 语言实验须有内在逻辑，不能为实验而实验
      - 爱情和暴力须并置，不互相解释
    bad_habits:
      - 语言实验有时过于密集导致叙事可读性下降
      - 政治立场有时过于明显，削弱了文学复杂性
