        句式从正常开始，逐渐碎裂：一个完整句子后面跟一个名词短语。然后是一个动词。
        再是一个感官印象（气味、颜色），没有主语。节奏在这种碎裂中加速，然后用一个
        完整的长句突然减速。读者的呼吸被句式控制。这种技巧在情绪高点使用最有效：
        恐惧、狂喜、暴力来临的瞬间。

  - id: aiz潜水_wuzei
