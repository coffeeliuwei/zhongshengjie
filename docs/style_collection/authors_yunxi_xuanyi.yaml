      - 孤独须是天才的代价，须在具体场景中体现
      - 谍战背景须真实：历史时期、机构运作须有可信度
      - 悬念须在两个层面同时运作：外部（任务）和内部（人物心理）
      - 精神脆弱须与能力的强大同步描写，形成张力
      - 结局的真相可以延迟到极限，但须有令人信服的解释
      - 叙述者的可靠性须有质疑空间
    bad_habits:
