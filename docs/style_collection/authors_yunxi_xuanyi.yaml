      - 穿越者的"现代思维"须与古代价值体系产生真实冲突
      - 悬念须来自主角无法使用信息优势的场景
      - 历史细节须准确，不能仅作为背景装饰
      - 政治陷阱须通过对话和行动来设置，不能仅靠内心独白
      - 主角须有被历史"同化"的风险，这是更深层的悬念
