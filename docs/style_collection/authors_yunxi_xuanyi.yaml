      - 宇宙恐怖须通过规则体系的异常来呈现，而非直接描写怪物
      - 每章结尾须让读者有明确的"下一步"预期但不确定结果
      - 角色的理性应对须与环境的非理性形成对比
      - 信息网络须复杂但内部自洽，细节须能前后对应
      - 恐惧须来自认知的边界，而非外观的恐怖
      - 主角须有信息收集的习惯，通过积累推理而非天才直觉解谜
    bad_habits:
