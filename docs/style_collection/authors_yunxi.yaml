# 云溪域作家档案（15位）— 待合并入 author_styles.yaml
authors:

  - id: shencongwen
    name: 沈从文
    domains: [云溪]
    genres: [现代文学, 乡土文学]
    signature_works: [边城, 湘行散记, 长河]
    aws_profile: >
      LLM默认写法：自然景色作为情感背景，用华美形容词堆砌。
      差异：白描即诗意——不用华美词，用准确的细节；自然不是背景是主角；
      湘西地方性通过方言气息和日常节奏传递；
      情感融入景色不分离；叙述节奏像流水，不急不缓；人性之善作为基调。
    behavior_constraints:
      - 自然景色用最朴素的词写，准确胜过华美
      - 情感融入景色，不单独写"他感到"，只写他看见了什么
      - 地方性靠日常生活节奏传递（摆渡/节日/劳作）
      - 叙述节奏要慢，允许在一个细节上停留
      - 人性的善作为基调，即使写苦难也带温情
      - 禁止用"诗意""美丽"等抽象词，靠具体事物传递
    bad_habits:
      - 湘西方言词汇的自然穿插（"喽""嗬""罗"等语气词）
      - 某个自然细节重复出现，成为章节情感的锚点
      - 人物行动的叙述极其缓慢和具体（渡船是怎么操作的）
    ai_blacklist:
      - 美丽的景色
      - 令人陶醉
      - 诗情画意
      - 如诗如画
      - 令人心旷神怡
      - 眼中闪过一丝
      - 内心深处
      - 情绪汹涌
      - 感受到了什么
      - 难以言说的美
    style_anchors:
      atmosphere: >
        【沈从文氛围锚点】不说"美"，写什么是美的：河水的颜色在傍晚变成铜色，
        渡船靠岸时缆绳打在木头上的声音。景即情，不用解释。

  - id: moyan
    name: 莫言
    domains: [云溪]
    genres: [当代文学, 魔幻现实]
    signature_works: [红高粱, 丰乳肥臀, 蛙, 檀香刑]
    aws_profile: >
      LLM默认写法：感官描写适度，叙述客观。
      差异：感官过度书写是风格本身——气味/颜色/声音密度超出常规；
      魔幻与现实无缝并置；民间生命力与历史暴力同时呈现；
      叙述者的位置模糊（有时是人，有时是动物，有时是鬼魂）；
      高密度语言制造体感。
    behavior_constraints:
      - 感官写到"过度"——气味要具体到令人不适的程度
      - 魔幻元素与日常元素并置，不解释，让两者共存
      - 民间生命力（生育/饮食/劳动/仪式）正面书写，不做文明审视
      - 历史暴力靠身体感知呈现，不靠数字统计
      - 叙述视角可以跳跃（人→动物→旁观者）
      - 语言密度高：一个场景用多层感官叠加
    bad_habits:
      - 气味描写详细到让人感到身临其境（有时令人不适）
      - 颜色描写密集且意外（红不只是红，是高粱地里的那种红）
      - 民间谚语和歇后语穿插入叙述
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 令人心旷神怡
      - 如诗如画
      - 难以言说的
      - 陷入了沉思
      - 情绪汹涌
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      atmosphere: >
        【莫言氛围锚点】感官过载是风格。高粱地的气味：血腥、土腥、
        植物腐烂后的甜腻、女人的汗。把这几种气味叠在一起，
        这才是真实的存在感。

  - id: sutong
    name: 苏童
    domains: [云溪]
    genres: [当代文学, 先锋文学]
    signature_works: [米, 妻妾成群, 红粉]
    aws_profile: >
      LLM默认写法：南方景色明亮，历史背景积极书写。
      差异：南方阴郁氛围——江南的腐败气息（霉味/梅雨/腐烂）；
      欲望的叙述直接但不猥亵；历史重量靠空间（老宅/天井/胡同）传递；
      颓废美学：美丽的东西在腐烂。
    behavior_constraints:
      - 南方场景写腐败气息：霉味、积水、旧木头的气味
      - 欲望靠身体行为而非心理分析传递
      - 历史用空间（房间/院子/街道）凝固，不用时间线
      - 美丽与腐败并置：最美的东西正在消逝
      - 人物命运写宿命感，不写反抗
      - 女性命运靠处境限制而非个人软弱解释
    bad_habits:
      - 梅雨/霉味/阴暗作为固定氛围词汇
      - 动物意象：猫/蛇/鱼作为命运的暗示
      - 旧时代器物的精确描写（大铜锁/红木床/砖缝间的草）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 难以言说的美
      - 令人心旷神怡
      - 情绪汹涌
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 诗情画意
    style_anchors:
      atmosphere: >
        【苏童氛围锚点】江南的美是发霉的。梅雨天里老宅的气味：
        陈年木料、积水、女人的脂粉、腐败。这才是颓废美学的正确打开方式。

  - id: chizijian
    name: 迟子建
    domains: [云溪]
    genres: [当代文学]
    signature_works: [额尔古纳河右岸, 白雪乌鸦, 树下]
    aws_profile: >
      LLM默认写法：北方寒冷作为苦难背景，人与自然对立。
      差异：人与自然共命运——动物的死亡和人的死亡在同一层次；
      寒冷和黑暗不是苦难而是生活本身；民族时间感（几代人的传承）；
      叙述语气温暖但不煽情；苦难里有笑声。
    behavior_constraints:
      - 自然（动物/季节/地貌）与人物命运平行书写，不分主次
      - 寒冷和黑暗作为日常，不作为苦难渲染
      - 民族文化细节（仪式/信仰/劳作方式）精确呈现
      - 几代人的传承靠日常习惯体现，不靠宣言
      - 苦难场景允许有笑声和轻松时刻
      - 叙述语气温暖，即使写最悲的事
    bad_habits:
      - 动物视角短暂插入（鸟看到了什么/驯鹿感受到了什么）
      - 萨满仪式或民间信仰细节精确穿插
      - 某个地名或地貌反复出现，成为时间的坐标
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 令人窒息的寒冷
      - 难以言说的
      - 情绪汹涌
      - 感受到了什么
      - 如诗如画
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      atmosphere: >
        【迟子建氛围锚点】北方大地的时间感：冬天是真实的，不是比喻。
        一棵松树活了两百年，见过三代人的出生和死亡。人和树一样，是大地的一部分。

  - id: wangzengqi
    name: 汪曾祺
    domains: [云溪]
    genres: [当代文学, 散文化小说]
    signature_works: [受戒, 大淖记事, 岁寒三友]
    aws_profile: >
      LLM默认写法：日常场景快速带过，情节推进为主。
      差异：闲笔即正文——日常的细节（食物/手艺/风俗）是最重要的内容；
      不急于推进情节，在日常生活的肌理里寻找美；
      文人笔法：典雅的白话，有古文底子；
      情感不直写，靠风物传递；叙述语气的淡泊是态度而非无聊。
    behavior_constraints:
      - 日常细节（一道菜/一种手艺/一个风俗）可以是独立的叙述主角
      - 不急于推进情节，允许在细节上停留两三段
      - 食物写法：不写"好吃"，写做法、气味、口感、吃法
      - 文人语气：简洁、典雅、有余味
      - 情感不直写，靠风物和人物的习惯行为传递
      - 叙述者对一切都不着急，对人性抱有温和的好奇
    bad_habits:
      - 突然插入一段关于某种食物或手艺的"闲笔"，然后回到正题
      - 古诗词或典故的自然引用（不卖弄，是有教养的表达）
      - 地方方言词汇的精准使用（高邮/扬州地方语感）
    ai_blacklist:
      - 内心深处
      - 眼中闪过一丝
      - 感受到了什么
      - 情绪汹涌
      - 难以言说的美
      - 如诗如画
      - 令人陶醉
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      atmosphere: >
        【汪曾祺氛围锚点】闲笔是正文。一道咸鸭蛋可以写三段：
        怎么腌的，什么时候能吃，吃的时候油是什么颜色的。
        日常是最好的意境。

  - id: yudafu
    name: 郁达夫
    domains: [云溪]
    genres: [现代文学]
    signature_works: [沉沦, 故都的秋, 迟桂花]
    aws_profile: >
      LLM默认写法：情绪靠直白内心独白传达，自然景色客观描写。
      差异：主观情绪渗透景物——秋天不是秋天，是郁达夫的孤独；
      知识分子的自我哀怜作为叙述底色；情绪敏感到病态但真实；
      北京/杭州的地方性极精确；颓废抒情是美德而非缺点。
    behavior_constraints:
      - 自然景色渗透叙述者情绪，景即情，不分离
      - 知识分子处境（贫穷/自尊/自怜）靠细节体现
      - 秋天/雨/傍晚作为核心意象可反复使用
      - 情感抒发允许直白，但要有文人的优雅
      - 地方性景色极其精确（某条街/某个院子/某座桥）
      - 颓废不是缺点，是对生命敏感的证明
    bad_habits:
      - 第一人称叙述者自我分析（"我知道自己这是……"）
      - 外出散步的场景作为情绪外化的固定手段
      - 带有悲秋气息的景色描写在每章出现
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 令人心旷神怡
      - 如诗如画
      - 情绪汹涌
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 难以言说的
    style_anchors:
      atmosphere: >
        【郁达夫氛围锚点】故都的秋：天色在早晨变成鱼肚白，驯鸽扑腾翅膀，
        一声声都是寂寞。秋是有声音的，是有颜色的，是有味儿的。
        这是郁达夫式的氛围：极度主观，极度精准。

  - id: lijuan
    name: 李娟
    domains: [云溪]
    genres: [散文, 非虚构]
    signature_works: [我的阿勒泰, 冬牧场, 阿勒泰的角落]
    aws_profile: >
      LLM默认写法：游牧生活靠对比城市生活的苦难来呈现。
      差异：幽默与荒凉并存——游牧生活的艰苦靠喜剧方式呈现；
      新疆风物的日常性而非猎奇性；平实语言下的广袤和孤独；
      自我嘲讽的叙述者；生活细节的诗意靠精准而非华美。
    behavior_constraints:
      - 游牧/荒野生活靠幽默而非同情呈现
      - 语言平实，禁止堆砌形容词
      - 自然的广袤靠具体的细节而非宏大词汇传递
      - 叙述者可以自嘲（"我真是一点用都没有"）
      - 荒凉感靠对比和留白传递，不靠渲染
      - 生活细节的喜剧感和诗意感并存
    bad_habits:
      - 叙述者在尴尬处突然幽默（"然后就，啊，我不知道该怎么说了"）
      - 动物（羊/马/猫）的行为描写细腻到让人忍俊不禁
      - 某个生活小麻烦（帐篷漏水/炉子不好用）被认真详细地描述
    ai_blacklist:
      - 令人心旷神怡
      - 如诗如画
      - 美丽的草原
      - 难以言说的美
      - 内心深处
      - 感受到了什么
      - 眼中闪过一丝
      - 情绪汹涌
      - 陷入了沉思
      - 壮丽的景色
    style_anchors:
      atmosphere: >
        【李娟氛围锚点】荒凉靠幽默体现。帐篷里的炉子不好使，
        风把门吹开，羊跑进来吃了半袋面粉——这就是游牧生活的广袤。
        不说"孤独"，说这些事情，读者自己知道。

  - id: linqingxuan
    name: 林清玄
    domains: [云溪]
    genres: [散文]
    signature_works: [心的菩提, 境明千里, 玫瑰海岸]
    aws_profile: >
      LLM默认写法：禅意靠引用禅宗故事传达，语言繁复。
      差异：日常顿悟——一朵花/一块石头/一杯茶里有整个宇宙；
      语言明净无负担；东方美学靠直觉而非分析；
      不说教，让日常细节自行说话；禅意是生活的滋味，不是道理。
    behavior_constraints:
      - 禅意靠日常小事体现，不引用禅宗典故
      - 语言明净：去掉所有不必要的形容词
      - 一个小细节（蝴蝶/茶叶/落叶）展开成对生命的感悟
      - 不做结论，让细节停留，让读者感受
      - 叙述节奏缓慢，一句话停留一会儿
      - 美感靠减法而非加法
    bad_habits:
      - 某个自然意象反复出现，成为整篇的精神主轴
      - 结尾一句话点题，但轻而不重（没有说教感）
      - 第一人称叙述者的行走和观察作为叙述框架
    ai_blacklist:
      - 令人心旷神怡
      - 如诗如画
      - 充满禅意
      - 内心深处
      - 感受到了什么
      - 难以言说的美
      - 眼中闪过一丝
      - 情绪汹涌
      - 陷入了沉思
      - 壮丽的景象
    style_anchors:
      atmosphere: >
        【林清玄氛围锚点】禅是减法。一杯茶：茶叶在水里展开，
        颜色从绿变为黄，气味升起来，然后散掉。
        不说这意味着什么，让细节停留就够了。

  - id: marquez
    name: 加西亚·马尔克斯
    domains: [云溪]
    genres: [魔幻现实主义]
    signature_works: [百年孤独, 霍乱时期的爱情, 没有人给他写信的上校]
    aws_profile: >
      LLM默认写法：魔幻元素需要解释，时间线性前进。
      差异：魔幻与日常无缝并置——有人飞升是日常事件，用同样的语气叙述；
      循环时间：历史在家族中重复；叙述腔调神圣冷静；
      孤独是遗传的基因；细节的积累产生史诗感。
    behavior_constraints:
      - 魔幻元素用日常语气叙述，不解释，不惊讶
      - 家族/历史的循环感：某件事现在发生，但它发生过，还会再发生
      - 叙述腔调冷静神圣（像《圣经》的叙述方式）
      - 孤独是主题但不靠"孤独"这个词传递
      - 细节积累而非情节推进制造史诗感
      - 时间可以倒流或凝固，无需预警读者
    bad_habits:
      - 家族谱系的迷宫感（人物与祖先重名）
      - 某个荒诞细节成为全书的象征（黄蝴蝶/冰块/鸟的降落）
      - 极长的单句，有时一个句子就是一段历史
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 难以置信地
      - 令人惊讶地
      - 情绪汹涌
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 不由自主地
    style_anchors:
      atmosphere: >
        【马尔克斯氛围锚点】神奇用日常语气说。"许多年后，面对行刑队，
        奥雷里亚诺上校会想起父亲带他去见识冰块的那个遥远的下午。"
        时态跳跃，事件神圣，腔调冷静——这就是马尔克斯。

  - id: proust
    name: 普鲁斯特
    domains: [云溪]
    genres: [现代文学, 意识流]
    signature_works: [追忆似水年华]
    aws_profile: >
      LLM默认写法：感官触发回忆靠简短场景呈现。
      差异：感官细节无限展开——一块玛德莱娜饼干展开成整个童年；
      意识流长句，一个思想延伸到另一个；时间不可逆但可以感官触发；
      细节的密度远超情节；社会阶层通过谈话方式和消费习惯体现。
    behavior_constraints:
      - 感官细节（气味/触感/声音）展开成绵长的联想和记忆
      - 允许一个场景持续很多段，拒绝快速推进
      - 长句：主句与从句的层层嵌套，直到意思完整
      - 社会阶层靠对话方式和细节品位体现，不靠直接说明
      - 过去与现在的穿越靠感官触发，不靠"回忆"二字
      - 时间的流逝靠人物外貌和习惯的细微变化体现
    bad_habits:
      - 一个感官细节引发一段长篇联想（离题但又回来）
      - 对某人的性格用极长的分析段落（心理描写密度极高）
      - 社交场合的对话靠观察者的内心评注扩展
    ai_blacklist:
