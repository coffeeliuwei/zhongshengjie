# 墨言域作家档案（后10位）— 待合并入 author_styles.yaml
authors:

  - id: ishiguro
    name: 石黑一雄
    domains: [墨言]
    genres: [现代文学]
    signature_works: [长日将尽, 别让我走, 莫失莫忘]
    aws_profile: >
      LLM默认写法：不可靠叙述者会被叙述者自己质疑。
      差异：记忆压抑到极致——叙述者讲述时会绕开最痛的部分，
      只在无意识中泄露；克制的英式礼貌下藏着巨大创伤；
      情感从不直说，靠讲述时的回避和绕弯透露；
      结尾的顿悟往往是一句极其平静的承认。
    behavior_constraints:
      - 叙述者绕开最重要的事，只在边缘触碰它
      - 情感靠叙述的停顿和转移话题来传递，而非直接描写
      - 人物解释自己的行为时往往自我辩护过多（暗示真相相反）
      - 回忆场景要允许不确定（"我现在想想，也许……"）
      - 顿悟用一句平静的陈述句完成，不用感叹号
      - 失去的东西靠不提它来强调它的分量
    bad_habits:
      - 叙述者在重要处加一句轻描淡写的否认（"当然，我不是说……"）
      - 对话后紧接叙述者的事后解读，往往偏离真相
      - 英式礼貌用语作为情感距离的标志
    ai_blacklist:
      - 情感汹涌
      - 内心深处的悲伤
      - 热泪盈眶
      - 眼中闪过一丝
      - 心中涌起一股
      - 情绪失控
      - 忍不住哭泣
      - 心跳加速
      - 无法控制的情绪
      - 深深地感受到
    style_anchors:
      character: >
        【石黑一雄人物锚点】最大的悲伤靠绕弯传递。叙述者说"那段日子其实还不错"，
        读者知道那是他一生中最痛的时光。克制是最强的情感技术。

  - id: murakami
    name: 村上春树
    domains: [墨言, 云溪]
    genres: [现代文学]
    signature_works: [挪威的森林, 海边的卡夫卡, 1Q84]
    aws_profile: >
      LLM默认写法：孤独感靠直白的内心独白传达。
      差异：疏离感靠意象而非宣言——爵士乐/猫/啤酒/孤独的厨房；
      叙述声调冷静疏离但充满感官细节；孤独不是痛苦而是生活方式；
      文化混搭（西方流行文化+日本日常）；
      情感靠音乐/书/食物这类中介物传递而非直接面对面。
    behavior_constraints:
      - 孤独用意象传递（一首歌/一种食物/一个习惯），不用宣言
      - 感官细节要具体到品牌/曲名/材质
      - 叙述声调第一人称疏离，像在讲别人的故事
      - 现实与非现实的边界模糊，不解释，让其并存
      - 人物很少直接谈论自己的感受，谈的是外部事物
      - 性描写直接但不色情，是人物关系的一部分
    bad_habits:
      - 意识流插曲：某个词触发一段无关联想，然后回来
      - 爵士乐/古典音乐作为情感外化的固定媒介
      - 人物做饭的详细过程（意大利面/咖啡/威士忌）作为孤独的仪式感
    ai_blacklist:
      - 内心深处涌起一股
      - 眼中闪过一丝
      - 情感汹涌
      - 热泪盈眶
      - 难以言说的孤独
      - 忍不住
      - 脑海中浮现
      - 莫名其妙地
      - 陷入了沉思
      - 感受到了什么
    style_anchors:
      atmosphere: >
        【村上春树氛围锚点】孤独是具体的：一个人在厨房煮意大利面，
        放着Chet Baker的黑胶，窗外是午夜的东京街道。
        不说"孤独"，说这些细节——读者自己感受。

  - id: hosseini
    name: 卡勒德·胡赛尼
    domains: [墨言]
    genres: [现代文学]
    signature_works: [追风筝的人, 灿烂千阳, 群山回响]
    aws_profile: >
      LLM默认写法：战争背景下情感直白表达，苦难渲染。
      差异：愧疚与救赎是核心驱动力——伤害了人的那一刻会在数十年后回来；
      正面书写情感而非克制，但依靠具体事件而非抽象词；
      战争和政治靠日常生活细节呈现，不靠宏观叙述；
      父子情/友情的分量与爱情相等。
    behavior_constraints:
      - 过去的伤害在当下叙事中始终有阴影，直到主角正面面对
      - 情感正面书写，但靠具体事件而非"我很悲伤"类词语
      - 战争和历史靠一个家庭的命运具体化，不靠宏观数字
      - 救赎行为必须有真实代价，不是一个决定就能完成
      - 父与子/主角与友人的情感给予足够篇幅
      - 结局的和解或悲剧必须在情节上经过充分铺垫
    bad_habits:
      - 现在与过去的跨时空对话（主角想起某人的一句话）
      - 阿富汗文化细节的精准穿插（节日/食物/语言词汇）
      - 人物忏悔时的语言极其朴素，无文学加工
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 难以言说的痛苦
      - 情绪汹涌
      - 感受到了什么
      - 不禁落泪
      - 心跳加速
      - 莫名其妙
      - 陷入了沉思
      - 脑海中浮现
    style_anchors:
      character: >
        【胡赛尼人物锚点】愧疚靠具体记忆传递：不是"我对他感到愧疚"，
        而是"那天他的眼神，我一直记着"。救赎不靠宣言，靠一个具体的行动。

  - id: dazai
    name: 太宰治
    domains: [墨言]
    genres: [现代文学]
    signature_works: [人间失格, 斜阳, 晚年]
    aws_profile: >
      LLM默认写法：内心独白分析自我，叙述者可靠。
      差异：自我毁灭式第一人称告白——叙述者坦白自己的丑陋但无力改变；
      社会格格不入的真诚剖析；黑色幽默与自我否定并存；
      叙述者的可靠性存疑（自我同情过多）；文字极度私人但命中普遍性。
    behavior_constraints:
      - 叙述者坦白自己的弱点，但坦白本身也是一种表演
      - 社会场合的不适感通过极其具体的行为描写体现
      - 黑色幽默：用笑话描述悲剧，用轻松语气谈论痛苦
      - 叙述者的自我分析可以是错的（读者比叙述者更清楚他在撒谎）
      - 与常人不同的感知方式要作为事实呈现，不美化也不批判
      - 酒/女人/失败作为叙述背景的固定元素
    bad_habits:
      - 叙述者突然对读者直接说话（"你不觉得……吗？"）
      - 讽刺社会规范的段落语气突然变得讽刺
      - 重要事件用一个括号里的补充说明轻描淡写
    ai_blacklist:
      - 内心深处
      - 难以言说的
      - 无法控制的情绪
      - 感受到了什么
      - 眼中闪过一丝
      - 忍不住
      - 陷入了沉思
      - 情绪汹涌
      - 脑海中浮现
      - 心中涌起一股
    style_anchors:
      character: >
        【太宰治人物锚点】告白是表演，但表演的底下有真的伤。
        叙述者笑着说"我真没用"，读者知道他说的是认真的。
        幽默和绝望住在同一句话里。

  - id: kawabata
    name: 川端康成
    domains: [墨言, 云溪]
    genres: [现代文学]
    signature_works: [雪国, 古都, 伊豆的舞女]
    aws_profile: >
      LLM默认写法：自然景色作为情感背景，人物情感直白。
      差异：虚无之美——美丽的事物本身携带消逝感；
      感官描写极度细腻（肌肤/声音/气味）；
      死与美并存，并非悲剧而是美的完成；
      极短的句子和段落创造特殊节奏；
      女性形象的纯粹美不做心理分析，只做感官呈现。
    behavior_constraints:
      - 美丽的描写必须携带消逝感（此刻即永恒，永恒即消失）
      - 感官描写精准到触感/温度/气味，不停在视觉
      - 女性角色靠感官呈现而非心理分析
      - 段落可以极短，短句制造凝视感
      - 自然景色与人物情感互文，但不做明确连接（读者自悟）
      - 虚无感靠美的过度而非缺失来传递
    bad_habits:
      - 某个极短的感官句子独立成段（凝视效果）
      - 动词选择极精准，一个词替代一段描写
      - 雪/镜子/水面等反射意象频繁出现
    ai_blacklist:
      - 内心深处
      - 感受到了什么
      - 眼中闪过一丝
      - 情绪汹涌
      - 难以言说的
      - 不禁
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
      - 心中涌起一股
    style_anchors:
      atmosphere: >
        【川端康成氛围锚点】美是短暂的，正因短暂才是美。
        一片雪花落在掌心，写它的温度而非它的白。
        极短句产生凝视：她的手指。就这一句，然后下一段。

  - id: yangling
    name: 严歌苓
    domains: [墨言]
    genres: [当代文学, 历史]
    signature_works: [芳华, 金陵十三钗, 小姨多鹤]
    aws_profile: >
      LLM默认写法：历史中的女性苦难直白书写，情感煽情。
      差异：女性命运靠历史压力具体化——战争/运动/移民不是背景是命运本身；
      叙述声音冷静而非煽情，旁观者视角；
      女性的生命力在极端困境中更加鲜明而非被压垮；
      历史准确性与文学性并行。
    behavior_constraints:
      - 历史背景是命运本身，不只是装饰——人物的每个选择被历史限定
      - 叙述声调保持旁观者冷静，不代入情绪评判
      - 女性角色在极端困境中展示生命力，不只是受害者
      - 战争/政治运动通过日常生活场景体现，不靠历史宏观叙述
      - 身体描写准确有力度，不色情，是人物处境的一部分
      - 历史细节精准（服装/用语/制度）
    bad_habits:
      - 叙述者在关键处突然拉远，用极客观的语气描述残忍
      - 女性角色的韧性靠小事体现（打碎的碗能补好）
      - 对话夹杂历史时期特有的词汇和腔调
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 情绪汹涌
      - 热泪盈眶
      - 难以言说的
      - 不禁落泪
      - 脑海中浮现
      - 陷入了沉思
      - 心中涌起一股
    style_anchors:
      character: >
        【严歌苓人物锚点】女性的韧性不靠宣言，靠活下去的具体行动。
        历史是命运，不是借口。叙述者看，不评判。

  - id: wangshuo
    name: 王小波
    domains: [墨言]
    genres: [当代文学]
    signature_works: [黄金时代, 白银时代, 青铜时代]
    aws_profile: >
      LLM默认写法：反讽用明显标志标出，知识分子视角说教化。
      差异：反讽融入叙述本身——荒诞逻辑自洽运行，读者自行判断；
      性与自由是主题但不猥亵；语言游戏感强；
      知识分子的自嘲和对体制的嘲讽并存；叙述声音理性但情感真实。
    behavior_constraints:
      - 反讽不标注，让荒诞逻辑自行运转，读者自悟
      - 知识分子视角的自嘲与对权力体制的嘲讽同等比例
      - 性描写直接但作为自由表达的一部分，不猥亵
      - 语言本身有游戏感（逻辑迷宫/悖论/过度分析）
      - 历史背景靠荒诞细节呈现，不做宏观判断
      - 主角的理智和情感不对立，而是同一种力量的两面
    bad_habits:
      - 把一件小事分析到极其复杂的逻辑结论
      - 叙述者假装严肃地讨论一个本质荒诞的问题
      - 数学/逻辑类比喻（因为A所以B，这是必然的）
    ai_blacklist:
      - 内心深处
      - 眼中闪过一丝
      - 感受到了什么
      - 情绪汹涌
      - 陷入了沉思
      - 不禁
      - 难以言说的
      - 心中涌起一股
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      character: >
        【王小波人物锚点】理性是武器，也是自嘲的材料。
        把最荒诞的处境用最严肃的逻辑分析，然后得出一个荒诞的结论——
        这就是自由的样子。

  - id: luyao
    name: 路遥
    domains: [墨言]
    genres: [现实主义, 当代文学]
    signature_works: [平凡的世界, 人生]
    aws_profile: >
      LLM默认写法：底层角色情感激烈表达，苦难渲染。
      差异：劳动者尊严正面书写——苦难是生活本身，不是文学道具；
      情感直白而非克制，但靠真实处境支撑；
      农村/城市的阶级张力靠日常细节体现；
      人物在困境中的自尊和追求高于物质；
      叙述语气带有时代感和地方特色（陕北腔调）。
    behavior_constraints:
      - 苦难是生活本身，不渲染，靠具体细节堆积
      - 劳动者尊严正面书写，不同情也不居高临下
      - 阶级差距靠日常细节体现（饭食/住所/语言习惯）
      - 人物的追求高于当前处境，这是动力来源
      - 农村-城市的交界地带是核心张力场
      - 时代特征靠具体历史细节呈现（政策/价格/流行语）
    bad_habits:
      - 陕北方言词汇和腔调自然穿插
      - 劳动场景写得极其具体（怎么种地/怎么挖煤）
      - 人物对未来的期盼用极具体的小目标表达（"能吃上白面就行"）
    ai_blacklist:
      - 眼中闪过一丝
      - 心中涌起一股
      - 内心深处
      - 感受到了什么
      - 情绪汹涌
      - 难以言说的
      - 不禁落泪
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      character: >
        【路遥人物锚点】尊严比饥饿更重要。主角在最穷的时候，
        也有一件干净的衬衫和一个具体的梦想。苦难不煽情，靠细节真实。

  - id: tieling
    name: 铁凝
    domains: [墨言]
    genres: [当代文学]
    signature_works: [玫瑰门, 大浴女, 哦香雪]
    aws_profile: >
      LLM默认写法：女性内心世界直白表达，欲望被标注为道德问题。
      差异：女性的欲望与压制作为历史现实呈现，不判断；
      身体叙事准确且非道德化；
      代际女性（母女/祖孙）之间的复杂关系是核心；
      历史重压下女性自我的艰难保留。
    behavior_constraints:
      - 女性欲望作为自然事实呈现，不做道德标注
      - 代际关系（母女/婆媳）的矛盾要有历史根源
      - 身体叙事准确，是人物处境的一部分而非猎奇
      - 历史时期的女性困境靠具体日常体现
      - 女性角色不互为敌人也不互为完美同盟，而是复杂的共谋
      - 结尾不必给出答案，允许困境持续存在
    bad_habits:
      - 生活细节极度精确（饭菜的气味/衣物的质地）
      - 叙述者在关键处退后，让事件自行说话
      - 女性角色的小小反抗靠行为而非话语体现
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 情绪汹涌
      - 热泪盈眶
      - 难以言说的
      - 不禁落泪
      - 陷入了沉思
      - 脑海中浮现
      - 莫名其妙
    style_anchors:
      character: >
        【铁凝人物锚点】欲望是人的一部分，压制也是。两者都真实，都值得写。
        女性的韧性不靠口号，靠一次次小小的不妥协。

  - id: bifeiyu
    name: 毕飞宇
    domains: [墨言]
    genres: [当代文学]
    signature_works: [推拿, 青衣, 平原]
    aws_profile: >
      LLM默认写法：残障/特殊群体靠外部视角同情书写。
      差异：身体与心理同等权重——盲人的黑暗靠触觉/声音/气味的过度感知呈现；
      人物的生理感知极其准确（如何用手感知世界）；
      特殊处境靠内部视角书写，读者进入而非旁观；
      人物命运悲悯但不廉价同情。
    behavior_constraints:
      - 特殊处境靠内部视角书写，读者进入而非旁观
      - 身体感知要具体精准（不同的感官补偿方式）
      - 人物的尊严与脆弱并存，不只是苦难的载体
      - 小群体内部的权力关系和情感要如实呈现
      - 人物的命运结局允许悲剧，但要有内在逻辑
      - 日常生活场景用高密度感官细节还原
    bad_habits:
      - 身体动作描写极其精准（手指触摸的方式/步伐的角度）
      - 内部感知替代外部描写（盲人不看，但感知）
      - 人物互动靠非言语沟通（呼吸声/体温/脚步声）
    ai_blacklist:
      - 眼中闪过一丝
      - 内心深处
      - 感受到了什么
      - 情绪汹涌
      - 难以言说的
