# ─── 全局质量门控参数 ──────────────────────────────────────────
quality_gate:
  burstiness_threshold: 50      # 句子长度方差阈值，低于此值判定AI感强
  blacklist_max_hits: 3         # AI套句允许命中上限，超过触发重写建议
  blacklist_hit_rate_max: 0.15  # 每句命中率上限（hits/句子数）

# ─── 风格注入参数 ───────────────────────────────────────────────
injection:
  constraints_per_scene: 8     # 每场景注入行为约束条数
  anchor_max_chars: 300        # 风格锚点截断字数
  bad_habits_max: 2            # 每场景注入坏习惯条数（制造quirk）
  auto_normalize: true         # 权重调整后自动归一化
